">本书补充 · 第 4 条是当前最普遍的失守方式：提示注入</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>它和\"越狱\"是两回事：<strong>越狱是用户自己绕限制，注入是攻击者借外部数据下手。</strong> 关键约束：<strong>处在同一个上下文里的 Agent，很难判断自己是否已被注入。</strong> 所以只在\"上下文层\"过滤不够，必须在<strong>执行层</strong>再拦一次——高风险操作交给上下文之外的机制复核 （独立进程、最小权限凭证、沙盒、人在回路）。 → <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=63\" target=\"_blank\" title=\"打开本地文件\">《深入理解 AI Agent》2.4.7 · p.63 <span class=\"pdf-badge\">📄</span></a> · 三层护栏 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=33\" target=\"_blank\" title=\"打开本地文件\">p.33 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 第 4 条依据《深入理解 AI Agent》p.63 / p.33，读完原文后再定去留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这四条要写成文字</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>落到 PRD 里就是 <a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a> 的\"成本与权限红线\"一栏。 接到需求时先过一遍 <a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a>。</p></div></details>\n<hr>\n<h2 id=\"h-7b86e62636\">第二部分 · 评测体系（本层主体）</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">一个根本认知</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>Eval 不是测试工程师的活，是产品定义\"好\"的标准。</strong> 你说不出\"好\"是什么样，研发就只能凭感觉迭代。</p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 先读这两篇（约 40min），再往下看</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-86e7d0ded4\"><span><strong>Anthropic — Demystifying evals for AI agents</strong>（~25min · 本层核心）</span></label><ul><li>重点看：<strong>三层评测的划分</strong>（单步行为 / 轨迹 / 最终结果），以及\"为什么 Agent 不能只看最终答案\"</li><li>下面 3.2–3.5 基本是这篇的落地版</li><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-f6041c868e\"><span><strong>OpenAI — Evaluate agent workflows</strong>（~15min · 实操向）</span></label><ul><li>重点看：测试集怎么搭、打分规则怎么写（0/1 还是分段）</li><li>对应下面 3.6\"测试集从哪来\"</li><li><a class=\"ext\" href=\"https://platform.openai.com/docs/guides/evaluation\" target=\"_blank\" rel=\"noopener\">打开指南</a></li></ul></li></ul></div></details>\n<h3 id=\"h-110cc356d4\">一 · 四件必须分开的事</h3>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">混淆这几件事，是最常见的评测失效原因</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th></th><th>证明什么</th><th>用途</th><th>局限</th></tr></thead><tbody><tr><td>Demo</td><td>这个系统<strong>能</strong>成功一次</td><td>拿预算、对齐认知</td><td>完全没有证据力</td></tr><tr><td>测试集</td><td>昨天的 bug 没再犯</td><td>每次改动前回归</td><td>只能覆盖你想到过的</td></tr><tr><td>在线指标</td><td>今天在真实流量下还行不行</td><td>上线后持续监控</td><td>事后才知道</td></tr><tr><td>内部评估</td><td><strong>我们的改动有没有用</strong></td><td>每次迭代决策</td><td>需要基础设施投入</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">实操提醒</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>供应商或研发只给你看 demo，看不到评测记录和回归集——<strong>按\"未经验证\"处理</strong>。</p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">关于第四件（本书补充）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>前三件回答\"系统行不行\"；第四件回答<strong>\"这次改动有没有用\"</strong>——消融实验、AB 测试、双层特性开关、提示词敏感性。 在模型快速迭代期，这一件比前三件更常用：不换模型只改 Harness，任务准确率也能从 52.8% 提到 66.5%。 → <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=219\" target=\"_blank\" title=\"打开本地文件\">《深入理解 AI Agent》7.10 · p.219 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 「三件 → 四件」依据《深入理解 AI Agent》7.10 · p.219，读完原文后再定去留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<h3 id=\"h-e1ffbe747d\">一·五 · 瓶颈在模型还是在 Harness？</h3>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">两个实验就能分清——本层最该学会的判断工具</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>手段</th><th>固定什么</th><th>变什么</th><th>回答什么问题</th></tr></thead><tbody><tr><td>消融实验</td><td>模型</td><td>逐一关闭 Harness 的组件</td><td>Harness 内部哪个部件重要</td></tr><tr><td>模型替换实验</td><td>Harness</td><td>换成更强 / 更弱的模型</td><td>瓶颈在模型，还是在 Harness</td></tr></tbody></table></div>\n<p><strong>读法：</strong> 换强模型分数不涨 → 瓶颈在 Harness（该优化提示词 / 工具 / 反馈循环）； 换弱模型分数大跌 → 瓶颈在模型能力本身（别让研发继续调 prompt）。</p>\n<p><strong>评审含义：评估的对象不是模型，是\"模型 + Harness\"的组合体。</strong> 同一个模型换个 Harness，表现可能差异悬殊——所以\"效果不好就换模型\"往往是最贵也最没用的反应。 → <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=211\" target=\"_blank\" title=\"打开本地文件\">7.6 p.211-215 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 本小节（含「一·五」整节）依据《深入理解 AI Agent》第 7 章导言与 7.6 · p.211-215，读完原文后再定去留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<h3 id=\"h-399470cc76\">二 · 评测的三个层次</h3>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">从细到粗</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>单步行为</strong> — 这一步工具调对了吗？参数对不对？</li><li><strong>轨迹（过程）</strong> — 走的这条路径合理吗？有没有绕圈？</li><li><strong>最终结果</strong> — 用户的真实意图被满足了吗？</li></ul></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">关键</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>最终答案正确 ≠ 过程正确。<strong>过程错了但结果蒙对，下次就会错。</strong> 所以 Agent 评测必须看轨迹，不能只看答案。</p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">对应资料</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>上面 Anthropic 那篇的\"三层划分\"就是这一节；读的时候对着这张表看，容易记住。</p></div></details>\n<h3 id=\"h-d86979670c\">三 · 轨迹评测的五项打分</h3>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">每次运行都该检查这五件事</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>项</th><th>检查什么</th><th>典型失败</th></tr></thead><tbody><tr><td>工具选择</td><td>这一步该用哪个工具</td><td>该查论文却去搜网页</td></tr><tr><td>参数质量</td><td>传的参数完整正确吗</td><td>关键词漏了限定条件</td></tr><tr><td>检索依据</td><td>引用的内容真的支持结论吗</td><td>有引用但答非所问</td></tr><tr><td>步数效率</td><td>路径合理还是绕圈了</td><td>反复重试同一失败动作</td></tr><tr><td>终止判断</td><td>该停的时候停了吗</td><td>已完成却继续跑，或该升级给人却硬撑</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">对应资料</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>五项里\"步数效率\"和\"终止判断\"最常被漏。 想看真实轨迹长什么样，去 <a class=\"ext\" href=\"https://docs.claude.com/en/docs/claude-code/overview\" target=\"_blank\" rel=\"noopener\">Claude Code 文档</a> 里看一次它的执行过程展示——那是最好的\"轨迹可视化\"样例。</p></div></details>\n<h3 id=\"h-9b3a3972c6\">四 · 按 Agent 类型定指标（不要一套指标打天下）</h3>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">类型不分，指标基本不可用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>Agent 类型</th><th>核心看什么</th><th>别用什么卡它</th></tr></thead><tbody><tr><td>知识问答型</td><td>准确性、忠实性、引用可溯源</td><td>别只看\"通顺不通顺\"</td></tr><tr><td>任务执行型</td><td>工具调对没、系统状态真的变了吗</td><td>别只看它\"说了什么\"</td></tr><tr><td>推理决策型</td><td>推理链成立吗、证据充分吗</td><td>别只看最终结论</td></tr><tr><td>多轮引导型</td><td>记得前文吗、会澄清吗</td><td><strong>别只看单轮</strong></td></tr><tr><td>创意生成型</td><td>相关性、风格、合规底线</td><td>别死磕确定性</td></tr><tr><td>多 Agent 协作型</td><td>路由准不准、交接顺不顺</td><td>别只看端到端</td></tr></tbody></table></div>\n<p><strong>科研助手属于知识问答 + 推理决策的混合型</strong>，重点看忠实性与可溯源。</p></div></details>\n<h3 id=\"h-e71a6f4c6b\">五 · Session 级评测（多轮产品必看）</h3>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">最容易被忽略的失败</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>每一轮单独打分都及格，整段会话却不及格： 用户问成人票答对了，接着问\"小孩呢\"它失忆了，中途改问订单它还在卖票。</p>\n<p><strong>多轮产品必须做整段会话级评测</strong>，检查指代消解、上下文延续、中途改口的应对。</p></div></details>\n<h3 id=\"h-7672c61473\">六 · 测试集从哪来</h3>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">不要自己编用例</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>前 50 个真实线上失败，比任何公开榜单都值钱</strong></li><li>用例四类：正常案例、边界案例（缺字段、超长、冲突）、高风险案例（该拒绝的）、故障案例（超时、返回异常）</li><li>每条用例包含：输入 + 成功定义 + 打分规则（能自动判的自动判，判不了的上人工或模型打分）</li></ul></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">对应资料</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>OpenAI 那篇 evaluation 指南里讲了测试集的组织方式和打分规则写法，直接照它的结构建你们的表。</p></div></details>\n<h3 id=\"h-8ec470d6a1\">七 · 上线后盯什么</h3>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">四个在线信号 + 一个成本</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>信号</th><th>说明</th></tr></thead><tbody><tr><td>放弃率</td><td>用户中途关掉——体验断了</td></tr><tr><td>追问率</td><td>答完还得再问——没解决</td></tr><tr><td>人工接管率</td><td>需要人接手——能力边界暴露</td></tr><tr><td>回归失败率</td><td>改动后旧场景坏没坏</td></tr><tr><td>单次成本</td><td>这个功能能不能长期活下去</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">优先级模型</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>高业务影响 × 高失败率 → 立刻修 高业务影响 × 高单次成本 → 本迭代优化 低影响 × 高复杂度 → 往后放</p></div></details>\n<hr>\n<h2 id=\"h-7e21547357\">动手练习 · 写一套 Eval</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">约 2h，这层最重要的产出</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>挑你们一个科研 Agent 功能，输出：</p>\n<ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-74f29e7711\"><span>它属于哪种 Agent 类型？对应该看哪些指标？</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-737eb2a10e\"><span>20 条用例：正常 8 / 边界 5 / 高风险 4 / 故障 3</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-87ab7e1256\"><span>每条的成功定义与打分规则（0/1 还是 0-2 分档）</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-93ed7bc1d7\"><span>五条轨迹检查项（工具、参数、依据、步数、终止）</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-a5261302c7\"><span>上线后要盯的四个在线信号 + 成本上限</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-4f8d8e080e\"><span>从最近 10 个真实失败 case 里挑 3 条写进测试集</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c925619627\"><span><strong>写清验收口径</strong>：这个功能要求 Pass@k（至少成功一次）还是 Pass^k（连续 k 次都不出错）？把 k 明确写进验收标准</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c628985a0e\"><span><strong>做一次瓶颈定位</strong>：固定 Harness、换一个更强的模型跑同一套用例——分数不涨就说明问题出在 Harness，不是模型</span></label></li></ul></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 本清单最后两项来自《深入理解 AI Agent》（p.196-197 / p.211-215），读完原文后再定去留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<details class=\"callout co-todo\" data-fold><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">书配套实验 · 待做（第 7 章 · p.205）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-3b4e504bf9\"><span><strong>实验 7-3 ★★：构建基于 Rubric 的用户记忆评估系统</strong> —— 改造 <code>chapter3/user-memory-evaluation</code> 框架，把单一 LLM-as-a-Judge（通过/失败+理由）升级为结构化多维度 Rubric：事实正确性（Precision）、事实完整性（Recall）、思考正确性、思考主动性、幻觉检测；四档制评分（优秀/良好/及格/不及格）每档配具体判定标准；幻觉维度一票否决；每个维度提供提示示例和边界案例</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-31f289da9f\"><span><strong>实验 7-4 ★★：Advanced JSON Cards 与 RAG 的对比评估</strong> —— 复用两个第三章项目，在 <code>chapter3/user-memory-evaluation</code> 的 60 个测试用例上公平对比三种配置：纯 Advanced JSON Cards（卡片常驻上下文、无需检索）/ 纯 RAG（对话分块入向量库）/ 混合系统（核心事实常驻 + 原始对话按需检索）；同一组问题共 180 条真实 API 运行轨迹（结果见表 7-3）</span></label></li></ul>\n<p>→ <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=205\" target=\"_blank\" title=\"打开本地文件\">《深入理解 AI Agent》7.5.1 配套实验 · p.205 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<h2 id=\"h-0b47ae6e10\">自测题</h2>\n<details class=\"callout co-question\" data-fold><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">题目 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>研发演示了一个效果很好的 Agent，说可以放量了。你还想看什么？</li><li>评测显示 Task Success 65%，低于目标 85%。下一步最该做什么？</li><li>你们的科研助手在单轮评分里都及格，但用户反馈\"聊到第三轮就乱了\"。问题可能出在哪？</li></ul></div></details>\n<details class=\"callout co-success\" data-fold><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">参考答案 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>要三样：<strong>评测记录（跑过哪些用例、分数多少）、回归集（改了会不会坏）、在线指标（真实流量下的表现）</strong>。只有 demo 等于没验证</li><li><strong>先分类失败再动手。</strong> 拉 10-20 条失败轨迹，按工具失败 / 理解错误 / 检索失败 / 幻觉分类，修占比最高的那类，改完重跑。别直接改 prompt</li><li>大概率是<strong>会话级问题</strong>：上下文延续、指代消解、中途改口的处理。单轮评分看不见这类问题，必须做整段会话级评测</li></ul></div></details>\n<h2 id=\"h-e84b0873ae\">常见坑</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">五个</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>只看最终答案。</strong> Agent 必须看轨迹，过程错会复现</li><li><strong>一套指标打天下。</strong> 知识问答和任务执行的\"好\"完全不同</li><li><strong>用例自己编。</strong> 编出来的都是顺手的例子，测不出真问题</li><li><strong>只看离线分数。</strong> 上线后的放弃率、追问率、接管率更早暴露体验问题</li><li><strong>忘了成本也是指标。</strong> 95% 成功率但单次 5 块钱，业务上可能是失败的</li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>总纲：<a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a> · 上一层：<a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a></li><li>下一层：<a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a></li><li>相关卡：<a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> · <a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a> · <a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a></li></ul></div></details>", "search": " 📝 这层解决什么 ▸ 让你能在评审会上回答两个问题： 这个方案好不好？该不该做？ 技术部分只要\"了解够提问\"， 评测部分是这层的主体 。 💡 资料怎么用 ▸ 每一节的资料就贴在这一节下面 ，读到哪、点哪。 评测部分建议 先读本节开头的两篇，再往下看 ——后面的七个要点都是这两篇的拆解。 目录 学完你能多做什么 第一部分 · 技术了解层（够判断即可） 第二部分 · 评测体系（本层主体） 动手练习 · 写一套 Eval 自测题 常见坑 学完你能多做什么 💡 产出标准 ▸ 拿到一个 Agent 方案，能指出它最可能在第几步崩、为什么 能为功能定义\"好\"的标准，并写成可执行的评测集 能区分\"demo 好看\"和\"线上可靠\"这两件事，不被演示骗 能说出上线后该盯哪几个数，而不是只看一个成功率 第一部分 · 技术了解层（够判断即可） ⚠️ 学习尺度 ▸ 这部分的目标是 够你提问 ，不是够你实现。 判断标准：你能问出正确的问题，就算达标；不需要知道答案怎么算出来。 1. 可靠性 ℹ️ 只需记住 ▸ 步数越多，端到端成功率越低。详见 卡A · 可靠性判断卡 。 评审第一问永远是\"这方案分几步\"，不是\"prompt 写得好不好\"。 2. 成本与延迟 ℹ️ 只需记住 ▸ Agent 真正的贵在 轮次 ，不在单次调用。延迟看 P95 不看平均。 详见 卡B · 成本与延迟判断卡 。 3. 长任务怎么不断 ❝ 三招 + 一个检测（知道名字和用途即可） ▸ 手段 干什么 你该问的问题 压缩（compaction） 把过长的历史压成摘要，重开一段上下文 跑长了会不会失忆？ 结构化笔记 把关键事实、决策、状态写到上下文之外 中途断了，能接着干吗？ 子 Agent 分工 让子任务在独立上下文里跑，只回传摘要 长任务的花费会不会失控？ 漂移检测 检测 Agent 当前假设是否和早前记录矛盾 跑偏了多久能发现？ ✅ 2026 的现状 ▸ 这些能力正在下沉到基础设施层（例如托管式 Agent 运行时把沙箱、权限、检查点打包进去了）。 产品不需要自己造，但必须在方案里明确要求。 ℹ️ 本节资料 · 点开直达 ▸ Anthropic — Effective harnesses for long-running agents （~15min） 重点看：三招的适用对比，以及为什么子 Agent 会\"省上下文但可能费钱\" 打开文章 4. 安全与权限边界 ⚠️ 产品必须定的四件事（技术会变，这四条不变） ▸ Agent 能碰什么、不能碰什么 ——可读写范围、禁止操作清单 什么动作必须人点头 ——涉及写入、外发、付费、不可逆操作 用户数据怎么用 ——保留多久、能否用于训练、能否删除 Agent 读到的内容能不能当指令执行 ——外部数据（网页 / 文档 / 邮件 / 用户上传的 PDF）里的内容必须当\"数据\"处理， 不能当\"指令\"执行 这几条不是\"上线前再补\"，是 架构阶段就要定的 ——事后补权限等于重做。 ⚠️ 本书补充 · 第 4 条是当前最普遍的失守方式：提示注入 ▸ 它和\"越狱\"是两回事： 越狱是用户自己绕限制，注入是攻击者借外部数据下手。 关键约束： 处在同一个上下文里的 Agent，很难判断自己是否已被注入。 所以只在\"上下文层\"过滤不够，必须在 执行层 再拦一次——高风险操作交给上下文之外的机制复核 （独立进程、最小权限凭证、沙盒、人在回路）。 → 《深入理解 AI Agent》2.4.7 · p.63 📄 · 三层护栏 p.33 📄 📌 待复核 · 第 4 条依据《深入理解 AI Agent》p.63 / p.33，读完原文后再定去留 ▸ 📝 这四条要写成文字 ▸ 落到 PRD 里就是 L4 · 落地层 · 能交付 的\"成本与权限红线\"一栏。 接到需求时先过一遍 卡C · 不该做清单 。 第二部分 · 评测体系（本层主体） 💡 一个根本认知 ▸ Eval 不是测试工程师的活，是产品定义\"好\"的标准。 你说不出\"好\"是什么样，研发就只能凭感觉迭代。 ℹ️ 本节资料 · 先读这两篇（约 40min），再往下看 ▸ Anthropic — Demystifying evals for AI agents （~25min · 本层核心） 重点看： 三层评测的划分 （单步行为 / 轨迹 / 最终结果），以及\"为什么 Agent 不能只看最终答案\" 下面 3.2–3.5 基本是这篇的落地版 打开文章 OpenAI — Evaluate agent workflows （~15min · 实操向） 重点看：测试集怎么搭、打分规则怎么写（0/1 还是分段） 对应下面 3.6\"测试集从哪来\" 打开指南 一 · 四件必须分开的事 ❝ 混淆这几件事，是最常见的评测失效原因 ▸ 证明什么 用途 局限 Demo 这个系统 能 成功一次 拿预算、对齐认知 完全没有证据力 测试集 昨天的 bug 没再犯 每次改动前回归 只能覆盖你想到过的 在线指标 今天在真实流量下还行不行 上线后持续监控 事后才知道 内部评估 我们的改动有没有用 每次迭代决策 需要基础设施投入 ⚠️ 实操提醒 ▸ 供应商或研发只给你看 demo，看不到评测记录和回归集—— 按\"未经验证\"处理 。 📝 关于第四件（本书补充） ▸ 前三件回答\"系统行不行\"；第四件回答 \"这次改动有没有用\" ——消融实验、AB 测试、双层特性开关、提示词敏感性。 在模型快速迭代期，这一件比前三件更常用：不换模型只改 Harness，任务准确率也能从 52.8% 提到 66.5%。 → 《深入理解 AI Agent》7.10 · p.219 📄 📌 待复核 · 「三件 → 四件」依据《深入理解 AI Agent》7.10 · p.219，读完原文后再定去留 ▸ 一·五 · 瓶颈在模型还是在 Harness？ ✅ 两个实验就能分清——本层最该学会的判断工具 ▸ 手段 固定什么 变什么 回答什么问题 消融实验 模型 逐一关闭 Harness 的组件 Harness 内部哪个部件重要 模型替换实验 Harness 换成更强 / 更弱的模型 瓶颈在模型，还是在 Harness 读法： 换强模型分数不涨 → 瓶颈在 Harness（该优化提示词 / 工具 / 反馈循环）； 换弱模型分数大跌 → 瓶颈在模型能力本身（别让研发继续调 prompt）。 评审含义：评估的对象不是模型，是\"模型 + Harness\"的组合体。 同一个模型换个 Harness，表现可能差异悬殊——所以\"效果不好就换模型\"往往是最贵也最没用的反应。 → 7.6 p.211-215 📄 📌 待复核 · 本小节（含「一·五」整节）依据《深入理解 AI Agent》第 7 章导言与 7.6 · p.211-215，读完原文后再定去留 ▸ 二 · 评测的三个层次 ℹ️ 从细到粗 ▸ 单步行为 — 这一步工具调对了吗？参数对不对？ 轨迹（过程） — 走的这条路径合理吗？有没有绕圈？ 最终结果 — 用户的真实意图被满足了吗？ ✅ 关键 ▸ 最终答案正确 ≠ 过程正确。 过程错了但结果蒙对，下次就会错。 所以 Agent 评测必须看轨迹，不能只看答案。 📝 对应资料 ▸ 上面 Anthropic 那篇的\"三层划分\"就是这一节；读的时候对着这张表看，容易记住。 三 · 轨迹评测的五项打分 ❝ 每次运行都该检查这五件事 ▸ 项 检查什么 典型失败 工具选择 这一步该用哪个工具 该查论文却去搜网页 参数质量 传的参数完整正确吗 关键词漏了限定条件 检索依据 引用的内容真的支持结论吗 有引用但答非所问 步数效率 路径合理还是绕圈了 反复重试同一失败动作 终止判断 该停的时候停了吗 已完成却继续跑，或该升级给人却硬撑 📝 对应资料 ▸ 五项里\"步数效率\"和\"终止判断\"最常被漏。 想看真实轨迹长什么样，去 Claude Code 文档 里看一次它的执行过程展示——那是最好的\"轨迹可视化\"样例。 四 · 按 Agent 类型定指标（不要一套指标打天下） ❝ 类型不分，指标基本不可用 ▸ Agent 类型 核心看什么 别用什么卡它 知识问答型 准确性、忠实性、引用可溯源 别只看\"通顺不通顺\" 任务执行型 工具调对没、系统状态真的变了吗 别只看它\"说了什么\" 推理决策型 推理链成立吗、证据充分吗 别只看最终结论 多轮引导型 记得前文吗、会澄清吗 别只看单轮 创意生成型 相关性、风格、合规底线 别死磕确定性 多 Agent 协作型 路由准不准、交接顺不顺 别只看端到端 科研助手属于知识问答 + 推理决策的混合型 ，重点看忠实性与可溯源。 五 · Session 级评测（多轮产品必看） ⚠️ 最容易被忽略的失败 ▸ 每一轮单独打分都及格，整段会话却不及格： 用户问成人票答对了，接着问\"小孩呢\"它失忆了，中途改问订单它还在卖票。 多轮产品必须做整段会话级评测 ，检查指代消解、上下文延续、中途改口的应对。 六 · 测试集从哪来 🧪 不要自己编用例 ▸ 前 50 个真实线上失败，比任何公开榜单都值钱 用例四类：正常案例、边界案例（缺字段、超长、冲突）、高风险案例（该拒绝的）、故障案例（超时、返回异常） 每条用例包含：输入 + 成功定义 + 打分规则（能自动判的自动判，判不了的上人工或模型打分） 📝 对应资料 ▸ OpenAI 那篇 evaluation 指南里讲了测试集的组织方式和打分规则写法，直接照它的结构建你们的表。 七 · 上线后盯什么 ❝ 四个在线信号 + 一个成本 ▸ 信号 说明 放弃率 用户中途关掉——体验断了 追问率 答完还得再问——没解决 人工接管率 需要人接手——能力边界暴露 回归失败率 改动后旧场景坏没坏 单次成本 这个功能能不能长期活下去 ✅ 优先级模型 ▸ 高业务影响 × 高失败率 → 立刻修 高业务影响 × 高单次成本 → 本迭代优化 低影响 × 高复杂度 → 往后放 动手练习 · 写一套 Eval 🧪 约 2h，这层最重要的产出 ▸ 挑你们一个科研 Agent 功能，输出： 它属于哪种 Agent 类型？对应该看哪些指标？ 20 条用例：正常 8 / 边界 5 / 高风险 4 / 故障 3 每条的成功定义与打分规则（0/1 还是 0-2 分档） 五条轨迹检查项（工具、参数、依据、步数、终止） 上线后要盯的四个在线信号 + 成本上限 从最近 10 个真实失败 case 里挑 3 条写进测试集 写清验收口径 ：这个功能要求 Pass@k（至少成功一次）还是 Pass^k（连续 k 次都不出错）？把 k 明确写进验收标准 做一次瓶颈定位 ：固定 Harness、换一个更强的模型跑同一套用例——分数不涨就说明问题出在 Harness，不是模型 📌 待复核 · 本清单最后两项来自《深入理解 AI Agent》（p.196-197 / p.211-215），读完原文后再定去留 ▸ 📌 书配套实验 · 待做（第 7 章 · p.205） ▸ 实验 7-3 ★★：构建基于 Rubric 的用户记忆评估系统 —— 改造 chapter3/user-memory-evaluation 框架，把单一 LLM-as-a-Judge（通过/失败+理由）升级为结构化多维度 Rubric：事实正确性（Precision）、事实完整性（Recall）、思考正确性、思考主动性、幻觉检测；四档制评分（优秀/良好/及格/不及格）每档配具体判定标准；幻觉维度一票否决；每个维度提供提示示例和边界案例 实验 7-4 ★★：Advanced JSON Cards 与 RAG 的对比评估 —— 复用两个第三章项目，在 chapter3/user-memory-evaluation 的 60 个测试用例上公平对比三种配置：纯 Advanced JSON Cards（卡片常驻上下文、无需检索）/ 纯 RAG（对话分块入向量库）/ 混合系统（核心事实常驻 + 原始对话按需检索）；同一组问题共 180 条真实 API 运行轨迹（结果见表 7-3） → 《深入理解 AI Agent》7.5.1 配套实验 · p.205 📄 自测题 ❓ 题目 · 点击展开 ▸ 研发演示了一个效果很好的 Agent，说可以放量了。你还想看什么？ 评测显示 Task Success 65%，低于目标 85%。下一步最该做什么？ 你们的科研助手在单轮评分里都及格，但用户反馈\"聊到第三轮就乱了\"。问题可能出在哪？ ✅ 参考答案 · 点击展开 ▸ 要三样： 评测记录（跑过哪些用例、分数多少）、回归集（改了会不会坏）、在线指标（真实流量下的表现） 。只有 demo 等于没验证 先分类失败再动手。 拉 10-20 条失败轨迹，按工具失败 / 理解错误 / 检索失败 / 幻觉分类，修占比最高的那类，改完重跑。别直接改 prompt 大概率是 会话级问题 ：上下文延续、指代消解、中途改口的处理。单轮评分看不见这类问题，必须做整段会话级评测 常见坑 ⚠️ 五个 ▸ 只看最终答案。 Agent 必须看轨迹，过程错会复现 一套指标打天下。 知识问答和任务执行的\"好\"完全不同 用例自己编。 编出来的都是顺手的例子，测不出真问题 只看离线分数。 上线后的放弃率、追问率、接管率更早暴露体验问题 忘了成本也是指标。 95% 成功率但单次 5 块钱，业务上可能是失败的 📝 导航 ▸ 总纲： 00 · 学习总纲 · 上一层： L2 · 结构层 · 能选型 下一层： L4 · 落地层 · 能交付 相关卡： 卡A · 可靠性判断卡 · 卡B · 成本与延迟判断卡 · 卡C · 不该做清单 "}, {"slug": "p-7d408737b8", "title": "L4 · 落地层 · 能交付", "group": "四层主干", "icon": "🧱", "updated": "2026-09-30", "invest": "3-4h", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这层解决什么</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>把前三层的认知，变成<strong>一份能过评审、能落地的产品方案</strong>。 目标不是学新知识，是<strong>产出一个交付物</strong>。</p></div></details>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">资料怎么用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这一层的\"资料\"多半是<strong>要亲自去用的产品</strong>，不是要读的文章。 每个链接点开就是产品本身，带着下面给的四个问题去玩。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-61a4804b56\">学完你能多做什么</a></li><li><a class=\"wl\" href=\"#h-b99a5f76bc\">一 · 科研场景专项</a></li><li><a class=\"wl\" href=\"#h-7935c7aed9\">二 · Agent PRD 六要素</a></li><li><a class=\"wl\" href=\"#h-963f8c25e7\">三 · Agent UX 五模式</a></li><li><a class=\"wl\" href=\"#h-33aca9e152\">四 · 上线路径</a></li><li><a class=\"wl\" href=\"#h-7332a70ef9\">最终项目</a></li><li><a class=\"wl\" href=\"#h-1d8532aae0\">毕业标准</a></li></ul>\n<hr>\n<h2 id=\"h-61a4804b56\">学完你能多做什么</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">产出标准</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>能写出一份包含架构选型、UX 规范、评测标准、成本红线的 Agent PRD</li><li>能为科研场景定义\"可信\"的具体标准</li><li>能规划上线节奏，而不是做完就全量放</li></ul></div></details>\n<h2 id=\"h-b99a5f76bc\">一 · 科研场景专项</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">核心结论</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>科研用户要的是<strong>可溯源、可复核</strong>，不是\"看起来专业\"。 科研场景里幻觉的代价不是答错，是<strong>被写进论文</strong>。 完整内容见 <a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a>，这里只列产品红线。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">四条硬红线</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>每条结论<strong>可点击回溯原文</strong>，粒度到段落 / 页码 / 图表</li><li>涉及具体数字、实验结论、方法描述，<strong>必须有出处</strong>，否则不输出</li><li>检索不到时明确说\"未找到\"，<strong>不允许补全</strong></li><li>标注来源类型：<strong>同行评审 &gt; 预印本 &gt; 学位论文 &gt; 网页</strong></li></ul></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 科研类竞品，直接去用（每个至少 15 分钟，用真实问题）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c9283f3f13\"><span><a class=\"ext\" href=\"https://elicit.com\" target=\"_blank\" rel=\"noopener\">Elicit</a> — 多论文方法对比。<strong>看什么</strong>：它怎么给证据表、没找到时怎么表态</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-f99b276460\"><span><a class=\"ext\" href=\"https://consensus.app\" target=\"_blank\" rel=\"noopener\">Consensus</a> — 搜索聚合型。<strong>看什么</strong>：结论的证据强度怎么分级</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-ab9c76e982\"><span><a class=\"ext\" href=\"https://www.perplexity.ai\" target=\"_blank\" rel=\"noopener\">Perplexity</a> — 通用研究。<strong>看什么</strong>：引用怎么展示、追问怎么引导</span></label></li></ul>\n<p>对照上面四条红线给它们打分：<strong>哪条做到了、哪条没做到、它为什么这么取舍。</strong> 这比读十篇分析文章有用。</p></div></details>\n<h2 id=\"h-7935c7aed9\">二 · Agent PRD 六要素</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">传统 PRD 没有、但 Agent PRD 必须有</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>要素</th><th>要写清什么</th></tr></thead><tbody><tr><td>场景边界</td><td>Agent 负责什么、不负责什么（含禁止操作清单）</td></tr><tr><td>复杂度档位</td><td>直接调用 / 单 Agent+工具 / 多 Agent，以及选择理由</td></tr><tr><td>工具清单</td><td>有哪些工具、每个的描述文案、权限范围</td></tr><tr><td>UX 规范</td><td>透明度要求、等待反馈、失败提示、人工介入点</td></tr><tr><td>评测方案</td><td>指标、测试集、通过线（见 <a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a>）</td></tr><tr><td>成本与权限红线</td><td>单次成本上限、P95 延迟、必须人点头的动作、数据保留策略</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">最容易漏的两条</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>成本上限</strong>和<strong>禁止操作清单</strong>。这两条不写，上线后才发现就已经晚了。</p></div></details>\n<h2 id=\"h-963f8c25e7\">三 · Agent UX 五模式</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">五个设计模式</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>模式</th><th>解决什么</th><th>好的做法</th></tr></thead><tbody><tr><td>过程透明</td><td>用户不知道它在干什么</td><td>展示\"正在搜索 → 正在阅读 → 正在整理\"</td></tr><tr><td>渐进式结果</td><td>等待焦虑</td><td>流式输出，先给中间产物</td></tr><tr><td>来源引用</td><td>不知道能不能信</td><td>每条结论可点开看原文依据</td></tr><tr><td>用户控制</td><td>跑偏了没法干预</td><td>关键节点确认，允许中途改方向</td></tr><tr><td>错误恢复</td><td>出错不知道怎么办</td><td>区分错误类型，给具体下一步</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">2026 新增的一条：允许接管</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>浏览器类和执行类 Agent 现在普遍支持\"用户随时接管\"—— 用户看到它点错了，可以直接接手操作再交还。 <strong>这是控制感的最高形态</strong>，设计高价值任务时应优先考虑。</p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">一条边界</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>透明是展示<strong>在做什么</strong>（步骤），不是展示<strong>在想什么</strong>（原始推理）。 后者既贵又增加认知负担。</p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 2026 值得体验的产品（挑 2 个，每个至少 15 分钟完成真实任务）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>类别</th><th>产品</th><th>看什么</th></tr></thead><tbody><tr><td>研究类</td><td><a class=\"ext\" href=\"https://www.perplexity.ai\" target=\"_blank\" rel=\"noopener\">Perplexity</a>（含 Computer 模式）</td><td>过程展示、引用设计、追问引导</td></tr><tr><td>研究类</td><td><a class=\"ext\" href=\"https://openai.com/index/introducing-chatgpt-agent/\" target=\"_blank\" rel=\"noopener\">ChatGPT Agent</a></td><td>浏览器任务、用户接管</td></tr><tr><td>研究类</td><td><a class=\"ext\" href=\"https://manus.im\" target=\"_blank\" rel=\"noopener\">Manus</a></td><td>单提示跑完多步任务的体验</td></tr><tr><td>编码类</td><td><a class=\"ext\" href=\"https://claude.com/product/claude-code\" target=\"_blank\" rel=\"noopener\">Claude Code</a></td><td>多步任务、出错恢复、用户干预</td></tr><tr><td>编码类</td><td><a class=\"ext\" href=\"https://cursor.com\" target=\"_blank\" rel=\"noopener\">Cursor</a></td><td>IDE 内的 Agent 流程</td></tr><tr><td>编码类</td><td><a class=\"ext\" href=\"https://openai.com/codex/\" target=\"_blank\" rel=\"noopener\">OpenAI Codex</a> / <a class=\"ext\" href=\"https://cognition.ai\" target=\"_blank\" rel=\"noopener\">Devin</a></td><td>异步任务、自主程度与控制感的平衡</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">带着这四个问题去体验（答案直接进你的 PRD）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>我能看到它在做什么吗？（透明度）</li><li>出错了它怎么告诉我？我能插手吗？（控制感与接管）</li><li>等待过程怎么打发？（等待设计）</li><li>结果凭什么可信？（来源与溯源）</li></ul></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本书补充 · 这五个模式的技术底座</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>上面五个模式是<strong>产品语言</strong>；它们背后对应同一套工程机制，知道名字就能和研发对上话：</p>\n<ul><li><strong>过程透明 / 允许接管</strong> ← 异步与事件驱动：把观察从\"Agent 主动去取\"变成\"世界主动推来\"，把动作从\"回合内做完\"变成\"先发起、后续靠事件收尾\"</li><li><strong>渐进式结果</strong> ← 渐进式披露（元数据常驻、细节按需加载）</li><li><strong>来源引用 / 错误恢复</strong> ← 提议者—审核者：产出与评判由<strong>不共享上下文</strong>的两个角色分别承担</li></ul>\n<p>其中\"允许接管\"的关键是<strong>状态确认</strong>：动作执行完 ≠ 目标达成，必须靠新的观察来判定。 → <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=162\" target=\"_blank\" title=\"打开本地文件\">《深入理解 AI Agent》第 6 章 · p.162-191 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 本处映射依据《深入理解 AI Agent》第 6 章（p.162-191），读完原文后再定去留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">一条与你方向相关的支线</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>同一个\"观察与动作空间\"的问题，扩展到物理世界就是第 6 章后半部分： <strong>6.4 Computer Use</strong>（视觉定位、动作后的状态确认、世界模型）与 <strong>6.5 机器人操作</strong>（长程规划与任务分解、VLA 控制及其局限、世界模型、sim2real）。 追问失败原因时可以分成两问：<strong>是抓取失败了，还是规划失败了？</strong> → <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=179\" target=\"_blank\" title=\"打开本地文件\">p.179 <span class=\"pdf-badge\">📄</span></a> · <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=184\" target=\"_blank\" title=\"打开本地文件\">p.184 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 本支线依据《深入理解 AI Agent》6.4–6.5（p.179-191），读完原文后再定去留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<h2 id=\"h-33aca9e152\">四 · 上线路径</h2>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">四步，别做完就全量</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-9b4d3d94ef\"><span><strong>灰度</strong>：先给小部分用户，收集真实失败</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c2de7de5c8\"><span><strong>对照</strong>：能 A/B 就 A/B，看真实行为差异而非主观评价</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-d05606d787\"><span><strong>预期管理</strong>：首次使用时告诉用户它能做什么、不能做什么、错了怎么办</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-0b6c8905d4\"><span><strong>兜底</strong>：失败时给人工入口，不要让用户在死循环里打转</span></label></li></ul></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">最常被低估的一条</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>Agent 功能上线失败，最常见的原因<strong>不是模型不够强，是用户不会用、期望错配</strong>。 首次引导和预期管理，和功能本身同等重要。</p></div></details>\n<h2 id=\"h-7332a70ef9\">最终项目</h2>\n<details class=\"callout co-question\"><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">毕业作业：设计一个科研 Agent</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>场景：用户上传一篇论文 PDF，想知道\"这篇论文的研究方法有什么局限性？\"</p>\n<p>输出六项：</p>\n<ul><li>需求定义 — 用户真实目标是什么（不是功能描述）</li><li>架构选择 — 落在哪个复杂度档位？哪些步骤固定、哪些动态？</li><li>UX 设计 — 60 秒等待怎么展示？结果怎么呈现？出错怎么办？</li><li>评测方案 — 用什么指标？测试集怎么建？</li><li>成本与权限红线 — 单次成本上限？哪些动作必须人点头？</li><li>竞品参照 — 同类产品怎么做的？差异点在哪？（上面 Elicit / Consensus 的体验记录直接拿来用）</li></ul></div></details>\n<details class=\"callout co-success\" data-fold><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">参考答案要点 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>真实动机</strong>：用户在写论文或做评审，想省掉逐行阅读的时间；\"好\"的标准是每条局限性都有依据</li><li><strong>Workflow 为主</strong>：解析 → 定位方法章节 → 分析 → 输出，路径固定；是否补充外部文献可作为局部 Agent 决策</li><li><strong>UX</strong>：立即反馈\"正在解析\"，分步展示进度，结论旁标注来源可点开，解析失败提示\"请确认 PDF 未加密\"</li><li><strong>评测</strong>：20 篇跨领域论文；指标 = 真实性（专家 0-2 分）、有据性、幻觉率、覆盖度</li><li><strong>红线</strong>：单次成本上限、P95 延迟；涉及\"生成结论写入用户文档\"必须人确认</li><li><strong>竞品</strong>：Elicit 做多论文方法对比但不做局限性；Consensus 偏搜索聚合。差异 = 单篇深度 + 外部交叉验证</li></ul></div></details>\n<h2 id=\"h-1d8532aae0\">毕业标准</h2>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">四层走完，你应该能做到</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-bddbb3df75\"><span>能听懂架构讨论，并反问到点上</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-3ead1ed978\"><span>拿到需求能说出该用哪档复杂度并给出理由</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-fe0b38127c\"><span>能为功能定义\"好\"的标准，写出可执行的评测集</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-7ec5072436\"><span>能指出一个方案最可能在哪一步崩</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-fd5373770a\"><span>能写出含成本红线和权限边界的 Agent PRD</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-3b27749684\"><span>能说出一个 AI 产品的体验好在哪、差在哪、为什么</span></label></li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>总纲：<a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a> · 上一层：<a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a></li><li>相关卡：<a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a> · <a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a></li></ul></div></details>", "search": " 📝 这层解决什么 ▸ 把前三层的认知，变成 一份能过评审、能落地的产品方案 。 目标不是学新知识，是 产出一个交付物 。 💡 资料怎么用 ▸ 这一层的\"资料\"多半是 要亲自去用的产品 ，不是要读的文章。 每个链接点开就是产品本身，带着下面给的四个问题去玩。 目录 学完你能多做什么 一 · 科研场景专项 二 · Agent PRD 六要素 三 · Agent UX 五模式 四 · 上线路径 最终项目 毕业标准 学完你能多做什么 💡 产出标准 ▸ 能写出一份包含架构选型、UX 规范、评测标准、成本红线的 Agent PRD 能为科研场景定义\"可信\"的具体标准 能规划上线节奏，而不是做完就全量放 一 · 科研场景专项 ℹ️ 核心结论 ▸ 科研用户要的是 可溯源、可复核 ，不是\"看起来专业\"。 科研场景里幻觉的代价不是答错，是 被写进论文 。 完整内容见 卡D · 科研场景专项卡 ，这里只列产品红线。 ❝ 四条硬红线 ▸ 每条结论 可点击回溯原文 ，粒度到段落 / 页码 / 图表 涉及具体数字、实验结论、方法描述， 必须有出处 ，否则不输出 检索不到时明确说\"未找到\"， 不允许补全 标注来源类型： 同行评审 > 预印本 > 学位论文 > 网页 ℹ️ 本节资料 · 科研类竞品，直接去用（每个至少 15 分钟，用真实问题） ▸ Elicit — 多论文方法对比。 看什么 ：它怎么给证据表、没找到时怎么表态 Consensus — 搜索聚合型。 看什么 ：结论的证据强度怎么分级 Perplexity — 通用研究。 看什么 ：引用怎么展示、追问怎么引导 对照上面四条红线给它们打分： 哪条做到了、哪条没做到、它为什么这么取舍。 这比读十篇分析文章有用。 二 · Agent PRD 六要素 🧪 传统 PRD 没有、但 Agent PRD 必须有 ▸ 要素 要写清什么 场景边界 Agent 负责什么、不负责什么（含禁止操作清单） 复杂度档位 直接调用 / 单 Agent+工具 / 多 Agent，以及选择理由 工具清单 有哪些工具、每个的描述文案、权限范围 UX 规范 透明度要求、等待反馈、失败提示、人工介入点 评测方案 指标、测试集、通过线（见 L3 · 判断层 · 能评估 ） 成本与权限红线 单次成本上限、P95 延迟、必须人点头的动作、数据保留策略 ⚠️ 最容易漏的两条 ▸ 成本上限 和 禁止操作清单 。这两条不写，上线后才发现就已经晚了。 三 · Agent UX 五模式 ❝ 五个设计模式 ▸ 模式 解决什么 好的做法 过程透明 用户不知道它在干什么 展示\"正在搜索 → 正在阅读 → 正在整理\" 渐进式结果 等待焦虑 流式输出，先给中间产物 来源引用 不知道能不能信 每条结论可点开看原文依据 用户控制 跑偏了没法干预 关键节点确认，允许中途改方向 错误恢复 出错不知道怎么办 区分错误类型，给具体下一步 ✅ 2026 新增的一条：允许接管 ▸ 浏览器类和执行类 Agent 现在普遍支持\"用户随时接管\"—— 用户看到它点错了，可以直接接手操作再交还。 这是控制感的最高形态 ，设计高价值任务时应优先考虑。 ⚠️ 一条边界 ▸ 透明是展示 在做什么 （步骤），不是展示 在想什么 （原始推理）。 后者既贵又增加认知负担。 ℹ️ 本节资料 · 2026 值得体验的产品（挑 2 个，每个至少 15 分钟完成真实任务） ▸ 类别 产品 看什么 研究类 Perplexity （含 Computer 模式） 过程展示、引用设计、追问引导 研究类 ChatGPT Agent 浏览器任务、用户接管 研究类 Manus 单提示跑完多步任务的体验 编码类 Claude Code 多步任务、出错恢复、用户干预 编码类 Cursor IDE 内的 Agent 流程 编码类 OpenAI Codex / Devin 异步任务、自主程度与控制感的平衡 💡 带着这四个问题去体验（答案直接进你的 PRD） ▸ 我能看到它在做什么吗？（透明度） 出错了它怎么告诉我？我能插手吗？（控制感与接管） 等待过程怎么打发？（等待设计） 结果凭什么可信？（来源与溯源） ℹ️ 本书补充 · 这五个模式的技术底座 ▸ 上面五个模式是 产品语言 ；它们背后对应同一套工程机制，知道名字就能和研发对上话： 过程透明 / 允许接管 ← 异步与事件驱动：把观察从\"Agent 主动去取\"变成\"世界主动推来\"，把动作从\"回合内做完\"变成\"先发起、后续靠事件收尾\" 渐进式结果 ← 渐进式披露（元数据常驻、细节按需加载） 来源引用 / 错误恢复 ← 提议者—审核者：产出与评判由 不共享上下文 的两个角色分别承担 其中\"允许接管\"的关键是 状态确认 ：动作执行完 ≠ 目标达成，必须靠新的观察来判定。 → 《深入理解 AI Agent》第 6 章 · p.162-191 📄 📌 待复核 · 本处映射依据《深入理解 AI Agent》第 6 章（p.162-191），读完原文后再定去留 ▸ 📝 一条与你方向相关的支线 ▸ 同一个\"观察与动作空间\"的问题，扩展到物理世界就是第 6 章后半部分： 6.4 Computer Use （视觉定位、动作后的状态确认、世界模型）与 6.5 机器人操作 （长程规划与任务分解、VLA 控制及其局限、世界模型、sim2real）。 追问失败原因时可以分成两问： 是抓取失败了，还是规划失败了？ → p.179 📄 · p.184 📄 📌 待复核 · 本支线依据《深入理解 AI Agent》6.4–6.5（p.179-191），读完原文后再定去留 ▸ 四 · 上线路径 📌 四步，别做完就全量 ▸ 灰度 ：先给小部分用户，收集真实失败 对照 ：能 A/B 就 A/B，看真实行为差异而非主观评价 预期管理 ：首次使用时告诉用户它能做什么、不能做什么、错了怎么办 兜底 ：失败时给人工入口，不要让用户在死循环里打转 ⚠️ 最常被低估的一条 ▸ Agent 功能上线失败，最常见的原因 不是模型不够强，是用户不会用、期望错配 。 首次引导和预期管理，和功能本身同等重要。 最终项目 ❓ 毕业作业：设计一个科研 Agent ▸ 场景：用户上传一篇论文 PDF，想知道\"这篇论文的研究方法有什么局限性？\" 输出六项： 需求定义 — 用户真实目标是什么（不是功能描述） 架构选择 — 落在哪个复杂度档位？哪些步骤固定、哪些动态？ UX 设计 — 60 秒等待怎么展示？结果怎么呈现？出错怎么办？ 评测方案 — 用什么指标？测试集怎么建？ 成本与权限红线 — 单次成本上限？哪些动作必须人点头？ 竞品参照 — 同类产品怎么做的？差异点在哪？（上面 Elicit / Consensus 的体验记录直接拿来用） ✅ 参考答案要点 · 点击展开 ▸ 真实动机 ：用户在写论文或做评审，想省掉逐行阅读的时间；\"好\"的标准是每条局限性都有依据 Workflow 为主 ：解析 → 定位方法章节 → 分析 → 输出，路径固定；是否补充外部文献可作为局部 Agent 决策 UX ：立即反馈\"正在解析\"，分步展示进度，结论旁标注来源可点开，解析失败提示\"请确认 PDF 未加密\" 评测 ：20 篇跨领域论文；指标 = 真实性（专家 0-2 分）、有据性、幻觉率、覆盖度 红线 ：单次成本上限、P95 延迟；涉及\"生成结论写入用户文档\"必须人确认 竞品 ：Elicit 做多论文方法对比但不做局限性；Consensus 偏搜索聚合。差异 = 单篇深度 + 外部交叉验证 毕业标准 📌 四层走完，你应该能做到 ▸ 能听懂架构讨论，并反问到点上 拿到需求能说出该用哪档复杂度并给出理由 能为功能定义\"好\"的标准，写出可执行的评测集 能指出一个方案最可能在哪一步崩 能写出含成本红线和权限边界的 Agent PRD 能说出一个 AI 产品的体验好在哪、差在哪、为什么 📝 导航 ▸ 总纲： 00 · 学习总纲 · 上一层： L3 · 判断层 · 能评估 相关卡： 卡D · 科研场景专项卡 · 卡C · 不该做清单 "}, {"slug": "p-b8fd5efc92", "title": "卡A · 可靠性判断卡", "group": "横切判断卡", "icon": "🃏", "updated": "2026-09-30", "invest": "约 1h", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这张卡怎么用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程教你\"Agent 能拆成多少步\"，这张卡补的是另一半：<strong>拆得越多，失败得越快</strong>。 全程没有代码和公式，<strong>你只需要记住 1 句话、3 个数字、3 个该问研发的问题。</strong></p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-a59eac0374\">一句话记住</a></li><li><a class=\"wl\" href=\"#h-9dd806e30d\">三个数字</a></li><li><a class=\"wl\" href=\"#h-aeaca4cb89\">三条判断规则</a></li><li><a class=\"wl\" href=\"#h-8dee405ca4\">该问研发的 3 个问题</a></li><li><a class=\"wl\" href=\"#h-e84b0873ae\">常见坑</a></li><li><a class=\"wl\" href=\"#h-86706b64af\">动手练习</a></li><li><a class=\"wl\" href=\"#h-b7782c5f86\">延伸阅读</a></li></ul>\n<hr>\n<h2 id=\"h-a59eac0374\">一句话记住</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">核心结论</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>Agent 的步数越多越不可靠。想提高成功率，先砍步骤，再谈 prompt。</strong></p>\n<p>每多一步，成功率就要乘一次。这不是模型不够聪明，是概率本身在惩罚长流程。</p></div></details>\n<h2 id=\"h-9dd806e30d\">三个数字</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">记住这个衰减（假设每一步 95% 成功率）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>步数</th><th>端到端成功率</th></tr></thead><tbody><tr><td>1 步</td><td>95%</td></tr><tr><td>5 步</td><td>约 77%</td></tr><tr><td>10 步</td><td>约 60%</td></tr><tr><td>20 步</td><td>约 36%</td></tr></tbody></table></div>\n<p><strong>红线：一个 Agent 主流程超过 7 步，就要警惕了。</strong></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">反过来算（想做到 85% 端到端）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>5 步的方案：每一步要做到 <strong>96.8%</strong></li><li>10 步的方案：每一步要做到 <strong>98.4%</strong> ← 这个水平很难稳定达到</li></ul>\n<p><strong>产品含义：</strong> 与其逼研发把 10 步每步做到 98%，不如把流程砍成 5 步。</p></div></details>\n<h2 id=\"h-aeaca4cb89\">三条判断规则</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">直接用的规则</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>砍步骤优先于优化步骤。</strong> 评审方案时第一个问题永远是\"这步能不能砍掉\"，而不是\"这步能不能做得更好\"</li><li><strong>能重试的步骤，不计入可靠性预算。</strong> 搜索超时重试三次，和一次就定生死，是两个难度</li><li><strong>关键节点插人。</strong> 让用户确认一步，等于把那一步的成功率拉到接近 100%——人就是兜底</li></ul></div></details>\n<h2 id=\"h-8dee405ca4\">该问研发的 3 个问题</h2>\n<details class=\"callout co-question\"><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">评审会上直接问</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>这个方案一共分几步？能不能画给我看？</li><li>每一步的成功率有没有数据？还是只测过端到端？</li><li>哪一步可以砍掉，或者改成\"让用户点一下确认\"？</li></ul></div></details>\n<h2 id=\"h-e84b0873ae\">常见坑</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">四个高频错误</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>看到 65% 就改 prompt。</strong> 大概率不是 prompt 的问题，是步数太多。先数步数</li><li><strong>把\"单步准确率\"当成\"端到端成功率\"。</strong> 研发说\"识别准确率 95%\"，不等于功能成功率 95%</li><li><strong>demo 跑通 ≠ 线上稳定。</strong> demo 用的是顺手挑的例子，线上是真实分布，后者会打你脸</li><li><strong>只看平均值。</strong> 难 case 上的成功率才有意义——平均值会掩盖长尾崩塌</li></ul></div></details>\n<h2 id=\"h-86706b64af\">动手练习</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">约 30min</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>拿你们科研助手的一个真实流程（比如\"上传论文 → 解析 → 定位方法章节 → 分析局限性 → 生成结论\"）：</p>\n<ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-13c8509082\"><span>数清楚它分几步</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-4532a75b12\"><span>假设每步 95%，算出端到端成功率，看和线上实际数据差多少</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-8d563479d3\"><span>标出可以砍掉 / 可以并行 / 可以改成人工确认的步骤</span></label></li></ul></div></details>\n<hr>\n<h2 id=\"h-b7782c5f86\">延伸阅读</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">想深挖再看（约 10min）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-4acbdadc76\"><span><strong>Anthropic — Building Effective Agents</strong> 里\"自主 Agent 必须设停止条件\"那一段</span></label><ul><li>对应本卡\"关键节点插人\"这条：<strong>人不只是兜底，也是最可靠的终止条件</strong></li><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-f32e88944f\"><span><strong>微软架构页</strong>里\"每升一档复杂度就多一份协调开销与失败模式\"的表述</span></label><ul><li>想在 PRD 里说服研发别上多 Agent，直接引这句</li><li><a class=\"ext\" href=\"https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/ai-agent-design-patterns#start-with-the-right-level-of-complexity\" target=\"_blank\" rel=\"noopener\">打开（跳转到该小节）</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-1cf1e7c8a0\"><span><strong>《深入理解 AI Agent》7.2 评估指标：成功的定义</strong>（p.196-197 · 中文 · <strong>本卡最重要的一处升级</strong>）</span></label><ul><li>本卡的\"连乘估算\"有一套更硬的口径，能直接写进验收标准：<ul><li><strong>Pass@k = 1 − (1−p)^k</strong> → k 次里<strong>至少成功一次</strong>，衡量能力上限（技术奇观）</li><li><strong>Pass^k = p^k</strong> → 连续 k 次<strong>每次都成功</strong>，衡量业务可靠性（能上线的标准）</li></ul></li><li>单次成功率 0.6 时：Pass@5 ≈ <strong>99%</strong>，但 Pass^5 ≈ <strong>7.8%</strong>。前者适合发新闻，后者才适合写验收标准</li><li>配套硬约束：<strong>会产生副作用的操作不能\"重试到成功\"</strong>（支付、退款、权限变更、生产部署），必须在沙盒或可回滚环境里采样，每次失败都记入可靠性指标</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=196\" target=\"_blank\" title=\"打开本地文件\">打开 p.196 <span class=\"pdf-badge\">📄</span></a> · 导读 <a class=\"wl\" href=\"#/p-6643528717\">书 · 深入理解 AI Agent · 导读</a> · 完整建议见 <a class=\"wl\" href=\"#/p-380ab2d43a\">课程框架评审 · 2026-09-30</a></li></ul></li></ul></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待定 · 上面这套 Pass@k / Pass^k 口径来自《深入理解 AI Agent》p.196-197。</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>是否用它替换正文「三个数字」的步数连乘，尚未决定</strong>——读完原文后再定。</p></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>主课程：<a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a></li><li>配套：<a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a> · <a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a></li><li><a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a> — 什么时候不该做 Agent</li></ul></div></details>", "search": " 📝 这张卡怎么用 ▸ 课程教你\"Agent 能拆成多少步\"，这张卡补的是另一半： 拆得越多，失败得越快 。 全程没有代码和公式， 你只需要记住 1 句话、3 个数字、3 个该问研发的问题。 目录 一句话记住 三个数字 三条判断规则 该问研发的 3 个问题 常见坑 动手练习 延伸阅读 一句话记住 💡 核心结论 ▸ Agent 的步数越多越不可靠。想提高成功率，先砍步骤，再谈 prompt。 每多一步，成功率就要乘一次。这不是模型不够聪明，是概率本身在惩罚长流程。 三个数字 ❝ 记住这个衰减（假设每一步 95% 成功率） ▸ 步数 端到端成功率 1 步 95% 5 步 约 77% 10 步 约 60% 20 步 约 36% 红线：一个 Agent 主流程超过 7 步，就要警惕了。 ❝ 反过来算（想做到 85% 端到端） ▸ 5 步的方案：每一步要做到 96.8% 10 步的方案：每一步要做到 98.4% ← 这个水平很难稳定达到 产品含义： 与其逼研发把 10 步每步做到 98%，不如把流程砍成 5 步。 三条判断规则 🧪 直接用的规则 ▸ 砍步骤优先于优化步骤。 评审方案时第一个问题永远是\"这步能不能砍掉\"，而不是\"这步能不能做得更好\" 能重试的步骤，不计入可靠性预算。 搜索超时重试三次，和一次就定生死，是两个难度 关键节点插人。 让用户确认一步，等于把那一步的成功率拉到接近 100%——人就是兜底 该问研发的 3 个问题 ❓ 评审会上直接问 ▸ 这个方案一共分几步？能不能画给我看？ 每一步的成功率有没有数据？还是只测过端到端？ 哪一步可以砍掉，或者改成\"让用户点一下确认\"？ 常见坑 ⚠️ 四个高频错误 ▸ 看到 65% 就改 prompt。 大概率不是 prompt 的问题，是步数太多。先数步数 把\"单步准确率\"当成\"端到端成功率\"。 研发说\"识别准确率 95%\"，不等于功能成功率 95% demo 跑通 ≠ 线上稳定。 demo 用的是顺手挑的例子，线上是真实分布，后者会打你脸 只看平均值。 难 case 上的成功率才有意义——平均值会掩盖长尾崩塌 动手练习 🧪 约 30min ▸ 拿你们科研助手的一个真实流程（比如\"上传论文 → 解析 → 定位方法章节 → 分析局限性 → 生成结论\"）： 数清楚它分几步 假设每步 95%，算出端到端成功率，看和线上实际数据差多少 标出可以砍掉 / 可以并行 / 可以改成人工确认的步骤 延伸阅读 ℹ️ 想深挖再看（约 10min） ▸ Anthropic — Building Effective Agents 里\"自主 Agent 必须设停止条件\"那一段 对应本卡\"关键节点插人\"这条： 人不只是兜底，也是最可靠的终止条件 打开文章 微软架构页 里\"每升一档复杂度就多一份协调开销与失败模式\"的表述 想在 PRD 里说服研发别上多 Agent，直接引这句 打开（跳转到该小节） 《深入理解 AI Agent》7.2 评估指标：成功的定义 （p.196-197 · 中文 · 本卡最重要的一处升级 ） 本卡的\"连乘估算\"有一套更硬的口径，能直接写进验收标准： Pass@k = 1 − (1−p)^k → k 次里 至少成功一次 ，衡量能力上限（技术奇观） Pass^k = p^k → 连续 k 次 每次都成功 ，衡量业务可靠性（能上线的标准） 单次成功率 0.6 时：Pass@5 ≈ 99% ，但 Pass^5 ≈ 7.8% 。前者适合发新闻，后者才适合写验收标准 配套硬约束： 会产生副作用的操作不能\"重试到成功\" （支付、退款、权限变更、生产部署），必须在沙盒或可回滚环境里采样，每次失败都记入可靠性指标 打开 p.196 📄 · 导读 书 · 深入理解 AI Agent · 导读 · 完整建议见 课程框架评审 · 2026-09-30 📌 待定 · 上面这套 Pass@k / Pass^k 口径来自《深入理解 AI Agent》p.196-197。 ▸ 是否用它替换正文「三个数字」的步数连乘，尚未决定 ——读完原文后再定。 📝 导航 ▸ 主课程： L2 · 结构层 · 能选型 配套： 卡B · 成本与延迟判断卡 · 卡D · 科研场景专项卡 卡C · 不该做清单 — 什么时候不该做 Agent "}, {"slug": "p-25d04356d0", "title": "卡B · 成本与延迟判断卡", "group": "横切判断卡", "icon": "🃏", "updated": "2026-09-30", "invest": "约 1h", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这张卡怎么用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程只在 Eval 里提了一句\"成本合理吗\"，没给任何判断方法。 这张卡补的是：<strong>单次成本决定这个功能能不能长期活，延迟决定用户会不会等。</strong> 这两个都是产品指标，不是技术指标——你不需要会算，只需要知道该问什么、红线在哪。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-a59eac0374\">一句话记住</a></li><li><a class=\"wl\" href=\"#h-fa24da7b5c\">三条红线</a></li><li><a class=\"wl\" href=\"#h-c97bf7937a\">钱可以从哪省</a></li><li><a class=\"wl\" href=\"#h-8dee405ca4\">该问研发的 3 个问题</a></li><li><a class=\"wl\" href=\"#h-e84b0873ae\">常见坑</a></li><li><a class=\"wl\" href=\"#h-86706b64af\">动手练习</a></li><li><a class=\"wl\" href=\"#h-b7782c5f86\">延伸阅读</a></li></ul>\n<hr>\n<h2 id=\"h-a59eac0374\">一句话记住</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">核心结论</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>Agent 真正的贵，不在一次调用贵，在一次会话要跑十轮。</strong></p>\n<p>单轮问答 1 块钱的体验，做成能自主跑 10 步的 Agent，一次就是 10 块钱量级。 这就是为什么\"效果变好了但这个功能上不了线\"——不是模型不行，是账算不过来。</p></div></details>\n<h2 id=\"h-fa24da7b5c\">三条红线</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">延迟红线（用户体感，跟模型无关）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>时长</th><th>用户状态</th><th>你必须做的事</th></tr></thead><tbody><tr><td>&lt; 3 秒</td><td>无感</td><td>直接给结果</td></tr><tr><td>3-10 秒</td><td>开始焦虑</td><td>必须有步骤反馈</td></tr><tr><td>10-30 秒</td><td>怀疑是不是卡了</td><td>渐进式出结果，先给中间产物</td></tr><tr><td>&gt; 30 秒</td><td>会切走</td><td>改成异步 + 完成后通知</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">成本红线（先定上限，再倒推方案）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>先问自己：这个功能单次成本多少我们就不做了？</li><li>高频功能<strong>必算成本</strong>，低频功能优先算体验</li><li>成本不是研发的事——它决定毛利和能不能定价，是产品的账</li></ul></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">延迟要谈 P95，不谈平均</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>平均 8 秒听起来还行，但如果有 10% 的用户在等 40 秒，那 10% 就是你的差评来源</li><li>汇报和验收一律用 <strong>P95</strong>：\"95% 的请求在 X 秒内完成\"</li></ul></div></details>\n<h2 id=\"h-c97bf7937a\">钱可以从哪省</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">三个产品层面的杠杆（不用懂实现，知道有这三件事就够）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>模型分级路由</strong> — 简单任务用小模型，复杂判断才用大模型。这是产品决策，不是技术细节</li><li><strong>少塞无关内容</strong> — 给模型的 context 越长越贵。塞一堆用不上的资料，是在烧钱买噪音</li><li><strong>相同问题复用结果</strong> — 热门问题没必要每次重新算一遍</li></ul></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">你不需要知道怎么实现，只需要知道</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这三件事<strong>存在</strong>，且在评审时可以要求研发说明\"我们做了哪几项、省了多少\"。</p></div></details>\n<h2 id=\"h-8dee405ca4\">该问研发的 3 个问题</h2>\n<details class=\"callout co-question\"><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">评审会上直接问</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>一次会话大概多少钱（不是一次调用，是用户完整用完一轮）？</li><li>P95 多久？最慢的那 5% 是什么情况导致的？</li><li>如果成本要降一半，方案要砍掉什么？（这个问题的答案往往暴露真实的价值排序）</li></ul></div></details>\n<h2 id=\"h-e84b0873ae\">常见坑</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">四个高频错误</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>只看 demo 效果，不看账。</strong> demo 跑十次不心疼，上线跑十万次是另一回事</li><li><strong>用平均延迟汇报。</strong> 平均会骗人，P95 才是用户体验</li><li><strong>以为\"模型降价了 = 功能便宜了\"。</strong> Agent 的成本是轮次 × 单价，轮次才是大头</li><li><strong>成本超了就砍质量。</strong> 正确顺序是：先砍无关 context、再做模型分级，最后才动能力</li></ul></div></details>\n<h2 id=\"h-86706b64af\">动手练习</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">约 30min</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>挑你们一个已上线（或已设计）的 Agent 功能：</p>\n<ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-1c1adceced\"><span>估算它单次会话要跑几轮、每轮大概多长 context</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-b1170e6a6c\"><span>定一个\"超过这个钱我们就不做了\"的数字</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-776593ad64\"><span>写出 P95 延迟目标，并说明超过目标时用户看到什么</span></label></li></ul></div></details>\n<hr>\n<h2 id=\"h-b7782c5f86\">延伸阅读</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">想深挖再看（约 10min）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-d67fe4d6de\"><span><strong>现查一次单价</strong>：<a class=\"ext\" href=\"https://openai.com/api/pricing/\" target=\"_blank\" rel=\"noopener\">OpenAI 定价</a> · <a class=\"ext\" href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">Anthropic 定价</a></span></label><ul><li>按\"一次会话 × 轮数 × 每轮 context 长度\"自己乘一遍——<strong>亲手算一次，比听研发汇报印象深刻十倍</strong></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-817076cc2b\"><span><strong>OpenAI — Evaluate agent workflows</strong> 里关于成本与延迟作为验收指标的部分</span></label><ul><li>用来支撑\"成本也是评测指标\"这个说法</li><li><a class=\"ext\" href=\"https://platform.openai.com/docs/guides/evaluation\" target=\"_blank\" rel=\"noopener\">打开指南</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-7791f8c0f9\"><span><strong>《深入理解 AI Agent》7.6.3 Agent 系统的成本分析</strong>（p.213-214 · 中文）</span></label><ul><li>重点看：成本怎么按\"一次会话 × 轮数 × 每轮 context\"算，以及模型分级路由的取舍</li><li>配套看 7.10「内部评估基础设施」（消融 / AB 测试）——用来判断一次省钱改动到底有没有伤到质量</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=213\" target=\"_blank\" title=\"打开本地文件\">打开 p.213 <span class=\"pdf-badge\">📄</span></a> · <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=219\" target=\"_blank\" title=\"打开本地文件\">p.219 <span class=\"pdf-badge\">📄</span></a></li></ul></li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>主课程：<a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a></li><li>配套：<a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> · <a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a></li><li><a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a> — 什么时候不该做 Agent</li></ul></div></details>", "search": " 📝 这张卡怎么用 ▸ 课程只在 Eval 里提了一句\"成本合理吗\"，没给任何判断方法。 这张卡补的是： 单次成本决定这个功能能不能长期活，延迟决定用户会不会等。 这两个都是产品指标，不是技术指标——你不需要会算，只需要知道该问什么、红线在哪。 目录 一句话记住 三条红线 钱可以从哪省 该问研发的 3 个问题 常见坑 动手练习 延伸阅读 一句话记住 💡 核心结论 ▸ Agent 真正的贵，不在一次调用贵，在一次会话要跑十轮。 单轮问答 1 块钱的体验，做成能自主跑 10 步的 Agent，一次就是 10 块钱量级。 这就是为什么\"效果变好了但这个功能上不了线\"——不是模型不行，是账算不过来。 三条红线 ❝ 延迟红线（用户体感，跟模型无关） ▸ 时长 用户状态 你必须做的事 < 3 秒 无感 直接给结果 3-10 秒 开始焦虑 必须有步骤反馈 10-30 秒 怀疑是不是卡了 渐进式出结果，先给中间产物 > 30 秒 会切走 改成异步 + 完成后通知 ❝ 成本红线（先定上限，再倒推方案） ▸ 先问自己：这个功能单次成本多少我们就不做了？ 高频功能 必算成本 ，低频功能优先算体验 成本不是研发的事——它决定毛利和能不能定价，是产品的账 ❝ 延迟要谈 P95，不谈平均 ▸ 平均 8 秒听起来还行，但如果有 10% 的用户在等 40 秒，那 10% 就是你的差评来源 汇报和验收一律用 P95 ：\"95% 的请求在 X 秒内完成\" 钱可以从哪省 🧪 三个产品层面的杠杆（不用懂实现，知道有这三件事就够） ▸ 模型分级路由 — 简单任务用小模型，复杂判断才用大模型。这是产品决策，不是技术细节 少塞无关内容 — 给模型的 context 越长越贵。塞一堆用不上的资料，是在烧钱买噪音 相同问题复用结果 — 热门问题没必要每次重新算一遍 📝 你不需要知道怎么实现，只需要知道 ▸ 这三件事 存在 ，且在评审时可以要求研发说明\"我们做了哪几项、省了多少\"。 该问研发的 3 个问题 ❓ 评审会上直接问 ▸ 一次会话大概多少钱（不是一次调用，是用户完整用完一轮）？ P95 多久？最慢的那 5% 是什么情况导致的？ 如果成本要降一半，方案要砍掉什么？（这个问题的答案往往暴露真实的价值排序） 常见坑 ⚠️ 四个高频错误 ▸ 只看 demo 效果，不看账。 demo 跑十次不心疼，上线跑十万次是另一回事 用平均延迟汇报。 平均会骗人，P95 才是用户体验 以为\"模型降价了 = 功能便宜了\"。 Agent 的成本是轮次 × 单价，轮次才是大头 成本超了就砍质量。 正确顺序是：先砍无关 context、再做模型分级，最后才动能力 动手练习 🧪 约 30min ▸ 挑你们一个已上线（或已设计）的 Agent 功能： 估算它单次会话要跑几轮、每轮大概多长 context 定一个\"超过这个钱我们就不做了\"的数字 写出 P95 延迟目标，并说明超过目标时用户看到什么 延伸阅读 ℹ️ 想深挖再看（约 10min） ▸ 现查一次单价 ： OpenAI 定价 · Anthropic 定价 按\"一次会话 × 轮数 × 每轮 context 长度\"自己乘一遍—— 亲手算一次，比听研发汇报印象深刻十倍 OpenAI — Evaluate agent workflows 里关于成本与延迟作为验收指标的部分 用来支撑\"成本也是评测指标\"这个说法 打开指南 《深入理解 AI Agent》7.6.3 Agent 系统的成本分析 （p.213-214 · 中文） 重点看：成本怎么按\"一次会话 × 轮数 × 每轮 context\"算，以及模型分级路由的取舍 配套看 7.10「内部评估基础设施」（消融 / AB 测试）——用来判断一次省钱改动到底有没有伤到质量 打开 p.213 📄 · p.219 📄 📝 导航 ▸ 主课程： L3 · 判断层 · 能评估 配套： 卡A · 可靠性判断卡 · 卡D · 科研场景专项卡 卡C · 不该做清单 — 什么时候不该做 Agent "}, {"slug": "p-a7068eac22", "title": "卡C · 不该做清单", "group": "横切判断卡", "icon": "🃏", "updated": "2026-09-30", "invest": "约 20min", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这张卡怎么用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>前面所有材料都在教\"Agent 能做什么、怎么做\"。 这张卡补另一半：<strong>什么时候不该做。</strong> 产品最贵的能力是 Say No——接到需求时先翻这张卡。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-a59eac0374\">一句话记住</a></li><li><a class=\"wl\" href=\"#h-d6dab7c64e\">五类不该做</a></li><li><a class=\"wl\" href=\"#h-4f142a1acf\">决策反问清单</a></li><li><a class=\"wl\" href=\"#h-22e0117dff\">降级路径</a></li><li><a class=\"wl\" href=\"#h-0b47ae6e10\">自测题</a></li><li><a class=\"wl\" href=\"#h-e84b0873ae\">常见坑</a></li></ul>\n<hr>\n<h2 id=\"h-a59eac0374\">一句话记住</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">核心结论</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>不是所有需求都值得做成 Agent。</strong> 一个\"不该做\"的判断，省下的成本远大于十个\"怎么做\"的优化。</p></div></details>\n<h2 id=\"h-d6dab7c64e\">五类不该做</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">出现任意一条，先别上 Agent</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>类型</th><th>典型场景</th><th>为什么不该</th></tr></thead><tbody><tr><td>确定性任务</td><td>格式转换、字段提取、固定规则计算</td><td>代码几行搞定，用模型是花钱买不稳定</td></tr><tr><td>错误代价极高且无兜底</td><td>医疗建议、法律结论、财务决策</td><td>出错后果不可逆，而 Agent 无法保证 100%</td></tr><tr><td>低频低价值</td><td>一个月用两次的内部小工具</td><td>投入产出不成立，维护成本大于收益</td></tr><tr><td>结果无法验证、也无法溯源</td><td>无法给出处、用户无从判断对错</td><td>用户在\"信不信\"之间反复，信任成本极高</td></tr><tr><td>数据合规不允许</td><td>数据不能外传、不能用于训练</td><td>这是红线，不是优化项</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">中间地带：可以做，但要加约束</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>有的场景价值很高但风险也高（比如科研结论辅助）。 这类<strong>不是不做，是要加三道锁</strong>：人工确认节点、强制出处、可撤回。</p></div></details>\n<h2 id=\"h-4f142a1acf\">决策反问清单</h2>\n<details class=\"callout co-question\"><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">接到 Agent 需求时，先问这五句</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>这件事用<strong>固定规则</strong>能不能做？能就别用模型</li><li>做错了<strong>代价多大</strong>？谁承担？能撤回吗？</li><li>用户<strong>多久用一次</strong>？值得投入吗？</li><li>用户<strong>能判断答案对错吗</strong>？不能的话我们能给出处吗？</li><li>数据<strong>能不能给模型</strong>？合规怎么说？</li></ul></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">快速判断</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>五问里有两问答不上来或答案不妙，就先别做，或者先做小范围验证。</p></div></details>\n<h2 id=\"h-22e0117dff\">降级路径</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">做不动就往下退一档，别硬上</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><pre><code>自主 Agent（多步、自主决策）\n  ↓ 退\n固定 Workflow（步骤写死，模型只做单点判断）\n  ↓ 退\n单次模型调用（一问一答）\n  ↓ 退\n传统功能 + 人工（不用模型）</code></pre>\n<p><strong>降级不丢人。</strong> 能用更简单的方式解决，说明判断对了。</p></div></details>\n<h2 id=\"h-0b47ae6e10\">自测题</h2>\n<details class=\"callout co-question\" data-fold><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">题目 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>老板说\"竞品都有 AI 助手，我们也加一个\"，你第一句该问什么？</li><li>一个\"自动把论文参考文献格式化成指定引用格式\"的需求，该做 Agent 吗？</li></ul></div></details>\n<details class=\"callout co-success\" data-fold><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">参考答案 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>先问<strong>用户在哪一步卡住、这件事现在人工怎么做的、做错了代价多大</strong>。加 AI 不是目标，解决问题才是</li><li><strong>不该。</strong> 引用格式转换是确定性规则任务，写规则比用模型更准更便宜。除非论文来源五花八门、需要理解上下文才能判断引用类型——那才考虑模型辅助，且要人工复核</li></ul></div></details>\n<h2 id=\"h-e84b0873ae\">常见坑</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">四个</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>为了 AI 而上 AI。</strong> 有预算、有 KPI，但没有真实问题</li><li><strong>被 demo 绑架。</strong> 演示效果好不代表场景成立，先验证真实需求频率</li><li><strong>把\"能做\"当成\"该做\"。</strong> 技术可行性 ≠ 产品合理性</li><li><strong>不敢 Say No。</strong> 用降级路径给出替代方案，比硬上一个会崩的 Agent 更专业</li></ul></div></details>\n<hr>\n<h2 id=\"h-b7782c5f86\">延伸阅读</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">想深挖再看（约 10min）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-bfc0be45de\"><span><strong>微软 — AI Agent Orchestration Patterns</strong> 的 \"Start with the right level of complexity\"</span></label><ul><li>本卡的\"降级路径\"就是这一节的反向读法：<strong>先证明低一档不行，再升档</strong></li><li><a class=\"ext\" href=\"https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/ai-agent-design-patterns#start-with-the-right-level-of-complexity\" target=\"_blank\" rel=\"noopener\">打开（跳转到该小节）</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c88b490582\"><span><strong>Anthropic — Building Effective Agents</strong> 开头那句总原则</span></label><ul><li>原文大意：最成功的实现用的是最简单的模式，而不是复杂框架</li><li>需要说服团队\"别上多 Agent\"时，这句话最好用</li><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c2aba96abf\"><span><strong>《深入理解 AI Agent》1.2.4 编排模式</strong>（p.30-33 · 那个反面例子）</span></label><ul><li>重点看：为\"从百万条聊天记录提炼个人记忆\"设计出五级流水线的例子——<strong>每个部件单看都有道理，组合起来低效且不可靠</strong></li><li>把\"别一上来就上复杂架构\"说清楚，直接引这个案例</li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-ee90a95003\"><span><strong>《深入理解 AI Agent》5.2.2 代码作为业务规则的约束</strong>（p.145-148 · 中文）</span></label><ul><li>支撑本卡\"确定性任务\"那一类：<strong>不可逆操作场景里，代码提供的是确定性安全防线，模型提供不了</strong></li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=30\" target=\"_blank\" title=\"打开本地文件\">打开 p.30 <span class=\"pdf-badge\">📄</span></a> · <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=145\" target=\"_blank\" title=\"打开本地文件\">p.145 <span class=\"pdf-badge\">📄</span></a></li></ul></li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>总纲：<a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a></li><li>主课程：<a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a> · <a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a></li><li>配套：<a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> · <a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a> · <a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a></li></ul></div></details>", "search": " 📝 这张卡怎么用 ▸ 前面所有材料都在教\"Agent 能做什么、怎么做\"。 这张卡补另一半： 什么时候不该做。 产品最贵的能力是 Say No——接到需求时先翻这张卡。 目录 一句话记住 五类不该做 决策反问清单 降级路径 自测题 常见坑 一句话记住 💡 核心结论 ▸ 不是所有需求都值得做成 Agent。 一个\"不该做\"的判断，省下的成本远大于十个\"怎么做\"的优化。 五类不该做 ❝ 出现任意一条，先别上 Agent ▸ 类型 典型场景 为什么不该 确定性任务 格式转换、字段提取、固定规则计算 代码几行搞定，用模型是花钱买不稳定 错误代价极高且无兜底 医疗建议、法律结论、财务决策 出错后果不可逆，而 Agent 无法保证 100% 低频低价值 一个月用两次的内部小工具 投入产出不成立，维护成本大于收益 结果无法验证、也无法溯源 无法给出处、用户无从判断对错 用户在\"信不信\"之间反复，信任成本极高 数据合规不允许 数据不能外传、不能用于训练 这是红线，不是优化项 ⚠️ 中间地带：可以做，但要加约束 ▸ 有的场景价值很高但风险也高（比如科研结论辅助）。 这类 不是不做，是要加三道锁 ：人工确认节点、强制出处、可撤回。 决策反问清单 ❓ 接到 Agent 需求时，先问这五句 ▸ 这件事用 固定规则 能不能做？能就别用模型 做错了 代价多大 ？谁承担？能撤回吗？ 用户 多久用一次 ？值得投入吗？ 用户 能判断答案对错吗 ？不能的话我们能给出处吗？ 数据 能不能给模型 ？合规怎么说？ ✅ 快速判断 ▸ 五问里有两问答不上来或答案不妙，就先别做，或者先做小范围验证。 降级路径 🧪 做不动就往下退一档，别硬上 ▸ 自主 Agent（多步、自主决策） ↓ 退 固定 Workflow（步骤写死，模型只做单点判断） ↓ 退 单次模型调用（一问一答） ↓ 退 传统功能 + 人工（不用模型） 降级不丢人。 能用更简单的方式解决，说明判断对了。 自测题 ❓ 题目 · 点击展开 ▸ 老板说\"竞品都有 AI 助手，我们也加一个\"，你第一句该问什么？ 一个\"自动把论文参考文献格式化成指定引用格式\"的需求，该做 Agent 吗？ ✅ 参考答案 · 点击展开 ▸ 先问 用户在哪一步卡住、这件事现在人工怎么做的、做错了代价多大 。加 AI 不是目标，解决问题才是 不该。 引用格式转换是确定性规则任务，写规则比用模型更准更便宜。除非论文来源五花八门、需要理解上下文才能判断引用类型——那才考虑模型辅助，且要人工复核 常见坑 ⚠️ 四个 ▸ 为了 AI 而上 AI。 有预算、有 KPI，但没有真实问题 被 demo 绑架。 演示效果好不代表场景成立，先验证真实需求频率 把\"能做\"当成\"该做\"。 技术可行性 ≠ 产品合理性 不敢 Say No。 用降级路径给出替代方案，比硬上一个会崩的 Agent 更专业 延伸阅读 ℹ️ 想深挖再看（约 10min） ▸ 微软 — AI Agent Orchestration Patterns 的 \"Start with the right level of complexity\" 本卡的\"降级路径\"就是这一节的反向读法： 先证明低一档不行，再升档 打开（跳转到该小节） Anthropic — Building Effective Agents 开头那句总原则 原文大意：最成功的实现用的是最简单的模式，而不是复杂框架 需要说服团队\"别上多 Agent\"时，这句话最好用 打开文章 《深入理解 AI Agent》1.2.4 编排模式 （p.30-33 · 那个反面例子） 重点看：为\"从百万条聊天记录提炼个人记忆\"设计出五级流水线的例子—— 每个部件单看都有道理，组合起来低效且不可靠 把\"别一上来就上复杂架构\"说清楚，直接引这个案例 《深入理解 AI Agent》5.2.2 代码作为业务规则的约束 （p.145-148 · 中文） 支撑本卡\"确定性任务\"那一类： 不可逆操作场景里，代码提供的是确定性安全防线，模型提供不了 打开 p.30 📄 · p.145 📄 📝 导航 ▸ 总纲： 00 · 学习总纲 主课程： L3 · 判断层 · 能评估 · L4 · 落地层 · 能交付 配套： 卡A · 可靠性判断卡 · 卡B · 成本与延迟判断卡 · 卡D · 科研场景专项卡 "}, {"slug": "p-2d90c79ec9", "title": "卡D · 科研场景专项卡", "group": "横切判断卡", "icon": "🃏", "updated": "2026-09-30", "invest": "约 1.5h", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这张卡怎么用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程里\"科研\"只是案例外壳，通用 Agent 知识迁移不到科研场景。 这张卡补的是：<strong>科研用户要的是\"可溯源、可复核\"，不是\"看起来专业\"。</strong> 这是你最该比研发懂的部分——技术同学往往低估科研用户对错误的零容忍。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-a59eac0374\">一句话记住</a></li><li><a class=\"wl\" href=\"#h-8880cd6963\">科研场景的四条特殊约束</a></li><li><a class=\"wl\" href=\"#h-dae4c3d416\">四条设计规则</a></li><li><a class=\"wl\" href=\"#h-8dee405ca4\">该问研发的 3 个问题</a></li><li><a class=\"wl\" href=\"#h-e84b0873ae\">常见坑</a></li><li><a class=\"wl\" href=\"#h-86706b64af\">动手练习</a></li><li><a class=\"wl\" href=\"#h-b7782c5f86\">延伸阅读</a></li></ul>\n<hr>\n<h2 id=\"h-a59eac0374\">一句话记住</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">核心结论</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>科研场景里，幻觉的代价不是\"答错了\"，是\"被写进论文\"。</strong></p>\n<p>普通问答错了，用户骂一句就走；科研场景错了，错误结论会进入用户的论文、开题报告、评审意见。 所以科研产品的第一原则不是\"答得全\"，是<strong>\"宁可说没找到，也不要给一个像模像样的答案\"</strong>。</p></div></details>\n<h2 id=\"h-8880cd6963\">科研场景的四条特殊约束</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">通用 Agent 产品不会遇到，但你会</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>约束</th><th>具体是什么</th><th>为什么致命</th></tr></thead><tbody><tr><td>引用粒度</td><td>要精确到段落 / 页码 / 图表，不是\"来自某篇文献\"</td><td>用户要复核，粒度不够等于没引用</td></tr><tr><td>可信度分级</td><td>同行评审 &gt; 预印本 &gt; 学位论文 &gt; 网页</td><td>混在一起呈现，等于把 arXiv 当定论</td></tr><tr><td>术语歧义</td><td>同一个缩写在不同学科含义完全不同</td><td>通用检索会跨学科串味，结果看着对其实是错的</td></tr><tr><td>错误代价不对称</td><td>编造一个实验结论，用户可能直接引用</td><td>一次幻觉的伤害远大于十次\"我没找到\"</td></tr></tbody></table></div></div></details>\n<h2 id=\"h-dae4c3d416\">四条设计规则</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">直接用的规则</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>每条结论必须可点击回溯原文。</strong> 没有出处的结论，一律降级为\"提示\"或直接不输出</li><li><strong>涉及具体数字、实验结论、方法描述，必须有出处。</strong> 这是硬红线，不是加分项</li><li><strong>检索不到时，明确说\"未找到\"并给下一步建议。</strong> 用户对\"没找到\"的容忍度，远高于对\"错的答案\"的容忍度</li><li><strong>标注来源类型。</strong> 让用户一眼看出这是预印本还是正式发表——这是科研用户的基本阅读习惯</li></ul></div></details>\n<h2 id=\"h-8dee405ca4\">该问研发的 3 个问题</h2>\n<details class=\"callout co-question\"><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">评审会上直接问</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>引用能精确到段落 / 页码吗？还是只能给文献级？</li><li>检索不到内容时，模型会不会\"硬编一个\"？我们有没有兜底检测？</li><li>预印本、正式发表、学位论文在结果里怎么区分？用户看得出吗？</li></ul></div></details>\n<h2 id=\"h-e84b0873ae\">常见坑</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">五个高频错误</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>把\"有引用\"当成\"可信\"。</strong> 引用了但答非所问，是最难被发现、也最伤信任的失败</li><li><strong>用通用 RAG 直接套科研。</strong> 术语、单位、缩写会跨学科出错，而且错得很像对的</li><li><strong>为了\"显得聪明\"而补全。</strong> 模型倾向于给完整答案，科研场景恰恰需要它允许说\"不知道\"</li><li><strong>忽略中英文文献差异。</strong> 中文文献的检索覆盖率、引用格式、作者姓名消歧都是独立问题</li><li><strong>把覆盖率当质量指标。</strong> 找出 20 篇里 18 篇没用，不如准确找出 5 篇真正相关的</li></ul></div></details>\n<h2 id=\"h-86706b64af\">动手练习</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">约 1h，最值得做的一个练习</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>拿一篇你<strong>自己非常熟悉</strong>的论文（熟悉到能判断对错），丢给你们的科研助手，问\"这篇论文的研究方法有什么局限性\"：</p>\n<ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-60d225ebe4\"><span>逐条核对输出的局限性：哪几条是真有的？哪几条是模型编的？</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-60e5883e85\"><span>每条有没有出处？点进去能看到原文吗？</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-6dd5c1b1b4\"><span>故意问一个论文里没有的内容，看它是说\"未找到\"还是硬编</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-f4e41924b3\"><span>把结果记下来——这就是你们的第一批 Eval 失败 case</span></label></li></ul></div></details>\n<hr>\n<h2 id=\"h-b7782c5f86\">延伸阅读</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">想深挖再看（约 20min，去用产品而不是读文章）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-edc52b0a47\"><span><a class=\"ext\" href=\"https://elicit.com\" target=\"_blank\" rel=\"noopener\">Elicit</a> — 多论文方法对比。<strong>看什么</strong>：证据表怎么组织、找不到证据时怎么表态</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-b0c9332924\"><span><a class=\"ext\" href=\"https://consensus.app\" target=\"_blank\" rel=\"noopener\">Consensus</a> — 搜索聚合型。<strong>看什么</strong>：结论的证据强度怎么分级呈现</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-e5a6012742\"><span><a class=\"ext\" href=\"https://www.perplexity.ai\" target=\"_blank\" rel=\"noopener\">Perplexity</a> — 通用研究。<strong>看什么</strong>：引用粒度到什么层级、能不能点到原文</span></label></li></ul>\n<p>拿本卡的四条约束去对照：<strong>哪条做到了、哪条没做到、它为什么这么取舍。</strong></p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">本书补充 · 科研场景一个被忽略的风险：上传的论文可能是攻击载荷</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-d116d85003\"><span><strong>《深入理解 AI Agent》2.4.7 提示注入：上下文安全的核心威胁</strong>（p.63）</span></label><ul><li>科研场景的特殊性：<strong>用户上传的论文 PDF 里可能埋着指令</strong>。Agent 读到的论文内容必须当\"数据\"处理，<strong>不能当\"指令\"执行</strong></li><li>注意区分：越狱是用户自己绕限制，<strong>注入是攻击者借外部数据下手</strong></li><li>关键约束：同一个上下文里的 Agent 判断不了自己是否已被注入 → 必须在执行层再拦一次（独立进程 / 最小权限凭证 / 沙盒 / 人在回路）</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=63\" target=\"_blank\" title=\"打开本地文件\">打开 p.63 <span class=\"pdf-badge\">📄</span></a> · 三层护栏 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=33\" target=\"_blank\" title=\"打开本地文件\">p.33 <span class=\"pdf-badge\">📄</span></a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-3a74dcf8ea\"><span><strong>《深入理解 AI Agent》7.5.2 失败归因：从整条轨迹定位首个错误</strong>（p.206-209 · 中文）</span></label><ul><li>用来把本卡\"动手练习\"里记下的失败 case 变成可定位的问题：<strong>错在哪一步、从哪一步开始错</strong>，而不是只记\"答错了\"</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=206\" target=\"_blank\" title=\"打开本地文件\">打开 p.206 <span class=\"pdf-badge\">📄</span></a></li></ul></li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>主课程：<a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a></li><li>配套：<a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> · <a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a></li><li><a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a> — 什么时候不该做 Agent</li></ul></div></details>", "search": " 📝 这张卡怎么用 ▸ 课程里\"科研\"只是案例外壳，通用 Agent 知识迁移不到科研场景。 这张卡补的是： 科研用户要的是\"可溯源、可复核\"，不是\"看起来专业\"。 这是你最该比研发懂的部分——技术同学往往低估科研用户对错误的零容忍。 目录 一句话记住 科研场景的四条特殊约束 四条设计规则 该问研发的 3 个问题 常见坑 动手练习 延伸阅读 一句话记住 💡 核心结论 ▸ 科研场景里，幻觉的代价不是\"答错了\"，是\"被写进论文\"。 普通问答错了，用户骂一句就走；科研场景错了，错误结论会进入用户的论文、开题报告、评审意见。 所以科研产品的第一原则不是\"答得全\"，是 \"宁可说没找到，也不要给一个像模像样的答案\" 。 科研场景的四条特殊约束 ❝ 通用 Agent 产品不会遇到，但你会 ▸ 约束 具体是什么 为什么致命 引用粒度 要精确到段落 / 页码 / 图表，不是\"来自某篇文献\" 用户要复核，粒度不够等于没引用 可信度分级 同行评审 > 预印本 > 学位论文 > 网页 混在一起呈现，等于把 arXiv 当定论 术语歧义 同一个缩写在不同学科含义完全不同 通用检索会跨学科串味，结果看着对其实是错的 错误代价不对称 编造一个实验结论，用户可能直接引用 一次幻觉的伤害远大于十次\"我没找到\" 四条设计规则 🧪 直接用的规则 ▸ 每条结论必须可点击回溯原文。 没有出处的结论，一律降级为\"提示\"或直接不输出 涉及具体数字、实验结论、方法描述，必须有出处。 这是硬红线，不是加分项 检索不到时，明确说\"未找到\"并给下一步建议。 用户对\"没找到\"的容忍度，远高于对\"错的答案\"的容忍度 标注来源类型。 让用户一眼看出这是预印本还是正式发表——这是科研用户的基本阅读习惯 该问研发的 3 个问题 ❓ 评审会上直接问 ▸ 引用能精确到段落 / 页码吗？还是只能给文献级？ 检索不到内容时，模型会不会\"硬编一个\"？我们有没有兜底检测？ 预印本、正式发表、学位论文在结果里怎么区分？用户看得出吗？ 常见坑 ⚠️ 五个高频错误 ▸ 把\"有引用\"当成\"可信\"。 引用了但答非所问，是最难被发现、也最伤信任的失败 用通用 RAG 直接套科研。 术语、单位、缩写会跨学科出错，而且错得很像对的 为了\"显得聪明\"而补全。 模型倾向于给完整答案，科研场景恰恰需要它允许说\"不知道\" 忽略中英文文献差异。 中文文献的检索覆盖率、引用格式、作者姓名消歧都是独立问题 把覆盖率当质量指标。 找出 20 篇里 18 篇没用，不如准确找出 5 篇真正相关的 动手练习 🧪 约 1h，最值得做的一个练习 ▸ 拿一篇你 自己非常熟悉 的论文（熟悉到能判断对错），丢给你们的科研助手，问\"这篇论文的研究方法有什么局限性\"： 逐条核对输出的局限性：哪几条是真有的？哪几条是模型编的？ 每条有没有出处？点进去能看到原文吗？ 故意问一个论文里没有的内容，看它是说\"未找到\"还是硬编 把结果记下来——这就是你们的第一批 Eval 失败 case 延伸阅读 ℹ️ 想深挖再看（约 20min，去用产品而不是读文章） ▸ Elicit — 多论文方法对比。 看什么 ：证据表怎么组织、找不到证据时怎么表态 Consensus — 搜索聚合型。 看什么 ：结论的证据强度怎么分级呈现 Perplexity — 通用研究。 看什么 ：引用粒度到什么层级、能不能点到原文 拿本卡的四条约束去对照： 哪条做到了、哪条没做到、它为什么这么取舍。 ⚠️ 本书补充 · 科研场景一个被忽略的风险：上传的论文可能是攻击载荷 ▸ 《深入理解 AI Agent》2.4.7 提示注入：上下文安全的核心威胁 （p.63） 科研场景的特殊性： 用户上传的论文 PDF 里可能埋着指令 。Agent 读到的论文内容必须当\"数据\"处理， 不能当\"指令\"执行 注意区分：越狱是用户自己绕限制， 注入是攻击者借外部数据下手 关键约束：同一个上下文里的 Agent 判断不了自己是否已被注入 → 必须在执行层再拦一次（独立进程 / 最小权限凭证 / 沙盒 / 人在回路） 打开 p.63 📄 · 三层护栏 p.33 📄 《深入理解 AI Agent》7.5.2 失败归因：从整条轨迹定位首个错误 （p.206-209 · 中文） 用来把本卡\"动手练习\"里记下的失败 case 变成可定位的问题： 错在哪一步、从哪一步开始错 ，而不是只记\"答错了\" 打开 p.206 📄 📝 导航 ▸ 主课程： L4 · 落地层 · 能交付 配套： 卡A · 可靠性判断卡 · 卡B · 成本与延迟判断卡 卡C · 不该做清单 — 什么时候不该做 Agent "}, {"slug": "p-0d73a9e275", "title": "术语速查表", "group": "参考与工具", "icon": "📚", "updated": "2026-09-30", "invest": "", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">怎么用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>遇到不懂的词来这里查。按三组分类：<strong>模型与基础 / 架构与工程 / 评测与产品</strong>。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-3f6aff9c01\">模型与基础</a></li><li><a class=\"wl\" href=\"#h-02fa219f3f\">架构与工程</a></li><li><a class=\"wl\" href=\"#h-3d64ca988c\">评测与产品</a></li><li><a class=\"wl\" href=\"#h-3452e297e2\">工程与评估（本书补充）</a></li></ul>\n<hr>\n<h2 id=\"h-3f6aff9c01\">模型与基础</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">词汇表</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>术语</th><th>解释</th></tr></thead><tbody><tr><td>LLM</td><td>大语言模型，如 GPT、Claude、Gemini</td></tr><tr><td>推理模型</td><td>先\"想一会\"再回答的模型，慢但更准，适合复杂推理与规划</td></tr><tr><td>多模态</td><td>能处理文字 + 图片 + 音频 + 视频的模型</td></tr><tr><td>Embedding</td><td>嵌入向量，把文字转成数字表示，用于搜索与相似度计算</td></tr><tr><td>Token</td><td>模型处理的最小单位，约 1 个中文字 = 1-2 token</td></tr><tr><td>Context Window</td><td>上下文窗口，模型一次能看到的最大范围</td></tr><tr><td>Temperature</td><td>温度参数，控制随机程度，0=确定，1=发散</td></tr><tr><td>Inference</td><td>推理，模型生成回答的过程（成本与延迟都发生在这里）</td></tr><tr><td>Hallucination</td><td>幻觉，模型编造不存在的内容</td></tr></tbody></table></div></div></details>\n<h2 id=\"h-02fa219f3f\">架构与工程</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">词汇表</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>术语</th><th>解释</th></tr></thead><tbody><tr><td>增强 LLM</td><td>模型 + 检索 + 工具 + 记忆，很多需求到这里就够了</td></tr><tr><td>Agent</td><td>智能体，自己决定下一步做什么</td></tr><tr><td>Workflow</td><td>工作流，路径由代码写死，模型只执行</td></tr><tr><td>Agent Loop</td><td>思考 → 行动 → 观察 → 再思考的循环</td></tr><tr><td>ReAct</td><td>Reasoning + Acting，边推理边行动</td></tr><tr><td>Prompt chaining</td><td>固定子任务串联，中间可加检查点</td></tr><tr><td>Routing</td><td>先分类，再交给专用流程</td></tr><tr><td>Parallelization</td><td>独立子任务并行，或同一任务跑多次投票</td></tr><tr><td>Orchestrator-workers</td><td>主模型动态拆任务、委派、汇总</td></tr><tr><td>Evaluator-optimizer</td><td>一个生成、一个评估，循环到达标</td></tr><tr><td>Handoff</td><td>一个 Agent 把任务交给另一个</td></tr><tr><td>Tool / Function Calling</td><td>模型决定调某个函数，应用执行后把结果还给模型</td></tr><tr><td>ACI</td><td>Agent-Computer Interface，工具对模型而言就是界面；描述文案直接决定调用准确率</td></tr><tr><td>MCP</td><td>Model Context Protocol，Agent 与工具/数据的插头标准</td></tr><tr><td>AAIF</td><td>Agentic AI Foundation，Linux Foundation 旗下，2025-12 起托管 MCP</td></tr><tr><td>RAG</td><td>先检索相关内容再回答，减少编造</td></tr><tr><td>Memory</td><td>记忆，分短期（当前对话）与长期（跨对话持久化）</td></tr><tr><td>Context Engineering</td><td>上下文工程，设计\"模型在每步看到什么、什么时候看到\"</td></tr><tr><td>Compaction</td><td>压缩，把过长历史压成摘要后重开上下文</td></tr><tr><td>Structured notes</td><td>结构化笔记，把关键事实与状态写到上下文之外</td></tr><tr><td>Checkpoint</td><td>检查点，长任务中断后可从此处恢复</td></tr><tr><td>Drift detection</td><td>漂移检测，发现 Agent 当前假设与早前记录矛盾</td></tr><tr><td>Sub-agent</td><td>子 Agent，在独立上下文里跑子任务，只回传摘要</td></tr></tbody></table></div></div></details>\n<h2 id=\"h-3d64ca988c\">评测与产品</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">词汇表</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>术语</th><th>解释</th></tr></thead><tbody><tr><td>Eval</td><td>评测，产品定义\"好\"的标准</td></tr><tr><td>Trace</td><td>追踪日志，记录 Agent 每步决策与工具调用</td></tr><tr><td>单步评测</td><td>这一步工具调对了吗、参数对不对</td></tr><tr><td>轨迹评测</td><td>走的这条路径合理吗（工具、参数、依据、步数、终止五项）</td></tr><tr><td>结果评测</td><td>用户的真实意图被满足了吗</td></tr><tr><td>会话级评测</td><td>整段会话一起评，用于发现\"单轮及格、整段失忆\"</td></tr><tr><td>Session</td><td>会话，多轮产品的评测单位</td></tr><tr><td>Task Success</td><td>任务成功率，完成用户真实意图的比例</td></tr><tr><td>Groundedness</td><td>有据性，回答是否有依据而非编造</td></tr><tr><td>Grounding</td><td>事实基础，回答基于真实数据</td></tr><tr><td>Citation</td><td>引用，标注信息来源（科研场景要精确到段落/页码）</td></tr><tr><td>LLM-as-a-Judge</td><td>用另一个模型来评分</td></tr><tr><td>回归集</td><td>每次改动都要重跑的用例集，用于防止旧场景变坏</td></tr><tr><td>在线指标</td><td>上线后持续监控：放弃率、追问率、人工接管率、单次成本</td></tr><tr><td>P95</td><td>95% 的请求在此时间内完成；谈延迟用 P95，不用平均值</td></tr><tr><td>Human-in-the-loop</td><td>人在回路中，关键决策需要人确认</td></tr><tr><td>Takeover</td><td>接管，用户中途接手操作再交还给 Agent</td></tr><tr><td>Progressive Disclosure</td><td>渐进式展示，不一次性展示全部信息</td></tr><tr><td>Transparency</td><td>透明度，让用户看到 Agent 在做什么（展示步骤，不是展示原始推理）</td></tr></tbody></table></div></div></details>\n<hr>\n<h2 id=\"h-3452e297e2\">工程与评估（本书补充）</h2>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">为什么单独一组</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这一组来自《深入理解 AI Agent》，是课程原本没有、但评审时会听到的词。 详见 <a class=\"wl\" href=\"#/p-6643528717\">书 · 深入理解 AI Agent · 导读</a>。<strong>不需要背，听到不懂的回来查。</strong></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">工程与判断</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>术语</th><th>解释</th></tr></thead><tbody><tr><td>Harness</td><td>模型之外的一切：围绕上下文与工具构建的约束、验证与纠正机制；当下真正的竞争力所在</td></tr><tr><td>Loop engineering</td><td>循环工程，设计 Agent 的循环与停止条件；由 prompt engineering 演进而来</td></tr><tr><td>提议者—审核者</td><td>Proposer-Reviewer，产出与评判由<strong>不共享上下文</strong>的两个角色分别承担（前提：自审不可靠）</td></tr><tr><td>Sidecar</td><td>只读审查进程，提议者—审核者的只读变体</td></tr><tr><td>渐进式披露</td><td>Progressive Disclosure，先给目录、细节按需加载；Agent Skills 是其典型形态</td></tr><tr><td>只增不改</td><td>Append-only，状态只追加不回改，换来可缓存、可重放、可审计</td></tr><tr><td>边界集 + 保留集</td><td>改动要同时在\"应该变\"和\"不该变\"两批样本上验证，只测一边会得出错误结论</td></tr><tr><td>最小 diff + 可回滚</td><td>每次修改尽量小、带来源、可单独回滚，让归因成为可能</td></tr><tr><td>KV Cache</td><td>键值缓存；前缀越稳定命中越高，<strong>改动越靠前、作废的缓存越多</strong></td></tr><tr><td>Prompt Cache</td><td>提示缓存，与 KV Cache 属两个层级的缓存</td></tr><tr><td>Agent Skills</td><td>领域能力的可组合单元：元数据常驻上下文，正文按需加载</td></tr><tr><td>Skill Hub</td><td>用包管理器分发 SKILL.md 的渠道；与 MCP 并列为能力分发的两条渠道</td></tr><tr><td>Agent 状态栏</td><td>把执行环境、时间等元信息放进上下文，解决\"不知道自己现在几点、在哪儿\"</td></tr><tr><td>防呆（Poka-yoke）</td><td>从设计上让错误无法发生（如 SIM 卡缺角），优于\"反复提醒模型别犯错\"</td></tr><tr><td>提示注入</td><td>Prompt Injection，外部数据里埋指令来操纵模型；区别于越狱（那是用户自己绕限制）</td></tr><tr><td>代码作为元能力</td><td>Agent 靠写代码在运行时创造新工具；<strong>通用 Agent = Coding Agent + 文件系统</strong></td></tr><tr><td>Computer Use</td><td>GUI 自动化 Agent；关键是动作空间设计、视觉定位、<strong>动作后的状态确认</strong></td></tr><tr><td>Grounding</td><td>视觉定位，把界面元素与屏幕坐标对应起来</td></tr><tr><td>全双工</td><td>边说边听、可被打断的语音交互形态；另有级联流水线与端到端 Omni 两

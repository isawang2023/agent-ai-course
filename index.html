<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Agent AI · 学习站</title>
<style>
:root{
  --bg:#0d1220; --bg2:#111830; --panel:#151d33; --panel2:#1a2340;
  --border:#253152; --text:#dbe3f4; --text-dim:#8b96b8; --accent:#6ea8fe;
  --accent2:#8be9c8; --radius:12px;
  --co-note:#5b8def; --co-info:#5b8def; --co-tip:#2fbfa4; --co-success:#3fbf6f;
  --co-question:#e0b13f; --co-warning:#e8963f; --co-danger:#e85f5f;
  --co-example:#a97ce0; --co-quote:#7c8aa5; --co-todo:#5b9fde; --co-abstract:#4fc3d9;
  --l1:#7c8aa5; --l2:#5b8def; --l3:#2fbfa4; --l4:#a97ce0;
}
body.light{
  --bg:#f4f6fb; --bg2:#eef1f8; --panel:#ffffff; --panel2:#f2f5fb;
  --border:#dfe4f0; --text:#252c3d; --text-dim:#6b7488; --accent:#2f6fe0;
  --accent2:#149d7c;
  --co-note:#2f6fe0; --co-info:#2f6fe0; --co-tip:#0e9c82; --co-success:#1d9e52;
  --co-question:#b98a10; --co-warning:#c87116; --co-danger:#d64545;
  --co-example:#8452c9; --co-quote:#6b7689; --co-todo:#2f6fe0; --co-abstract:#0f93aa;
  --l1:#6b7689; --l2:#2f6fe0; --l3:#0e9c82; --l4:#8452c9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15.5px;line-height:1.75}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:.88em;font-family:"SF Mono",Menlo,Consolas,monospace}
pre{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:12px 0}
pre code{background:none;border:none;padding:0}
#app{display:flex;min-height:100vh}
/* ---------- 侧边栏 ---------- */
#sidebar{width:290px;min-width:290px;background:var(--bg2);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;overflow-y:auto;padding:20px 14px 40px;transition:margin .25s}
#sidebar.hidden{margin-left:-290px}
.logo{font-size:17px;font-weight:700;padding:6px 10px 16px;display:flex;align-items:center;gap:8px}
.logo .coin{font-size:20px}
.side-group{margin-top:14px}
.side-group-title{font-size:11.5px;letter-spacing:.12em;color:var(--text-dim);padding:4px 10px;text-transform:uppercase}
.side-link{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:var(--text);cursor:pointer;font-size:14px;line-height:1.45}
.side-link:hover{background:var(--panel)}
.side-link.active{background:var(--panel);color:var(--accent);font-weight:600}
.side-link .pg{margin-left:auto;font-size:10.5px;color:var(--text-dim);background:var(--panel2);border-radius:20px;padding:1px 7px;white-space:nowrap}
.side-link.all-done .pg{color:#fff;background:var(--co-success)}
/* ---------- 主区 ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 22px}
#btn-menu{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
#search-box{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 12px}
#search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
#search-box .kbd{font-size:11px;color:var(--text-dim);border:1px solid var(--border);border-radius:5px;padding:0 6px}
#global-progress{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);white-space:nowrap}
#gp-bar{width:110px;height:7px;background:var(--panel2);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
#gp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
#btn-theme{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:14px}
#content{max-width:860px;width:100%;margin:0 auto;padding:34px 30px 90px}
.page-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:11.5px;color:var(--text-dim);background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:2px 10px}
h1{font-size:27px;margin:4px 0 20px;line-height:1.4}
h2{font-size:21px;margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
h3{font-size:17.5px;margin:26px 0 10px;color:var(--accent)}
h4{font-size:15.5px;margin:20px 0 8px}
p{margin:10px 0}
ul,ol{padding-left:24px;margin:10px 0}
li{margin:5px 0}
li ul{margin:4px 0}
blockquote{border-left:3px solid var(--border);padding:4px 16px;margin:12px 0;color:var(--text-dim)}
hr{border:none;border-top:1px solid var(--border);margin:28px 0}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14.5px}
th,td{border:1px solid var(--border);padding:8px 12px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:600;white-space:nowrap}
tr:nth-child(even) td{background:color-mix(in srgb,var(--panel) 45%,transparent)}
.table-wrap{overflow-x:auto}
/* ---------- Callout ---------- */
.callout{border:1px solid;border-radius:var(--radius);margin:16px 0;overflow:hidden;background:var(--panel)}
.callout>summary{display:flex;align-items:center;gap:9px;padding:10px 15px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;user-select:none}
.callout>summary::-webkit-details-marker{display:none}
.callout .co-arrow{margin-left:auto;transition:transform .2s;color:var(--text-dim);font-size:12px}
.callout[open]>summary .co-arrow{transform:rotate(90deg)}
.callout .co-body{padding:4px 16px 12px;border-top:1px dashed color-mix(in srgb,var(--text-dim) 30%,transparent)}
.callout .co-body>:first-child{margin-top:8px}
.callout .co-body>:last-child{margin-bottom:2px}
.callout.co-note{border-color:color-mix(in srgb,var(--co-note) 45%,transparent);background:color-mix(in srgb,var(--co-note) 9%,var(--panel))}
.callout.co-note>summary{color:var(--co-note)}
.callout.co-info{border-color:color-mix(in srgb,var(--co-info) 45%,transparent);background:color-mix(in srgb,var(--co-info) 9%,var(--panel))}
.callout.co-info>summary{color:var(--co-info)}
.callout.co-tip{border-color:color-mix(in srgb,var(--co-tip) 45%,transparent);background:color-mix(in srgb,var(--co-tip) 9%,var(--panel))}
.callout.co-tip>summary{color:var(--co-tip)}
.callout.co-success{border-color:color-mix(in srgb,var(--co-success) 45%,transparent);background:color-mix(in srgb,var(--co-success) 9%,var(--panel))}
.callout.co-success>summary{color:var(--co-success)}
.callout.co-question{border-color:color-mix(in srgb,var(--co-question) 45%,transparent);background:color-mix(in srgb,var(--co-question) 9%,var(--panel))}
.callout.co-question>summary{color:var(--co-question)}
.callout.co-warning{border-color:color-mix(in srgb,var(--co-warning) 45%,transparent);background:color-mix(in srgb,var(--co-warning) 9%,var(--panel))}
.callout.co-warning>summary{color:var(--co-warning)}
.callout.co-danger{border-color:color-mix(in srgb,var(--co-danger) 45%,transparent);background:color-mix(in srgb,var(--co-danger) 9%,var(--panel))}
.callout.co-danger>summary{color:var(--co-danger)}
.callout.co-example{border-color:color-mix(in srgb,var(--co-example) 45%,transparent);background:color-mix(in srgb,var(--co-example) 9%,var(--panel))}
.callout.co-example>summary{color:var(--co-example)}
.callout.co-quote{border-color:color-mix(in srgb,var(--co-quote) 45%,transparent);background:color-mix(in srgb,var(--co-quote) 8%,var(--panel))}
.callout.co-quote>summary{color:var(--co-quote)}
.callout.co-todo{border-color:color-mix(in srgb,var(--co-todo) 45%,transparent);background:color-mix(in srgb,var(--co-todo) 9%,var(--panel))}
.callout.co-todo>summary{color:var(--co-todo)}
.callout.co-abstract{border-color:color-mix(in srgb,var(--co-abstract) 45%,transparent);background:color-mix(in srgb,var(--co-abstract) 9%,var(--panel))}
.callout.co-abstract>summary{color:var(--co-abstract)}
/* ---------- 任务 checkbox ---------- */
label.task{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
label.task input{margin-top:7px;accent-color:var(--co-success);width:15px;height:15px;flex-shrink:0;cursor:pointer}
label.task input:checked+span{color:var(--text-dim);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text-dim) 60%,transparent)}
/* ---------- 搜索结果 ---------- */
#search-overlay{display:none;position:fixed;inset:0;background:rgba(5,8,18,.6);backdrop-filter:blur(3px);z-index:100;padding:9vh 20px 20px}
#search-overlay.show{display:block}
#search-panel{max-width:680px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;max-height:76vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#search-input-lg{width:100%;background:none;border:none;outline:none;color:var(--text);font-size:16px;padding:16px 18px;border-bottom:1px solid var(--border)}
#search-results{overflow-y:auto;padding:8px}
.sr-item{padding:11px 14px;border-radius:9px;cursor:pointer}
.sr-item:hover,.sr-item.sel{background:var(--panel2)}
.sr-item .sr-title{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.sr-item .sr-snip{font-size:12.5px;color:var(--text-dim);margin-top:3px;line-height:1.55}
.sr-item mark{background:color-mix(in srgb,var(--co-question) 45%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.sr-empty{padding:26px;text-align:center;color:var(--text-dim);font-size:14px}
/* ---------- 仪表盘 ---------- */
#dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:6px 0 26px}
.dash-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:transform .15s,border-color .15s}
.dash-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.dash-card .dc-title{font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.dash-card .dc-bar{height:6px;background:var(--panel2);border-radius:10px;margin-top:10px;overflow:hidden;border:1px solid var(--border)}
.dash-card .dc-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s}
.dash-card .dc-num{font-size:11px;color:var(--text-dim);margin-top:6px}
/* ---------- 底部导航 ---------- */
#pager{display:flex;justify-content:space-between;gap:12px;margin-top:46px;padding-top:20px;border-top:1px solid var(--border)}
.pager-btn{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);cursor:pointer;font-size:13.5px;max-width:46%;text-align:left}
.pager-btn:hover{border-color:var(--accent)}
.pager-btn .dir{display:block;font-size:11px;color:var(--text-dim)}
/* ---------- 面包屑（内页） ---------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);margin-bottom:14px}
.crumb a{cursor:pointer}
.crumb a:hover{color:var(--accent);text-decoration:none}
.crumb .sep{opacity:.45}
/* ---------- 首页（落地页） ---------- */
#content.wide{max-width:1120px;padding:0 34px 90px}
.home-hero{padding:52px 0 6px}
.eyebrow{font-size:12.5px;letter-spacing:.1em;color:var(--accent);font-weight:600;margin-bottom:16px}
.home-hero h1{font-size:clamp(30px,4.6vw,46px);line-height:1.2;letter-spacing:-.015em;margin:0 0 12px}
.slogan{font-size:clamp(16px,2vw,20px);color:var(--accent2);font-weight:600;margin-bottom:18px}
.lead{font-size:16px;line-height:1.85;color:var(--text-dim);max-width:640px}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:30px;padding-bottom:32px;border-bottom:1px solid var(--border)}
.btn-primary{background:var(--accent);color:#08101f;border:none;border-radius:11px;padding:13px 24px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s,filter .15s}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:14.5px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.hero-progress{margin-left:auto;display:flex;align-items:center;gap:14px}
.hp-wrap{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.hp-label{font-size:11.5px;color:var(--text-dim);letter-spacing:.04em}
.hp-bar{width:160px;height:7px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}
.hp-num{font-size:23px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hp-num small{font-size:14px;color:var(--text-dim);font-weight:400}
.start-note{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:10px;padding:15px 18px;margin:30px 0 0;font-size:14.5px;line-height:1.75;color:var(--text-dim)}
.start-note .sn-dot{color:var(--accent2);font-size:11px;line-height:1.9}
.start-note b{color:var(--text);font-weight:600}
.section{margin-top:54px}
.sec-head{margin-bottom:20px}
.sec-head h2{font-size:22px;border:none;padding:0;margin:0 0 8px}
.sec-head p{font-size:14.5px;color:var(--text-dim);line-height:1.7;max-width:680px;margin:0}
.path-hint{display:inline-block;font-size:13.5px;line-height:1.6;color:var(--co-tip);background:color-mix(in srgb,var(--co-tip) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--co-tip) 32%,transparent);border-radius:12px;padding:9px 15px;margin-bottom:22px}
/* 四层主干：时间线递进 */
.layer-list{position:relative;padding-left:46px}
.layer-list::before{content:"";position:absolute;left:16px;top:26px;bottom:26px;width:2px;border-radius:2px;opacity:.5;background:linear-gradient(180deg,var(--l1),var(--l2),var(--l3),var(--l4))}
.layer-card{position:relative;display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:14px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.layer-card:hover{transform:translateX(3px);border-color:var(--lc);box-shadow:0 8px 26px rgba(0,0,0,.16)}
.layer-card::before{content:"";position:absolute;left:-36px;top:50%;margin-top:-5.5px;width:11px;height:11px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 4px color-mix(in srgb,var(--lc) 20%,var(--bg))}
.layer-card[data-accent="l1"]{--lc:var(--l1)}
.layer-card[data-accent="l2"]{--lc:var(--l2)}
.layer-card[data-accent="l3"]{--lc:var(--l3)}
.layer-card[data-accent="l4"]{--lc:var(--l4)}
.lc-num{font-size:25px;font-weight:600;color:var(--text-dim);opacity:.32;letter-spacing:-.02em;min-width:36px}
.lc-main{flex:1;min-width:0}
.lc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.lc-code{font-size:12px;font-weight:600;color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,transparent);border:1px solid color-mix(in srgb,var(--lc) 38%,transparent);border-radius:6px;padding:2px 8px}
.lc-name{font-size:17px;font-weight:600}
.lc-ability{font-size:13.5px;color:var(--lc)}
.lc-tag{font-size:11.5px;color:var(--text-dim);border:1px solid var(--border);border-radius:20px;padding:1px 9px}
.lc-tag.hot{color:var(--co-warning);border-color:color-mix(in srgb,var(--co-warning) 42%,transparent);background:color-mix(in srgb,var(--co-warning) 10%,transparent)}
.lc-desc{font-size:14px;color:var(--text-dim);line-height:1.65}
.lc-foot{display:flex;align-items:center;gap:14px;margin-top:11px;font-size:12px;color:var(--text-dim)}
.lc-role{color:var(--lc);font-weight:600}
.lc-bar{flex:1;max-width:180px;height:5px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.lc-fill{height:100%;background:var(--lc);width:0;transition:width .4s}
.lc-go{font-size:17px;color:var(--text-dim);transition:transform .18s,color .18s}
.layer-card:hover .lc-go{transform:translateX(4px);color:var(--lc)}
/* 横切判断卡 */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.judge-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.judge-card:hover{transform:translateY(-3px);border-color:var(--co-warning);box-shadow:0 8px 26px rgba(0,0,0,.16)}
.jc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.jc-code{font-size:11.5px;font-weight:600;color:var(--co-warning);background:color-mix(in srgb,var(--co-warning) 13%,transparent);border-radius:6px;padding:2px 8px}
.jc-when{font-size:11.5px;color:var(--text-dim)}
.jc-name{font-size:15.5px;font-weight:600;margin-bottom:6px}
.jc-one{font-size:13px;color:var(--text-dim);line-height:1.6;min-height:42px}
.jc-foot{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11.5px;color:var(--text-dim)}
.jc-bar{flex:1;height:4px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.jc-fill{height:100%;background:var(--co-warning);width:0;transition:width .4s}
/* 参考与工具 */
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mini-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px 16px;cursor:pointer;transition:border-color .18s,transform .18s}
.mini-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.mc-name{font-size:14.5px;font-weight:600;margin-bottom:5px}
.mc-desc{font-size:12.5px;color:var(--text-dim);line-height:1.6}
.mc-hours{font-size:11.5px;color:var(--text-dim);margin-top:8px;opacity:.75}
.home-footer{margin-top:58px;padding-top:22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim)}
.home-footer a{cursor:pointer}
.side-link.home-link{margin-bottom:8px}
mark.search-hl{background:color-mix(in srgb,var(--co-question) 50%,transparent);color:inherit;border-radius:3px}
.pdf-badge{font-size:.8em;opacity:.75}
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;z-index:60;box-shadow:8px 0 30px rgba(0,0,0,.35)}
  #sidebar.hidden{margin-left:-290px}
  #content{padding:24px 18px 80px}
  #content.wide{padding:0 18px 70px}
  #global-progress #gp-bar{width:60px}
  .home-hero{padding:28px 0 6px}
  .hero-cta{gap:10px}
  .hero-progress{margin-left:0;width:100%;justify-content:space-between}
  .hp-wrap{align-items:flex-start}
  .layer-list{padding-left:34px}
  .layer-list::before{left:12px}
  .layer-card::before{left:-28px}
  .layer-card{padding:15px 16px;gap:12px}
  .lc-num{font-size:18px;min-width:24px}
  .lc-foot{flex-wrap:wrap;gap:10px 14px}
  .lc-bar{max-width:none;flex-basis:100%;order:9}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="logo" onclick="location.hash='#/home'" style="cursor:pointer"><span class="coin">🪙</span> Agent AI · 学习站</div>
    <div id="side-nav"></div>
  </nav>

const DATA = {"pages": [{"slug": "p-e1179c393a", "title": "00 · Agent AI 学习总纲", "group": "总纲", "icon": "🧭", "updated": "2026-09-30", "invest": "", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这份文件是什么</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>整个学习体系的<strong>唯一入口</strong>。所有内容按「能力层级」组织，不按周次。 配色语义：<strong>青=目标 · 蓝=资料 · 紫=动手 · 灰=术语/清单 · 黄=题目 · 绿=答案 · 橙=常见坑</strong></p></div></details>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">资料在哪（两类，别混）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>① 点到点的文章 / 网页</strong> —— 全部拆散内联在 L1-L4 各小节的正下方， 读到哪、链接就在哪，点开直达，不用先跳去查表再手动搜。每条都标了「重点看什么」。 <strong>② 整本外部资料</strong>（如《深入理解 AI Agent》）—— 正文不内联，单独维护一份导读， 并在各层对应小节挂<strong>具体章节</strong>的深链。索引见下方「文件索引」表。</p></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 本处修订由《深入理解 AI Agent》入库引发，尚未确认保留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-05367d8b65\">你的起点在哪</a></li><li><a class=\"wl\" href=\"#h-6a246696d7\">体系地图</a></li><li><a class=\"wl\" href=\"#h-e68d983913\">进度面板</a></li><li><a class=\"wl\" href=\"#h-27aa6234c9\">文件索引</a></li><li><a class=\"wl\" href=\"#h-f64a3e0eb2\">2026 关键变化备忘</a></li><li><a class=\"wl\" href=\"#h-41e64d1a4c\">长期跟踪源</a></li><li><a class=\"wl\" href=\"#h-1ebbd64426\">使用规则</a></li></ul>\n<hr>\n<h2 id=\"h-05367d8b65\">你的起点在哪</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">校准结论（2026-09-30）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>你有<strong>日常使用 AI 的体感</strong>，但缺三样：<strong>技术深度、整体评测、进阶路径</strong>。 所以这份体系<strong>不是从零开始</strong>，而是从你的真实缺口开始。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">四层定位</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>层</th><th>你的现状</th><th>建议投入</th><th>优先级</th></tr></thead><tbody><tr><td>L1 语言层</td><td>已具备七成，日常使用已给体感</td><td>30min 扫一遍</td><td>低</td></tr><tr><td>L2 结构层</td><td>能听懂选型，说不清为什么这么选</td><td>4-6h</td><td>高</td></tr><tr><td>L3 判断层</td><td>几乎空白，最缺</td><td>4-5h</td><td><strong>最高</strong></td></tr><tr><td>L4 落地层</td><td>需转化为可交付的产品方案</td><td>3-4h</td><td>中</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">建议路径</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>L2 → L3（优先）→ L4</strong>，L1 随时查。总计 12-15h。 不要按顺序从 L1 啃到 L4——你已经会的东西不必再学一遍。</p></div></details>\n<hr>\n<h2 id=\"h-6a246696d7\">体系地图</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">四层能力 + 一横切</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>L1 语言层</strong> → <a class=\"wl\" href=\"#/p-ab1ca3904e\">L1 · 语言层 · 能听懂</a> — 能听懂研发在说什么</li><li><strong>L2 结构层</strong> → <a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a> — 能判断该用什么架构</li><li><strong>L3 判断层</strong> → <a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a> — 能判断方案好不好、该不该做</li><li><strong>L4 落地层</strong> → <a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a> — 能输出过评审的产品方案</li></ul>\n<p><strong>横切（随时查，不按顺序）</strong></p>\n<ul><li><a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> · <a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a> · <a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a> · <a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a></li></ul></div></details>\n<details class=\"callout co-abstract\"><summary><span class=\"co-icon\">📄</span><span class=\"co-title\">每层的关系</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>L1 给你词汇，L2 给你结构，L3 给你判断力，L4 把前三样变成交付物。 横切卡不占顺序，遇到对应的问题就翻——它们是<strong>工具，不是课程</strong>。</p></div></details>\n<hr>\n<h2 id=\"h-e68d983913\">进度面板</h2>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">主干（每层开头有更细的清单）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-518dfbc91b\"><span>L1 语言层 · 能听懂（30min，扫一遍即可）</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c9828c023a\"><span>L2 结构层 · 能选型（4-6h）</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-62965201de\"><span>L3 判断层 · 能评估（4-5h，最优先）</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-f790b76c38\"><span>L4 落地层 · 能交付（3-4h）</span></label></li></ul></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">横切卡</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-76dcd6a66d\"><span>卡A 可靠性 — 评审任何多步方案前先看</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-0ffdd5282e\"><span>卡B 成本与延迟 — 立项前先看</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-cb54555bb8\"><span>卡C 不该做清单 — 接到需求时先看</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-5da073a4c1\"><span>卡D 科研专项 — 做科研功能时随时翻</span></label></li></ul></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">资料读没读，直接在各层里打勾</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>每条资料前面都有 <code>- [ ]</code> 复选框，<strong>学完就地打勾</strong>，不用再回这里记进度。</p></div></details>\n<hr>\n<h2 id=\"h-27aa6234c9\">文件索引</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">全部文件</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>文件</th><th>一句话</th><th>投入</th></tr></thead><tbody><tr><td><a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a></td><td>本文件，唯一入口</td><td>—</td></tr><tr><td><a class=\"wl\" href=\"#/p-ab1ca3904e\">L1 · 语言层 · 能听懂</a></td><td>2026 模型生态 + 基础概念（含现查定价入口）</td><td>30min</td></tr><tr><td><a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a></td><td>复杂度三档、Workflow/Agent、ACI、上下文工程、MCP（含 Anthropic 四篇直达链接）</td><td>4-6h</td></tr><tr><td><a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a></td><td>技术了解层 + 2026 评测体系（含两篇 eval 一手资料）</td><td>4-5h</td></tr><tr><td><a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a></td><td>科研专项、PRD 六要素、UX 五模式、竞品体验清单</td><td>3-4h</td></tr><tr><td><a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a></td><td>步数越多越不可靠</td><td>20min</td></tr><tr><td><a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a></td><td>单次成本决定功能能不能活</td><td>20min</td></tr><tr><td><a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a></td><td>产品最贵的能力是 Say No</td><td>20min</td></tr><tr><td><a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a></td><td>科研要可溯源，不是看起来专业</td><td>20min</td></tr><tr><td><a class=\"wl\" href=\"#/p-0d73a9e275\">术语速查表</a></td><td>遇到不懂的词来这里</td><td>随时查</td></tr><tr><td><a class=\"wl\" href=\"#/p-6643528717\">书 · 深入理解 AI Agent · 导读</a></td><td>整本外部资料：工程实现视角（313 页，按需查）</td><td>8-10h</td></tr><tr><td><a class=\"wl\" href=\"#/p-380ab2d43a\">课程框架评审 · 2026-09-30</a></td><td>本套框架要不要改的体检报告（状态已同步：5 已落地 · 1 半落地 · 1 未做）</td><td>20min</td></tr></tbody></table></div></div></details>\n<hr>\n<h2 id=\"h-f64a3e0eb2\">2026 关键变化备忘</h2>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">这些变化会推翻旧结论，务必记住</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>长上下文大幅降价</strong> — \"文档太长所以要 RAG\"不再是默认答案，先算一遍</li><li><strong>MCP 成为行业标准</strong> — 2025-12 归入 Linux Foundation 旗下 Agentic AI Foundation；2026-07-28 规范改为无状态核心</li><li><strong>上下文工程取代 prompt 工程</strong> — 关注\"模型在每步看到什么\"，而非\"提示词怎么写\"</li><li><strong>工具设计被提到界面高度（ACI）</strong> — 工具描述是给模型看的产品文案</li><li><strong>长时能力基础设施化</strong> — 沙箱、权限、检查点下沉到运行时层，产品要提要求而不是自己造</li><li><strong>评测分家</strong> — demo、测试集、在线指标三件事，混为一谈是最常见的失效原因</li><li><strong>Harness（模型之外的一切）成为竞争力所在</strong> — 不换模型、只改 Harness，任务准确率也能从 52.8% 提到 66.5%；</li></ul>\n<p>但要清醒：模型每内化一层约束，就会抹平一批只靠 Harness 建立的优势，Harness 会不断向前沿迁移 （出处与读法见 <a class=\"wl\" href=\"#/p-6643528717\">书 · 深入理解 AI Agent · 导读</a>）</p></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 第 7 条来自《深入理解 AI Agent》，读完原文后再定去留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">已过时，别再引用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><del>GPT-3.5 / 4K context 的例子</del> → 2026 年主流模型 context 普遍 128K+</li><li><del>\"先做 RAG\"是默认方案</del> → 先算成本与失败率再决定</li><li><del>只看最终答案的评测</del> → 必须评轨迹</li></ul></div></details>\n<hr>\n<h2 id=\"h-41e64d1a4c\">长期跟踪源</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">收藏即可，不用系统读（有新东西时来扫一眼）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering\" target=\"_blank\" rel=\"noopener\">Anthropic 工程博客</a> — 一手实践，本体系大部分框架来源</li><li><a class=\"ext\" href=\"https://blog.modelcontextprotocol.io/\" target=\"_blank\" rel=\"noopener\">MCP 官方博客</a> — 规范更新</li><li><a class=\"ext\" href=\"https://platform.openai.com/docs/guides/agents\" target=\"_blank\" rel=\"noopener\">OpenAI 文档 · Agents</a> — 实操向</li><li><a class=\"ext\" href=\"https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/ai-agent-design-patterns\" target=\"_blank\" rel=\"noopener\">Microsoft Azure 架构中心</a> — 选型语言最清晰</li><li><a class=\"ext\" href=\"https://blog.langchain.dev\" target=\"_blank\" rel=\"noopener\">LangChain Blog</a> — 工程视角，挑着看</li></ul></div></details>\n<hr>\n<h2 id=\"h-1ebbd64426\">使用规则</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">四条规则</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>不用从 L1 学起。</strong> 你已有体感，L1 只在需要时查</li><li><strong>横切卡是工具不是课程。</strong> 遇到对应场景就翻，不要集中读完</li><li><strong>每层开头都写了\"学完你能多做什么\"。</strong> 达不到就别往下走</li><li><strong>每条资料都标了核对时间。</strong> 超过半年的，先刷新页面确认没变再引用——价格和 context 变最快</li></ul></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">关于旧文件</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>旧的两份（加速版 / 深度版）已移入 <code>归档/</code>，内容已被这四层吸收，不再维护。 原 <code>资料库 · 2026版</code> 也已移入 <code>归档/</code>——它的内容已拆分进 L1-L4 各小节。 目录里还有一份 <code>Agent_AI系统学习课程_2026版.docx</code>，未纳入本体系。</p></div></details>", "search": " 📝 这份文件是什么 ▸ 整个学习体系的 唯一入口 。所有内容按「能力层级」组织，不按周次。 配色语义： 青=目标 · 蓝=资料 · 紫=动手 · 灰=术语/清单 · 黄=题目 · 绿=答案 · 橙=常见坑 💡 资料在哪（两类，别混） ▸ ① 点到点的文章 / 网页 —— 全部拆散内联在 L1-L4 各小节的正下方， 读到哪、链接就在哪，点开直达，不用先跳去查表再手动搜。每条都标了「重点看什么」。 ② 整本外部资料 （如《深入理解 AI Agent》）—— 正文不内联，单独维护一份导读， 并在各层对应小节挂 具体章节 的深链。索引见下方「文件索引」表。 📌 待复核 · 本处修订由《深入理解 AI Agent》入库引发，尚未确认保留 ▸ 目录 你的起点在哪 体系地图 进度面板 文件索引 2026 关键变化备忘 长期跟踪源 使用规则 你的起点在哪 💡 校准结论（2026-09-30） ▸ 你有 日常使用 AI 的体感 ，但缺三样： 技术深度、整体评测、进阶路径 。 所以这份体系 不是从零开始 ，而是从你的真实缺口开始。 ❝ 四层定位 ▸ 层 你的现状 建议投入 优先级 L1 语言层 已具备七成，日常使用已给体感 30min 扫一遍 低 L2 结构层 能听懂选型，说不清为什么这么选 4-6h 高 L3 判断层 几乎空白，最缺 4-5h 最高 L4 落地层 需转化为可交付的产品方案 3-4h 中 ✅ 建议路径 ▸ L2 → L3（优先）→ L4 ，L1 随时查。总计 12-15h。 不要按顺序从 L1 啃到 L4——你已经会的东西不必再学一遍。 体系地图 ℹ️ 四层能力 + 一横切 ▸ L1 语言层 → L1 · 语言层 · 能听懂 — 能听懂研发在说什么 L2 结构层 → L2 · 结构层 · 能选型 — 能判断该用什么架构 L3 判断层 → L3 · 判断层 · 能评估 — 能判断方案好不好、该不该做 L4 落地层 → L4 · 落地层 · 能交付 — 能输出过评审的产品方案 横切（随时查，不按顺序） 卡A · 可靠性判断卡 · 卡B · 成本与延迟判断卡 · 卡C · 不该做清单 · 卡D · 科研场景专项卡 📄 每层的关系 ▸ L1 给你词汇，L2 给你结构，L3 给你判断力，L4 把前三样变成交付物。 横切卡不占顺序，遇到对应的问题就翻——它们是 工具，不是课程 。 进度面板 📌 主干（每层开头有更细的清单） ▸ L1 语言层 · 能听懂（30min，扫一遍即可） L2 结构层 · 能选型（4-6h） L3 判断层 · 能评估（4-5h，最优先） L4 落地层 · 能交付（3-4h） 📌 横切卡 ▸ 卡A 可靠性 — 评审任何多步方案前先看 卡B 成本与延迟 — 立项前先看 卡C 不该做清单 — 接到需求时先看 卡D 科研专项 — 做科研功能时随时翻 📝 资料读没读，直接在各层里打勾 ▸ 每条资料前面都有 - [ ] 复选框， 学完就地打勾 ，不用再回这里记进度。 文件索引 ❝ 全部文件 ▸ 文件 一句话 投入 00 · 学习总纲 本文件，唯一入口 — L1 · 语言层 · 能听懂 2026 模型生态 + 基础概念（含现查定价入口） 30min L2 · 结构层 · 能选型 复杂度三档、Workflow/Agent、ACI、上下文工程、MCP（含 Anthropic 四篇直达链接） 4-6h L3 · 判断层 · 能评估 技术了解层 + 2026 评测体系（含两篇 eval 一手资料） 4-5h L4 · 落地层 · 能交付 科研专项、PRD 六要素、UX 五模式、竞品体验清单 3-4h 卡A · 可靠性判断卡 步数越多越不可靠 20min 卡B · 成本与延迟判断卡 单次成本决定功能能不能活 20min 卡C · 不该做清单 产品最贵的能力是 Say No 20min 卡D · 科研场景专项卡 科研要可溯源，不是看起来专业 20min 术语速查表 遇到不懂的词来这里 随时查 书 · 深入理解 AI Agent · 导读 整本外部资料：工程实现视角（313 页，按需查） 8-10h 课程框架评审 · 2026-09-30 本套框架要不要改的体检报告（状态已同步：5 已落地 · 1 半落地 · 1 未做） 20min 2026 关键变化备忘 ✅ 这些变化会推翻旧结论，务必记住 ▸ 长上下文大幅降价 — \"文档太长所以要 RAG\"不再是默认答案，先算一遍 MCP 成为行业标准 — 2025-12 归入 Linux Foundation 旗下 Agentic AI Foundation；2026-07-28 规范改为无状态核心 上下文工程取代 prompt 工程 — 关注\"模型在每步看到什么\"，而非\"提示词怎么写\" 工具设计被提到界面高度（ACI） — 工具描述是给模型看的产品文案 长时能力基础设施化 — 沙箱、权限、检查点下沉到运行时层，产品要提要求而不是自己造 评测分家 — demo、测试集、在线指标三件事，混为一谈是最常见的失效原因 Harness（模型之外的一切）成为竞争力所在 — 不换模型、只改 Harness，任务准确率也能从 52.8% 提到 66.5%； 但要清醒：模型每内化一层约束，就会抹平一批只靠 Harness 建立的优势，Harness 会不断向前沿迁移 （出处与读法见 书 · 深入理解 AI Agent · 导读 ） 📌 待复核 · 第 7 条来自《深入理解 AI Agent》，读完原文后再定去留 ▸ ⚠️ 已过时，别再引用 ▸ GPT-3.5 / 4K context 的例子 → 2026 年主流模型 context 普遍 128K+ \"先做 RAG\"是默认方案 → 先算成本与失败率再决定 只看最终答案的评测 → 必须评轨迹 长期跟踪源 ℹ️ 收藏即可，不用系统读（有新东西时来扫一眼） ▸ Anthropic 工程博客 — 一手实践，本体系大部分框架来源 MCP 官方博客 — 规范更新 OpenAI 文档 · Agents — 实操向 Microsoft Azure 架构中心 — 选型语言最清晰 LangChain Blog — 工程视角，挑着看 使用规则 ⚠️ 四条规则 ▸ 不用从 L1 学起。 你已有体感，L1 只在需要时查 横切卡是工具不是课程。 遇到对应场景就翻，不要集中读完 每层开头都写了\"学完你能多做什么\"。 达不到就别往下走 每条资料都标了核对时间。 超过半年的，先刷新页面确认没变再引用——价格和 context 变最快 📝 关于旧文件 ▸ 旧的两份（加速版 / 深度版）已移入 归档/ ，内容已被这四层吸收，不再维护。 原 资料库 · 2026版 也已移入 归档/ ——它的内容已拆分进 L1-L4 各小节。 目录里还有一份 Agent_AI系统学习课程_2026版.docx ，未纳入本体系。 "}, {"slug": "p-ab1ca3904e", "title": "L1 · 语言层 · 能听懂", "group": "四层主干", "icon": "🧱", "updated": "2026-09-30", "invest": "30min（你已具备七成，扫一遍即可）", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这层解决什么</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>让你在会上听懂研发说的每句话，并且能反问到点上。 <strong>本层所有资料都贴在对应小节下面</strong>，读到哪、资料就在哪，不用来回跳。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-61a4804b56\">学完你能多做什么</a></li><li><a class=\"wl\" href=\"#h-5942bdea2c\">2026 模型生态</a></li><li><a class=\"wl\" href=\"#h-f7fcff1808\">五个基础概念</a></li><li><a class=\"wl\" href=\"#h-9f85aeb463\">30 分钟怎么扫</a></li><li><a class=\"wl\" href=\"#h-0b47ae6e10\">自测题</a></li><li><a class=\"wl\" href=\"#h-e84b0873ae\">常见坑</a></li></ul>\n<hr>\n<h2 id=\"h-61a4804b56\">学完你能多做什么</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">产出标准</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>听到\"这个模型 128K context、推理成本高\"，能立刻反问\"那我们用户输入通常多长？会不会超？\"</li><li>能说清为什么同一个需求，有的功能用便宜模型、有的必须用贵模型</li><li><strong>达不到就别往下走</strong>——L2 全部建立在这层的词汇上</li></ul></div></details>\n<h2 id=\"h-5942bdea2c\">2026 模型生态</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">你只需要知道定位，不需要知道参数</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>类别</th><th>是什么</th><th>什么时候用</th></tr></thead><tbody><tr><td>通用大模型</td><td>GPT / Claude / Gemini / DeepSeek 等主力模型</td><td>大多数对话与生成任务</td></tr><tr><td>推理模型</td><td>会先\"想一会\"再回答，慢但更准</td><td>复杂推理、规划、代码难题</td></tr><tr><td>小模型 / 分级模型</td><td>便宜、快，能力弱一些</td><td>分类、抽取、简单改写</td></tr><tr><td>多模态模型</td><td>能读图、听音、看视频</td><td>论文图表解析、实验图像</td></tr><tr><td>开源模型</td><td>可私有化部署</td><td>数据不能出内网的场景</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">2026 的两个关键变化（必须知道，会改变选型结论）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>长上下文大幅降价。</strong> 两年前\"5 万字塞不进去所以要 RAG\"的推理，现在不一定成立——先算一遍再决定</li><li><strong>模型分级成了标配。</strong> 不是所有步骤都用最强模型，路由到便宜模型是常规省钱手段（见 <a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a>）</li></ul></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 现查入口（价格和上下文别背，记入口就行）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-1ff8cac53c\"><span><a class=\"ext\" href=\"https://openai.com/api/pricing/\" target=\"_blank\" rel=\"noopener\">OpenAI 定价页</a> — 看当前单价与 context 上限</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-4b9e67c0a3\"><span><a class=\"ext\" href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">Anthropic 定价页</a></span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-1aa4d61df0\"><span><a class=\"ext\" href=\"https://ai.google.dev/pricing\" target=\"_blank\" rel=\"noopener\">Gemini 定价页</a></span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-d0565271e6\"><span><a class=\"ext\" href=\"https://api-docs.deepseek.com/quick_start/pricing\" target=\"_blank\" rel=\"noopener\">DeepSeek 定价页</a></span></label></li><li>规则：<strong>这四类页面半年一变，用时现查。</strong> 谁在会上报一个背下来的旧价格，谁就是在冒险</li><li>核对时间：2026-09-30（超过半年，先刷新页面再引用）</li></ul>\n<p><strong>本节补课 · 中文一手资料（可选）</strong></p>\n<ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-b83aa8cf42\"><span><strong>《深入理解 AI Agent》1.1.3「LLM：Agent 的大脑」+ 1.2.3「如何选择模型」</strong>（15min）</span></label><ul><li>重点看：模型选型的判断维度，比上面那张五类表更工程，且是中文的</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=19\" target=\"_blank\" title=\"打开本地文件\">打开 p.19 <span class=\"pdf-badge\">📄</span></a> · <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=29\" target=\"_blank\" title=\"打开本地文件\">打开 p.29 <span class=\"pdf-badge\">📄</span></a></li><li>书籍导读：<a class=\"wl\" href=\"#/p-6643528717\">书 · 深入理解 AI Agent · 导读</a></li></ul></li></ul></div></details>\n<h2 id=\"h-f7fcff1808\">五个基础概念</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">词汇卡</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>概念</th><th>一句话</th><th>对产品的影响</th></tr></thead><tbody><tr><td>Token</td><td>模型读写的最小单位，约 1 个中文字 = 1-2 token</td><td>成本的基本单位</td></tr><tr><td>Context Window</td><td>模型一次能看到的最大范围</td><td>长文档要不要切片、长对话要不要摘要</td></tr><tr><td>Temperature</td><td>控制随机程度，0=确定，1=发散</td><td>摘要类功能要低，头脑风暴要高</td></tr><tr><td>Embedding</td><td>把文字变成向量，用于搜索和相似度</td><td>RAG 的地基</td></tr><tr><td>Inference</td><td>模型生成回答的过程</td><td>延迟和成本都发生在这里</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 可选补课（你已有体感，只在想补原理时看）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-f9506cd133\"><span><strong>3Blue1Brown — But what is a GPT?</strong>（~30min）</span></label><ul><li>看什么：可视化讲 Transformer，零数学门槛，看完知道\"模型为什么能续写\"</li><li><a class=\"ext\" href=\"https://www.youtube.com/watch?v=wjZofJX0v4M\" target=\"_blank\" rel=\"noopener\">打开视频</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-587acab6aa\"><span><strong>Andrej Karpathy — Intro to LLMs</strong>（~1h）</span></label><ul><li>看什么：最好的一小时 LLM 入门，重点看前半段\"预训练数据从哪来\"</li><li><a class=\"ext\" href=\"https://www.youtube.com/watch?v=zjkBMFhNj_g\" target=\"_blank\" rel=\"noopener\">打开视频</a></li></ul></li><li>两个都是英文视频。<strong>时间不够就都不看</strong>，不影响后面任何一层</li></ul></div></details>\n<h2 id=\"h-9f85aeb463\">30 分钟怎么扫</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">别重新看入门视频，做这三件事</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-f169567f0a\"><span>打开上面四个定价页，各扫 2 分钟，记下当前主力模型的 context 上限和单价量级</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-d3135cddd5\"><span>用你日常用的 AI 工具，开 token 计数，感受一次典型提问消耗多少</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-63cde8335e\"><span>同一个问题分别用 temperature 0 和 1 各问一次，看差别</span></label></li></ul></div></details>\n<h2 id=\"h-0b47ae6e10\">自测题</h2>\n<details class=\"callout co-question\" data-fold><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">题目 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>1 万汉字大约多少 token？如果一个功能每次要塞 3 万字文档，你会先问研发什么？</li><li>一个\"论文摘要生成\"和一个\"研究选题头脑风暴\"，temperature 分别怎么设？</li></ul></div></details>\n<details class=\"callout co-success\" data-fold><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">参考答案 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>1 万汉字 ≈ 1-2 万 token；3 万字 ≈ 3-6 万 token。先问两件事：<strong>用哪个模型、context 多大</strong>；再问<strong>一次多少钱</strong>。别急着讨论要不要上 RAG——2026 年长上下文已经便宜很多，可能直接塞进去就行</li><li>摘要接近 0（要忠实原文）；头脑风暴 0.7-1.0（要发散）。<strong>两个功能不能用同一套参数配置</strong></li></ul></div></details>\n<h2 id=\"h-e84b0873ae\">常见坑</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">三个</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>背两年前的数字。</strong> context、价格、模型名字每半年就变——上面每个链接都标了核对时间，过期先刷新页面</li><li><strong>以为模型越强越好。</strong> 强模型慢且贵，能分级就分级</li><li><strong>把\"多模态\"当万能。</strong> 论文图表解析的准确率远低于文字，涉及数字要额外谨慎（见 <a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a>）</li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>总纲：<a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a></li><li>下一层：<a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a></li></ul></div></details>", "search": " 📝 这层解决什么 ▸ 让你在会上听懂研发说的每句话，并且能反问到点上。 本层所有资料都贴在对应小节下面 ，读到哪、资料就在哪，不用来回跳。 目录 学完你能多做什么 2026 模型生态 五个基础概念 30 分钟怎么扫 自测题 常见坑 学完你能多做什么 💡 产出标准 ▸ 听到\"这个模型 128K context、推理成本高\"，能立刻反问\"那我们用户输入通常多长？会不会超？\" 能说清为什么同一个需求，有的功能用便宜模型、有的必须用贵模型 达不到就别往下走 ——L2 全部建立在这层的词汇上 2026 模型生态 ℹ️ 你只需要知道定位，不需要知道参数 ▸ 类别 是什么 什么时候用 通用大模型 GPT / Claude / Gemini / DeepSeek 等主力模型 大多数对话与生成任务 推理模型 会先\"想一会\"再回答，慢但更准 复杂推理、规划、代码难题 小模型 / 分级模型 便宜、快，能力弱一些 分类、抽取、简单改写 多模态模型 能读图、听音、看视频 论文图表解析、实验图像 开源模型 可私有化部署 数据不能出内网的场景 ✅ 2026 的两个关键变化（必须知道，会改变选型结论） ▸ 长上下文大幅降价。 两年前\"5 万字塞不进去所以要 RAG\"的推理，现在不一定成立——先算一遍再决定 模型分级成了标配。 不是所有步骤都用最强模型，路由到便宜模型是常规省钱手段（见 卡B · 成本与延迟判断卡 ） ℹ️ 本节资料 · 现查入口（价格和上下文别背，记入口就行） ▸ OpenAI 定价页 — 看当前单价与 context 上限 Anthropic 定价页 Gemini 定价页 DeepSeek 定价页 规则： 这四类页面半年一变，用时现查。 谁在会上报一个背下来的旧价格，谁就是在冒险 核对时间：2026-09-30（超过半年，先刷新页面再引用） 本节补课 · 中文一手资料（可选） 《深入理解 AI Agent》1.1.3「LLM：Agent 的大脑」+ 1.2.3「如何选择模型」 （15min） 重点看：模型选型的判断维度，比上面那张五类表更工程，且是中文的 打开 p.19 📄 · 打开 p.29 📄 书籍导读： 书 · 深入理解 AI Agent · 导读 五个基础概念 ❝ 词汇卡 ▸ 概念 一句话 对产品的影响 Token 模型读写的最小单位，约 1 个中文字 = 1-2 token 成本的基本单位 Context Window 模型一次能看到的最大范围 长文档要不要切片、长对话要不要摘要 Temperature 控制随机程度，0=确定，1=发散 摘要类功能要低，头脑风暴要高 Embedding 把文字变成向量，用于搜索和相似度 RAG 的地基 Inference 模型生成回答的过程 延迟和成本都发生在这里 ℹ️ 本节资料 · 可选补课（你已有体感，只在想补原理时看） ▸ 3Blue1Brown — But what is a GPT? （~30min） 看什么：可视化讲 Transformer，零数学门槛，看完知道\"模型为什么能续写\" 打开视频 Andrej Karpathy — Intro to LLMs （~1h） 看什么：最好的一小时 LLM 入门，重点看前半段\"预训练数据从哪来\" 打开视频 两个都是英文视频。 时间不够就都不看 ，不影响后面任何一层 30 分钟怎么扫 🧪 别重新看入门视频，做这三件事 ▸ 打开上面四个定价页，各扫 2 分钟，记下当前主力模型的 context 上限和单价量级 用你日常用的 AI 工具，开 token 计数，感受一次典型提问消耗多少 同一个问题分别用 temperature 0 和 1 各问一次，看差别 自测题 ❓ 题目 · 点击展开 ▸ 1 万汉字大约多少 token？如果一个功能每次要塞 3 万字文档，你会先问研发什么？ 一个\"论文摘要生成\"和一个\"研究选题头脑风暴\"，temperature 分别怎么设？ ✅ 参考答案 · 点击展开 ▸ 1 万汉字 ≈ 1-2 万 token；3 万字 ≈ 3-6 万 token。先问两件事： 用哪个模型、context 多大 ；再问 一次多少钱 。别急着讨论要不要上 RAG——2026 年长上下文已经便宜很多，可能直接塞进去就行 摘要接近 0（要忠实原文）；头脑风暴 0.7-1.0（要发散）。 两个功能不能用同一套参数配置 常见坑 ⚠️ 三个 ▸ 背两年前的数字。 context、价格、模型名字每半年就变——上面每个链接都标了核对时间，过期先刷新页面 以为模型越强越好。 强模型慢且贵，能分级就分级 把\"多模态\"当万能。 论文图表解析的准确率远低于文字，涉及数字要额外谨慎（见 卡D · 科研场景专项卡 ） 📝 导航 ▸ 总纲： 00 · 学习总纲 下一层： L2 · 结构层 · 能选型 "}, {"slug": "p-d0a41b3ec4", "title": "L2 · 结构层 · 能选型", "group": "四层主干", "icon": "🧱", "updated": "2026-09-30", "invest": "4-6h", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这层解决什么</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>给你\"为什么这么选\"的依据。这是你说的<strong>技术深度不够</strong>的那一块—— 但目标是<strong>够你做判断和提问</strong>，不是够你实现。</p></div></details>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">资料怎么用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>每一节的资料就贴在这一节下面</strong>，读到哪、点哪，不用回总表翻。 每条都标了\"重点看什么\"，点进去直奔那一段，别通读。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-61a4804b56\">学完你能多做什么</a></li><li><a class=\"wl\" href=\"#h-88ffe9944e\">一 · 复杂度三档</a></li><li><a class=\"wl\" href=\"#h-d31ffa36ef\">二 · Workflow 与 Agent 的七个积木</a></li><li><a class=\"wl\" href=\"#h-e66a7928a5\">三 · 工具即界面（ACI）</a></li><li><a class=\"wl\" href=\"#h-8399dfbd29\">四 · 上下文工程</a></li><li><a class=\"wl\" href=\"#h-37f89d7c59\">五 · MCP 的 2026 现状</a></li><li><a class=\"wl\" href=\"#h-b95f5ed5f9\">六 · RAG 与 Memory</a></li><li><a class=\"wl\" href=\"#h-86706b64af\">动手练习</a></li><li><a class=\"wl\" href=\"#h-0b47ae6e10\">自测题</a></li><li><a class=\"wl\" href=\"#h-e84b0873ae\">常见坑</a></li></ul>\n<hr>\n<h2 id=\"h-61a4804b56\">学完你能多做什么</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">产出标准</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>拿到一个需求，能说出它该落在哪个复杂度档位，并说明为什么</li><li>能参与\"这一步要不要让模型自己决定\"的讨论，并给出理由</li><li>能判断一个工具的描述写得好不好（这是产品文案活）</li><li>听懂\"上下文工程\"在讨论什么，知道它为什么比 prompt 更重要</li></ul></div></details>\n<h2 id=\"h-88ffe9944e\">一 · 复杂度三档</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">先选档位，再谈架构（这是比三分法更产品的表述）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>档位</th><th>是什么</th><th>什么时候用</th></tr></thead><tbody><tr><td>直接调用模型</td><td>一次调用，无循环、无工具</td><td>翻译、摘要、分类、抽取</td></tr><tr><td>单 Agent + 工具</td><td>一个模型循环调工具，直到完成</td><td>需要多步但方向明确，如查资料再回答</td></tr><tr><td>多 Agent 编排</td><td>主 Agent 拆任务、分给子 Agent、汇总</td><td>任务可并行拆分，或需要专业分工</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">2026 的共识原则</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>从最简单的一档开始，只有在简单方案确实不够用时才升级。</strong> 复杂度带来成本、延迟和更多失败点——它不是能力，是代价。 先直连 API 试，框架能不用就不用。</p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 点开直达</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-38bbb05d35\"><span><strong>Microsoft — AI Agent Orchestration Patterns</strong>（微软 Azure 架构中心 · 15min）</span></label><ul><li>重点看：<strong>\"Start with the right level of complexity\"</strong> 这一节，就是上面三档表的出处</li><li>它对每档都写了\"代价是什么\"，比 Anthropic 的表述更适合在评审会上引用</li><li><a class=\"ext\" href=\"https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/ai-agent-design-patterns#start-with-the-right-level-of-complexity\" target=\"_blank\" rel=\"noopener\">打开（跳转到该小节）</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-1b85ed1a36\"><span><strong>《深入理解 AI Agent》1.2.4 编排模式：工作流与自主</strong>（p.30-33 · 中文，比上面两篇更敢下判断）</span></label><ul><li>重点看：开头那个反面例子——为\"从百万条聊天记录提炼个人记忆\"设计出五级流水线。<strong>每个部件单看都有道理，组合起来却低效且不可靠</strong>；评审会上劝退\"一上来就上复杂架构\"就用这个案例</li><li>记住那句取舍：<strong>\"Less structure, more intelligence.\"</strong> 程序只固化权限与不可逆边界，其余决策还给模型</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=30\" target=\"_blank\" title=\"打开本地文件\">打开 p.30 <span class=\"pdf-badge\">📄</span></a> · 书籍导读 <a class=\"wl\" href=\"#/p-6643528717\">书 · 深入理解 AI Agent · 导读</a></li></ul></li></ul></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">一条与档位正交的选择：让 Agent 写代码</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>上面三档说的是\"路径由谁定\"；《深入理解 AI Agent》还给了一个正交问题：<strong>这个能力要不要用代码实现。</strong> 它的答案是 <strong>通用 Agent = Coding Agent + 文件系统</strong>——代码不是一件工具，而是\"在运行时造出新工具\"的元能力。 代码同时承担四种角色：①可验证的形式化思考 ②业务规则的确定性防线 ③系统适配器 ④生成式 UI。 <strong>评审时加问一句：这个需求能不能让 Agent 自己写代码解决？</strong> 六种应用方向与代价见 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=144\" target=\"_blank\" title=\"打开本地文件\">5.2 节 p.144-159 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">待复核 · 本小节依据《深入理解 AI Agent》5.1–5.2（p.130-159），读完原文后再定去留</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"></div></details>\n<h2 id=\"h-d31ffa36ef\">二 · Workflow 与 Agent 的七个积木</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">由简到繁，可组合（Anthropic 的经典框架，2026 仍有效）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>积木</th><th>一句话</th><th>产品视角</th></tr></thead><tbody><tr><td>增强 LLM</td><td>模型 + 检索 + 工具 + 记忆</td><td>很多需求到这里就够了，别急着上循环</td></tr><tr><td>Prompt chaining</td><td>固定子任务串联，中间可加检查点</td><td>流程固定时的首选</td></tr><tr><td>Routing</td><td>先分类，再交给专用流程</td><td>用户意图多种且处理方式不同</td></tr><tr><td>Parallelization</td><td>拆成独立子任务并行，或同一任务跑多次投票</td><td>并行提速；投票提准确率</td></tr><tr><td>Orchestrator-workers</td><td>主模型动态拆任务并汇总</td><td><strong>子任务事先未知</strong>时才需要</td></tr><tr><td>Evaluator-optimizer</td><td>一个生成、一个评估，循环到达标</td><td>质量不稳定时的加固手段</td></tr><tr><td>自主 Agent</td><td>工具循环 + 环境反馈，可设检查点与停止条件</td><td>最灵活也最贵，必须有停止条件</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">关键区分</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>Workflow = 路径由代码写死；Agent = 路径由模型自己决定。</strong> 这不是规模差别，是本质差别。评审时第一句应该问：<strong>这一步的路径能提前写死吗？</strong></p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 点开直达</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-fe04b38f3c\"><span><strong>Anthropic — Building Effective Agents</strong>（2024-12 · 约 30min · 本层最重要的一篇）</span></label><ul><li>重点看两节：<strong>\"Building blocks, workflows, and agents\"</strong>（七个积木的来源）和 <strong>\"Workflows\"</strong>（五种模式）</li><li>顺手记住结尾那句原则：先直连 API，框架能不用就不用</li><li>2026 仍是最优入门，但要看完下面三篇续作才算完整</li><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-8bbf7a09e5\"><span><strong>Lilian Weng — LLM Powered Autonomous Agents</strong>（~30min · 选修）</span></label><ul><li>重点看：Agent = Planning + Memory + Tool Use 这个三分结构，配图多、好记</li><li>注意它是 2023 年的文章，<strong>概念仍有效，案例别当现状引用</strong></li><li><a class=\"ext\" href=\"https://lilianweng.github.io/posts/2023-06-23-agent/\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-578bc1d877\"><span><strong>《深入理解 AI Agent》10.2 多 Agent 何时真正优于单 Agent</strong>（p.281-283 · 中文）</span></label><ul><li><strong>第一判断标准：是否真正带来信息增量、是否值得额外的 token 成本。</strong></li><li>只是把同一个模型的同一条思维链拆开跑，那不叫多 Agent，叫多花钱</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=281\" target=\"_blank\" title=\"打开本地文件\">打开 p.281 <span class=\"pdf-badge\">📄</span></a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-4b9afdfece\"><span><strong>《深入理解 AI Agent》10.5 多 Agent 的六种失败模式</strong>（p.301-303 · 评审防坑清单）</span></label><ul><li>并发冲突 / 错误的级联放大 / 同质趋同 / 互相扯皮 / 循环失控 / <strong>理解债与认知投降</strong></li><li>如果方案非要上多 Agent，就照这六条逐条问\"你打算怎么防\"</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=301\" target=\"_blank\" title=\"打开本地文件\">打开 p.301 <span class=\"pdf-badge\">📄</span></a></li></ul></li></ul></div></details>\n<h2 id=\"h-e66a7928a5\">三 · 工具即界面（ACI）</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">这是产品活，不是技术活</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>工具（Tool）对模型而言就是一个\"界面\"。工具的<strong>名称和描述是给模型看的产品文案</strong>， 写得好不好直接决定模型会不会调对。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">一个好工具描述的要素</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>要素</th><th>说明</th></tr></thead><tbody><tr><td>名字</td><td>清晰、无歧义、与其他工具区分度高</td></tr><tr><td>描述</td><td>说清<strong>什么场景该用它</strong>，而不只是\"它能干什么\"</td></tr><tr><td>参数</td><td>定义明确、边界清楚</td></tr><tr><td>示例</td><td>给一两个典型调用例子</td></tr><tr><td>错误返回</td><td>出错时返回可理解的信息，让模型能自我修正</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">判断标准</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>如果你有两个搜索工具，模型调错了——<strong>先改描述，不要先换模型</strong>。 例：<code>search_papers</code> 应写成\"专门搜索学术论文，适用于提到论文、研究、综述、arXiv 的场景\"， 而不是含糊的\"搜索内容\"。</p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 点开直达</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-44119d7991\"><span><strong>Anthropic — Writing effective tools for agents</strong>（2025-09 · 约 20min）</span></label><ul><li>重点看结尾的 <strong>\"Principles for writing effective tools\"</strong> 六条原则，直接能抄成工具描述规范</li><li>中间讲实现的段落可以跳过（搭原型、跑评测那部分）</li><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-05e25fda96\"><span><strong>《深入理解 AI Agent》4.2 工具设计的通用原则</strong>（p.112-115 · 中文）</span></label><ul><li>两个可直接搬进评审的概念：<ul><li><strong>防呆（Poka-yoke）</strong>——从设计上让错误无法发生（SIM 卡缺角、微波炉门没关好就不加热），比\"教模型别犯错\"可靠得多</li><li><strong>参数传递的保真性</strong>——模型以为它传了什么、系统实际执行了什么，必须是同一个东西，这是安全边界</li></ul></li><li>还有一条能力形态决策：<strong>默认往通用的一端靠</strong>（通用执行器 / Skill），只在安全权限、参数复杂、频次极高、平台差异这四种情况才退回专用工具</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=112\" target=\"_blank\" title=\"打开本地文件\">打开 p.112 <span class=\"pdf-badge\">📄</span></a></li></ul></li></ul></div></details>\n<h2 id=\"h-8399dfbd29\">四 · 上下文工程</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">2026 年最重要的一次升级：从 prompt 到 context</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>过去关注\"提示词怎么写\"，现在关注<strong>模型在每一步看到了什么信息、什么时候看到</strong>。 上下文包括：系统指令、工具定义、外部数据、历史消息、Agent 状态。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">三条核心认知</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>上下文是有限资源。</strong> 塞得越多不等于效果越好，长上下文会降低模型的注意力和召回</li><li><strong>即时获取优于一次性塞满。</strong> 先只放\"引用\"（文件路径、查询条件、链接），要用时再由工具取回</li><li><strong>长任务靠三招续命</strong>：压缩历史（compaction）、结构化笔记（把关键事实写到上下文之外）、子 Agent 分上下文</li></ul></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">产品含义</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这三招决定了\"你的 Agent 能不能跑完一个 30 分钟的长任务\"。 你不需要会实现，但评审时要问：<strong>跑长了会不会失忆？断了能不能续？</strong></p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 点开直达</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-1e96a163fe\"><span><strong>Anthropic — Effective context engineering for AI agents</strong>（2025-09 · 约 20min）</span></label><ul><li>重点看：<strong>\"Context is a finite resource\"</strong> 这一段，以及为什么\"即时获取\"优于\"一次性塞满\"</li><li>这是\"上下文工程取代 prompt 工程\"这个说法的出处</li><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-73764c1a45\"><span><strong>Anthropic — Effective harnesses for long-running agents</strong>（~15min）</span></label><ul><li>重点看：压缩、结构化笔记、子 Agent 这三招的适用场景对比</li><li>对应你在评审时要问的那两句：\"跑长了会不会失忆？断了能不能续？\"</li><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-41a585cf84\"><span><strong>《深入理解 AI Agent》2.3 KV Cache 友好的上下文设计</strong>（p.50-59 · 中文 · 补上本节缺的工程约束）</span></label><ul><li>重点看 2.3.4「缓存作为架构约束」：<strong>改动越靠前，作废的缓存越多</strong>——\"上下文前缀稳定\"是架构要求，不是调优技巧</li><li>这条可以直接变成评审提问：<em>\"我们的上下文前缀稳定吗？会不会为了改一句话把缓存全作废？\"</em></li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=50\" target=\"_blank\" title=\"打开本地文件\">打开 p.50 <span class=\"pdf-badge\">📄</span></a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-95217bcbc0\"><span><strong>《深入理解 AI Agent》2.5 动态提示词与 Agent Skills</strong>（p.64-69）</span></label><ul><li>重点看：Skills 是\"<strong>元数据常驻、正文按需加载</strong>\"——这就是上面那条\"渐进式披露\"的工程形态</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=64\" target=\"_blank\" title=\"打开本地文件\">打开 p.64 <span class=\"pdf-badge\">📄</span></a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-2e9150cfdb\"><span><strong>《深入理解 AI Agent》2.7 上下文压缩策略</strong>（p.74-79）</span></label><ul><li>重点看 2.7.6「隔离优于压缩」：压缩有信息损失，子 Agent 独立上下文没有——<strong>能隔离就别硬压</strong></li><li>以及 2.6「Agent 状态栏」：解决 Agent \"不知道自己现在几点、在哪个目录\"这类失忆（p.69-74）</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=74\" target=\"_blank\" title=\"打开本地文件\">打开 p.74 <span class=\"pdf-badge\">📄</span></a></li></ul></li></ul></div></details>\n<h2 id=\"h-37f89d7c59\">五 · MCP 的 2026 现状</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">定位变了：从 Anthropic 的项目，变成行业标准</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>2025-12，MCP 被捐给 Linux Foundation 旗下的 <strong>Agentic AI Foundation</strong>，OpenAI、Google、微软、亚马逊都参与贡献</li><li>2026-07-28 规范是史上最大更新：<strong>协议核心改为无状态</strong>（砍掉握手流程和 session），可横向扩展、可部署在 Serverless</li><li>新增：多轮请求模式、可缓存的列表结果、授权硬化、正式扩展机制（MCP Apps、Tasks）</li><li>生态规模：Tier 1 SDK 月下载量接近 5 亿次；Claude 连接器目录已有 950+ MCP server</li></ul></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">你只需要记住一句</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>MCP 是 Agent 与工具之间的\"插头标准\"。</strong> 有了它，工具连接器可以跨客户端复用，不必每个团队各写一套适配。</p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 点开直达</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-22a141a08e\"><span><strong>MCP 官网概览</strong>（10min）</span></label><ul><li>重点看：\"为什么需要 MCP\"那一页的示意图，理解 client / server / 工具 三层关系</li><li><a class=\"ext\" href=\"https://modelcontextprotocol.io\" target=\"_blank\" rel=\"noopener\">打开网页</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-f3c64f3547\"><span><strong>MCP 路线图与规范更新</strong>（10min）</span></label><ul><li>重点看 2026-07-28 那条：无状态核心、多轮请求、可缓存列表、授权硬化</li><li><a class=\"ext\" href=\"https://blog.modelcontextprotocol.io/posts/mcp-roadmap/\" target=\"_blank\" rel=\"noopener\">打开博客</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-1632804b93\"><span><strong>背景一条</strong>：2025-12 MCP 捐给 Linux Foundation 旗下 Agentic AI Foundation —— 知道这件事，就知道 MCP 不会突然消失</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-1ea856b536\"><span><strong>《深入理解 AI Agent》4.3–4.4 工具生态与\"工具太多怎么办\"</strong>（p.115-122 · 中文）</span></label><ul><li>重点看：生态的两条渠道——<strong>MCP 统一专用工具的接入，Skill Hub 用包管理器分发 SKILL.md</strong>；两条渠道都把接入成本压到一条命令，也都扩大了信任边界</li><li>以及工具上千后的四种应对（依次接管）：<strong>层次化组织 → 按需加载 → 模型原生主动发现 → Skills 把\"选哪个工具\"变成\"查哪条资料\"</strong></li><li>产品含义：工具多到一定程度，\"选工具\"这件事本身会变成新的失败源</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=115\" target=\"_blank\" title=\"打开本地文件\">打开 p.115 <span class=\"pdf-badge\">📄</span></a> · <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=117\" target=\"_blank\" title=\"打开本地文件\">p.117 <span class=\"pdf-badge\">📄</span></a></li></ul></li></ul></div></details>\n<h2 id=\"h-b95f5ed5f9\">六 · RAG 与 Memory</h2>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">两个经常被混用的概念</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>概念</th><th>解决什么</th><th>产品判断</th></tr></thead><tbody><tr><td>RAG</td><td>先检索再回答，减少编造</td><td>知识库类功能的基本盘；失败时要按流水线逐段排查</td></tr><tr><td>Memory · 短期</td><td>当前对话内的上下文</td><td>对话结束即可丢弃</td></tr><tr><td>Memory · 长期</td><td>跨对话持久化的用户偏好与历史</td><td>需要主动管理，且<strong>必须给用户删除和编辑的控制权</strong></td></tr></tbody></table></div></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">2026 的一个提醒</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>长上下文降价后，\"要不要上 RAG\"不再是默认答案。 先算：文档全塞进去要多少 token、多少钱、多慢；再和 RAG 方案的检索失败率对比。</p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 点开直达</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-bd9860fe2c\"><span><strong>Lilian Weng — LLM Powered Autonomous Agents</strong>（复用上面那篇，直接跳 Memory 一节）</span></label><ul><li>重点看：<strong>Memory</strong> 章节，短期 / 长期记忆的划分讲得最清楚</li><li><a class=\"ext\" href=\"https://lilianweng.github.io/posts/2023-06-23-agent/\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-80348e6278\"><span><strong>《深入理解 AI Agent》3.1 用户记忆系统</strong>（p.81-89 · 中文）</span></label><ul><li>重点看 3.1.1「记忆能力的评估：三层次框架」与 3.1.3「用户记忆的四种存储格式」</li><li>产品含义：长期记忆<strong>必须给用户删除与编辑的控制权</strong>；写入前要过四道检查——来源、时间、冲突、隐私</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=81\" target=\"_blank\" title=\"打开本地文件\">打开 p.81 <span class=\"pdf-badge\">📄</span></a></li></ul></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-14cfac2bdd\"><span><strong>《深入理解 AI Agent》3.3.4 智能体化 RAG</strong>（p.102-105）</span></label><ul><li>重点看：把检索从\"流水线的一环\"变成\"Agent 可调用的工具\"——这是 RAG 在 2026 年的主流形态</li><li><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=102\" target=\"_blank\" title=\"打开本地文件\">打开 p.102 <span class=\"pdf-badge\">📄</span></a></li></ul></li></ul></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">读第 3 章之前先记住这条口径（避免误读）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>《深入理解 AI Agent》第 3 章用约 30 页讲 RAG 全流水线（分块 / 稠密与稀疏嵌入 / 混合检索 / 重排序）。 那是<strong>\"如果要做，怎么做\"的施工图，不是\"应该做\"的推荐</strong>——上面那条\"先算成本和失败率\"的判断仍然优先。 正确顺序：先过 <a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a> 确认要做，再翻第 3 章当施工图。 反向读（先看施工图再决策）正是本节反复警告的\"文档太长所以上 RAG\"的老毛病。</p></div></details>\n<h2 id=\"h-86706b64af\">动手练习</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">4-6h，按优先级</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-ca7d8be861\"><span>读上面五篇 Anthropic / 微软文章（按本节顺序读，约 1.5h）</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-d75d566d4b\"><span>用 <a class=\"ext\" href=\"https://www.coze.com\" target=\"_blank\" rel=\"noopener\">Coze</a> 或 <a class=\"ext\" href=\"https://www.dify.ai\" target=\"_blank\" rel=\"noopener\">Dify</a> 搭一个多节点流程，逐节点看输入输出</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c9a930606f\"><span>深度体验两个 2026 年的 Agent 产品：研究类（<a class=\"ext\" href=\"https://www.perplexity.ai\" target=\"_blank\" rel=\"noopener\">Perplexity</a> / ChatGPT Agent）与编码类（<a class=\"ext\" href=\"https://claude.com/product/claude-code\" target=\"_blank\" rel=\"noopener\">Claude Code</a> / <a class=\"ext\" href=\"https://cursor.com\" target=\"_blank\" rel=\"noopener\">Cursor</a>），带着\"它什么时候让我确认\"这个问题去看</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-b9e684c5a2\"><span>拿你们产品的一个功能，判断它应该落在哪一档复杂度，写出理由</span></label></li></ul>\n<p>选修：<a class=\"ext\" href=\"https://huggingface.co/learn/agents-course\" target=\"_blank\" rel=\"noopener\">Hugging Face Agents Course</a>（有中文版，讲得更工程化，时间富余再看）</p></div></details>\n<h2 id=\"h-0b47ae6e10\">自测题</h2>\n<details class=\"callout co-question\" data-fold><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">题目 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>用户上传 PDF → 提取方法 → 分析局限性 → 生成结论。该用 Workflow 还是 Agent？为什么？</li><li>你的 Agent 有两个搜索工具，模型经常调错。产品层面第一步该做什么？</li><li>一个需要跑 20 分钟的文献调研任务，评审时你该问研发什么？</li></ul></div></details>\n<details class=\"callout co-success\" data-fold><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">参考答案 · 点击展开</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>Workflow 为主</strong>。路径基本固定，能写死就写死；只有\"是否补充外部文献\"这种不确定分支可以留 Agent 决策</li><li><strong>改工具描述</strong>。写清\"什么场景该用它\"，提高区分度。工具描述是给模型看的产品文案</li><li>问四件事：<strong>跑长了会不会失忆</strong>（压缩 / 笔记 / 子 Agent 用了哪个）？<strong>断了能不能续</strong>（有没有 checkpoint）？<strong>跑偏了怎么发现</strong>（有没有漂移检测）？<strong>跑完多少钱</strong>（见 <a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a>）</li></ul></div></details>\n<h2 id=\"h-e84b0873ae\">常见坑</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">四个</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>为了\"看起来高级\"上多 Agent。</strong> 多数场景单 Agent 足够，多 Agent 只在可并行或需专业分工时才值</li><li><strong>把框架当答案。</strong> 框架解决的是实现效率，不解决\"该不该这么设计\"</li><li><strong>只优化 prompt 不砍步骤。</strong> 效果不好时先看步数（见 <a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a>）</li><li><strong>以为装了 MCP 就万事大吉。</strong> 协议只解决连接，工具本身好不好用仍取决于设计和描述</li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>总纲：<a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a> · 上一层：<a class=\"wl\" href=\"#/p-ab1ca3904e\">L1 · 语言层 · 能听懂</a></li><li>下一层：<a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a></li><li>相关卡：<a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> · <a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a></li></ul></div></details>", "search": " 📝 这层解决什么 ▸ 给你\"为什么这么选\"的依据。这是你说的 技术深度不够 的那一块—— 但目标是 够你做判断和提问 ，不是够你实现。 💡 资料怎么用 ▸ 每一节的资料就贴在这一节下面 ，读到哪、点哪，不用回总表翻。 每条都标了\"重点看什么\"，点进去直奔那一段，别通读。 目录 学完你能多做什么 一 · 复杂度三档 二 · Workflow 与 Agent 的七个积木 三 · 工具即界面（ACI） 四 · 上下文工程 五 · MCP 的 2026 现状 六 · RAG 与 Memory 动手练习 自测题 常见坑 学完你能多做什么 💡 产出标准 ▸ 拿到一个需求，能说出它该落在哪个复杂度档位，并说明为什么 能参与\"这一步要不要让模型自己决定\"的讨论，并给出理由 能判断一个工具的描述写得好不好（这是产品文案活） 听懂\"上下文工程\"在讨论什么，知道它为什么比 prompt 更重要 一 · 复杂度三档 ℹ️ 先选档位，再谈架构（这是比三分法更产品的表述） ▸ 档位 是什么 什么时候用 直接调用模型 一次调用，无循环、无工具 翻译、摘要、分类、抽取 单 Agent + 工具 一个模型循环调工具，直到完成 需要多步但方向明确，如查资料再回答 多 Agent 编排 主 Agent 拆任务、分给子 Agent、汇总 任务可并行拆分，或需要专业分工 ✅ 2026 的共识原则 ▸ 从最简单的一档开始，只有在简单方案确实不够用时才升级。 复杂度带来成本、延迟和更多失败点——它不是能力，是代价。 先直连 API 试，框架能不用就不用。 ℹ️ 本节资料 · 点开直达 ▸ Microsoft — AI Agent Orchestration Patterns （微软 Azure 架构中心 · 15min） 重点看： \"Start with the right level of complexity\" 这一节，就是上面三档表的出处 它对每档都写了\"代价是什么\"，比 Anthropic 的表述更适合在评审会上引用 打开（跳转到该小节） 《深入理解 AI Agent》1.2.4 编排模式：工作流与自主 （p.30-33 · 中文，比上面两篇更敢下判断） 重点看：开头那个反面例子——为\"从百万条聊天记录提炼个人记忆\"设计出五级流水线。 每个部件单看都有道理，组合起来却低效且不可靠 ；评审会上劝退\"一上来就上复杂架构\"就用这个案例 记住那句取舍： \"Less structure, more intelligence.\" 程序只固化权限与不可逆边界，其余决策还给模型 打开 p.30 📄 · 书籍导读 书 · 深入理解 AI Agent · 导读 📝 一条与档位正交的选择：让 Agent 写代码 ▸ 上面三档说的是\"路径由谁定\"；《深入理解 AI Agent》还给了一个正交问题： 这个能力要不要用代码实现。 它的答案是 通用 Agent = Coding Agent + 文件系统 ——代码不是一件工具，而是\"在运行时造出新工具\"的元能力。 代码同时承担四种角色：①可验证的形式化思考 ②业务规则的确定性防线 ③系统适配器 ④生成式 UI。 评审时加问一句：这个需求能不能让 Agent 自己写代码解决？ 六种应用方向与代价见 5.2 节 p.144-159 📄 📌 待复核 · 本小节依据《深入理解 AI Agent》5.1–5.2（p.130-159），读完原文后再定去留 ▸ 二 · Workflow 与 Agent 的七个积木 ❝ 由简到繁，可组合（Anthropic 的经典框架，2026 仍有效） ▸ 积木 一句话 产品视角 增强 LLM 模型 + 检索 + 工具 + 记忆 很多需求到这里就够了，别急着上循环 Prompt chaining 固定子任务串联，中间可加检查点 流程固定时的首选 Routing 先分类，再交给专用流程 用户意图多种且处理方式不同 Parallelization 拆成独立子任务并行，或同一任务跑多次投票 并行提速；投票提准确率 Orchestrator-workers 主模型动态拆任务并汇总 子任务事先未知 时才需要 Evaluator-optimizer 一个生成、一个评估，循环到达标 质量不稳定时的加固手段 自主 Agent 工具循环 + 环境反馈，可设检查点与停止条件 最灵活也最贵，必须有停止条件 ⚠️ 关键区分 ▸ Workflow = 路径由代码写死；Agent = 路径由模型自己决定。 这不是规模差别，是本质差别。评审时第一句应该问： 这一步的路径能提前写死吗？ ℹ️ 本节资料 · 点开直达 ▸ Anthropic — Building Effective Agents （2024-12 · 约 30min · 本层最重要的一篇） 重点看两节： \"Building blocks, workflows, and agents\" （七个积木的来源）和 \"Workflows\" （五种模式） 顺手记住结尾那句原则：先直连 API，框架能不用就不用 2026 仍是最优入门，但要看完下面三篇续作才算完整 打开文章 Lilian Weng — LLM Powered Autonomous Agents （~30min · 选修） 重点看：Agent = Planning + Memory + Tool Use 这个三分结构，配图多、好记 注意它是 2023 年的文章， 概念仍有效，案例别当现状引用 打开文章 《深入理解 AI Agent》10.2 多 Agent 何时真正优于单 Agent （p.281-283 · 中文） 第一判断标准：是否真正带来信息增量、是否值得额外的 token 成本。 只是把同一个模型的同一条思维链拆开跑，那不叫多 Agent，叫多花钱 打开 p.281 📄 《深入理解 AI Agent》10.5 多 Agent 的六种失败模式 （p.301-303 · 评审防坑清单） 并发冲突 / 错误的级联放大 / 同质趋同 / 互相扯皮 / 循环失控 / 理解债与认知投降 如果方案非要上多 Agent，就照这六条逐条问\"你打算怎么防\" 打开 p.301 📄 三 · 工具即界面（ACI） 🧪 这是产品活，不是技术活 ▸ 工具（Tool）对模型而言就是一个\"界面\"。工具的 名称和描述是给模型看的产品文案 ， 写得好不好直接决定模型会不会调对。 ❝ 一个好工具描述的要素 ▸ 要素 说明 名字 清晰、无歧义、与其他工具区分度高 描述 说清 什么场景该用它 ，而不只是\"它能干什么\" 参数 定义明确、边界清楚 示例 给一两个典型调用例子 错误返回 出错时返回可理解的信息，让模型能自我修正 ✅ 判断标准 ▸ 如果你有两个搜索工具，模型调错了—— 先改描述，不要先换模型 。 例： search_papers 应写成\"专门搜索学术论文，适用于提到论文、研究、综述、arXiv 的场景\"， 而不是含糊的\"搜索内容\"。 ℹ️ 本节资料 · 点开直达 ▸ Anthropic — Writing effective tools for agents （2025-09 · 约 20min） 重点看结尾的 \"Principles for writing effective tools\" 六条原则，直接能抄成工具描述规范 中间讲实现的段落可以跳过（搭原型、跑评测那部分） 打开文章 《深入理解 AI Agent》4.2 工具设计的通用原则 （p.112-115 · 中文） 两个可直接搬进评审的概念： 防呆（Poka-yoke） ——从设计上让错误无法发生（SIM 卡缺角、微波炉门没关好就不加热），比\"教模型别犯错\"可靠得多 参数传递的保真性 ——模型以为它传了什么、系统实际执行了什么，必须是同一个东西，这是安全边界 还有一条能力形态决策： 默认往通用的一端靠 （通用执行器 / Skill），只在安全权限、参数复杂、频次极高、平台差异这四种情况才退回专用工具 打开 p.112 📄 四 · 上下文工程 ℹ️ 2026 年最重要的一次升级：从 prompt 到 context ▸ 过去关注\"提示词怎么写\"，现在关注 模型在每一步看到了什么信息、什么时候看到 。 上下文包括：系统指令、工具定义、外部数据、历史消息、Agent 状态。 ❝ 三条核心认知 ▸ 上下文是有限资源。 塞得越多不等于效果越好，长上下文会降低模型的注意力和召回 即时获取优于一次性塞满。 先只放\"引用\"（文件路径、查询条件、链接），要用时再由工具取回 长任务靠三招续命 ：压缩历史（compaction）、结构化笔记（把关键事实写到上下文之外）、子 Agent 分上下文 📝 产品含义 ▸ 这三招决定了\"你的 Agent 能不能跑完一个 30 分钟的长任务\"。 你不需要会实现，但评审时要问： 跑长了会不会失忆？断了能不能续？ ℹ️ 本节资料 · 点开直达 ▸ Anthropic — Effective context engineering for AI agents （2025-09 · 约 20min） 重点看： \"Context is a finite resource\" 这一段，以及为什么\"即时获取\"优于\"一次性塞满\" 这是\"上下文工程取代 prompt 工程\"这个说法的出处 打开文章 Anthropic — Effective harnesses for long-running agents （~15min） 重点看：压缩、结构化笔记、子 Agent 这三招的适用场景对比 对应你在评审时要问的那两句：\"跑长了会不会失忆？断了能不能续？\" 打开文章 《深入理解 AI Agent》2.3 KV Cache 友好的上下文设计 （p.50-59 · 中文 · 补上本节缺的工程约束） 重点看 2.3.4「缓存作为架构约束」： 改动越靠前，作废的缓存越多 ——\"上下文前缀稳定\"是架构要求，不是调优技巧 这条可以直接变成评审提问： \"我们的上下文前缀稳定吗？会不会为了改一句话把缓存全作废？\" 打开 p.50 📄 《深入理解 AI Agent》2.5 动态提示词与 Agent Skills （p.64-69） 重点看：Skills 是\" 元数据常驻、正文按需加载 \"——这就是上面那条\"渐进式披露\"的工程形态 打开 p.64 📄 《深入理解 AI Agent》2.7 上下文压缩策略 （p.74-79） 重点看 2.7.6「隔离优于压缩」：压缩有信息损失，子 Agent 独立上下文没有—— 能隔离就别硬压 以及 2.6「Agent 状态栏」：解决 Agent \"不知道自己现在几点、在哪个目录\"这类失忆（p.69-74） 打开 p.74 📄 五 · MCP 的 2026 现状 ℹ️ 定位变了：从 Anthropic 的项目，变成行业标准 ▸ 2025-12，MCP 被捐给 Linux Foundation 旗下的 Agentic AI Foundation ，OpenAI、Google、微软、亚马逊都参与贡献 2026-07-28 规范是史上最大更新： 协议核心改为无状态 （砍掉握手流程和 session），可横向扩展、可部署在 Serverless 新增：多轮请求模式、可缓存的列表结果、授权硬化、正式扩展机制（MCP Apps、Tasks） 生态规模：Tier 1 SDK 月下载量接近 5 亿次；Claude 连接器目录已有 950+ MCP server ✅ 你只需要记住一句 ▸ MCP 是 Agent 与工具之间的\"插头标准\"。 有了它，工具连接器可以跨客户端复用，不必每个团队各写一套适配。 ℹ️ 本节资料 · 点开直达 ▸ MCP 官网概览 （10min） 重点看：\"为什么需要 MCP\"那一页的示意图，理解 client / server / 工具 三层关系 打开网页 MCP 路线图与规范更新 （10min） 重点看 2026-07-28 那条：无状态核心、多轮请求、可缓存列表、授权硬化 打开博客 背景一条 ：2025-12 MCP 捐给 Linux Foundation 旗下 Agentic AI Foundation —— 知道这件事，就知道 MCP 不会突然消失 《深入理解 AI Agent》4.3–4.4 工具生态与\"工具太多怎么办\" （p.115-122 · 中文） 重点看：生态的两条渠道—— MCP 统一专用工具的接入，Skill Hub 用包管理器分发 SKILL.md ；两条渠道都把接入成本压到一条命令，也都扩大了信任边界 以及工具上千后的四种应对（依次接管）： 层次化组织 → 按需加载 → 模型原生主动发现 → Skills 把\"选哪个工具\"变成\"查哪条资料\" 产品含义：工具多到一定程度，\"选工具\"这件事本身会变成新的失败源 打开 p.115 📄 · p.117 📄 六 · RAG 与 Memory ❝ 两个经常被混用的概念 ▸ 概念 解决什么 产品判断 RAG 先检索再回答，减少编造 知识库类功能的基本盘；失败时要按流水线逐段排查 Memory · 短期 当前对话内的上下文 对话结束即可丢弃 Memory · 长期 跨对话持久化的用户偏好与历史 需要主动管理，且 必须给用户删除和编辑的控制权 ⚠️ 2026 的一个提醒 ▸ 长上下文降价后，\"要不要上 RAG\"不再是默认答案。 先算：文档全塞进去要多少 token、多少钱、多慢；再和 RAG 方案的检索失败率对比。 ℹ️ 本节资料 · 点开直达 ▸ Lilian Weng — LLM Powered Autonomous Agents （复用上面那篇，直接跳 Memory 一节） 重点看： Memory 章节，短期 / 长期记忆的划分讲得最清楚 打开文章 《深入理解 AI Agent》3.1 用户记忆系统 （p.81-89 · 中文） 重点看 3.1.1「记忆能力的评估：三层次框架」与 3.1.3「用户记忆的四种存储格式」 产品含义：长期记忆 必须给用户删除与编辑的控制权 ；写入前要过四道检查——来源、时间、冲突、隐私 打开 p.81 📄 《深入理解 AI Agent》3.3.4 智能体化 RAG （p.102-105） 重点看：把检索从\"流水线的一环\"变成\"Agent 可调用的工具\"——这是 RAG 在 2026 年的主流形态 打开 p.102 📄 ⚠️ 读第 3 章之前先记住这条口径（避免误读） ▸ 《深入理解 AI Agent》第 3 章用约 30 页讲 RAG 全流水线（分块 / 稠密与稀疏嵌入 / 混合检索 / 重排序）。 那是 \"如果要做，怎么做\"的施工图，不是\"应该做\"的推荐 ——上面那条\"先算成本和失败率\"的判断仍然优先。 正确顺序：先过 卡C · 不该做清单 确认要做，再翻第 3 章当施工图。 反向读（先看施工图再决策）正是本节反复警告的\"文档太长所以上 RAG\"的老毛病。 动手练习 🧪 4-6h，按优先级 ▸ 读上面五篇 Anthropic / 微软文章（按本节顺序读，约 1.5h） 用 Coze 或 Dify 搭一个多节点流程，逐节点看输入输出 深度体验两个 2026 年的 Agent 产品：研究类（ Perplexity / ChatGPT Agent）与编码类（ Claude Code / Cursor ），带着\"它什么时候让我确认\"这个问题去看 拿你们产品的一个功能，判断它应该落在哪一档复杂度，写出理由 选修： Hugging Face Agents Course （有中文版，讲得更工程化，时间富余再看） 自测题 ❓ 题目 · 点击展开 ▸ 用户上传 PDF → 提取方法 → 分析局限性 → 生成结论。该用 Workflow 还是 Agent？为什么？ 你的 Agent 有两个搜索工具，模型经常调错。产品层面第一步该做什么？ 一个需要跑 20 分钟的文献调研任务，评审时你该问研发什么？ ✅ 参考答案 · 点击展开 ▸ Workflow 为主 。路径基本固定，能写死就写死；只有\"是否补充外部文献\"这种不确定分支可以留 Agent 决策 改工具描述 。写清\"什么场景该用它\"，提高区分度。工具描述是给模型看的产品文案 问四件事： 跑长了会不会失忆 （压缩 / 笔记 / 子 Agent 用了哪个）？ 断了能不能续 （有没有 checkpoint）？ 跑偏了怎么发现 （有没有漂移检测）？ 跑完多少钱 （见 卡B · 成本与延迟判断卡 ） 常见坑 ⚠️ 四个 ▸ 为了\"看起来高级\"上多 Agent。 多数场景单 Agent 足够，多 Agent 只在可并行或需专业分工时才值 把框架当答案。 框架解决的是实现效率，不解决\"该不该这么设计\" 只优化 prompt 不砍步骤。 效果不好时先看步数（见 卡A · 可靠性判断卡 ） 以为装了 MCP 就万事大吉。 协议只解决连接，工具本身好不好用仍取决于设计和描述 📝 导航 ▸ 总纲： 00 · 学习总纲 · 上一层： L1 · 语言层 · 能听懂 下一层： L3 · 判断层 · 能评估 相关卡： 卡A · 可靠性判断卡 · 卡B · 成本与延迟判断卡 "}, {"slug": "p-efd386edd2", "title": "L3 · 判断层 · 能评估", "group": "四层主干", "icon": "🧱", "updated": "2026-09-30", "invest": "4-5h", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这层解决什么</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>让你能在评审会上回答两个问题：<strong>这个方案好不好？该不该做？</strong> 技术部分只要\"了解够提问\"，<strong>评测部分是这层的主体</strong>。</p></div></details>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">资料怎么用</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>每一节的资料就贴在这一节下面</strong>，读到哪、点哪。 评测部分建议<strong>先读本节开头的两篇，再往下看</strong>——后面的七个要点都是这两篇的拆解。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-61a4804b56\">学完你能多做什么</a></li><li><a class=\"wl\" href=\"#h-0839d58659\">第一部分 · 技术了解层（够判断即可）</a></li><li><a class=\"wl\" href=\"#h-7b86e62636\">第二部分 · 评测体系（本层主体）</a></li><li><a class=\"wl\" href=\"#h-7e21547357\">动手练习 · 写一套 Eval</a></li><li><a class=\"wl\" href=\"#h-0b47ae6e10\">自测题</a></li><li><a class=\"wl\" href=\"#h-e84b0873ae\">常见坑</a></li></ul>\n<hr>\n<h2 id=\"h-61a4804b56\">学完你能多做什么</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">产出标准</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>拿到一个 Agent 方案，能指出它最可能在第几步崩、为什么</li><li>能为功能定义\"好\"的标准，并写成可执行的评测集</li><li>能区分\"demo 好看\"和\"线上可靠\"这两件事，不被演示骗</li><li>能说出上线后该盯哪几个数，而不是只看一个成功率</li></ul></div></details>\n<hr>\n<h2 id=\"h-0839d58659\">第一部分 · 技术了解层（够判断即可）</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">学习尺度</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这部分的目标是<strong>够你提问</strong>，不是够你实现。 判断标准：你能问出正确的问题，就算达标；不需要知道答案怎么算出来。</p></div></details>\n<h3 id=\"h-70f89417c1\">1. 可靠性</h3>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">只需记住</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>步数越多，端到端成功率越低。详见 <a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a>。 <strong>评审第一问永远是\"这方案分几步\"，不是\"prompt 写得好不好\"。</strong></p></div></details>\n<h3 id=\"h-d36ad0ce38\">2. 成本与延迟</h3>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">只需记住</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>Agent 真正的贵在<strong>轮次</strong>，不在单次调用。延迟看 P95 不看平均。 详见 <a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a>。</p></div></details>\n<h3 id=\"h-a31272e456\">3. 长任务怎么不断</h3>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">三招 + 一个检测（知道名字和用途即可）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>手段</th><th>干什么</th><th>你该问的问题</th></tr></thead><tbody><tr><td>压缩（compaction）</td><td>把过长的历史压成摘要，重开一段上下文</td><td>跑长了会不会失忆？</td></tr><tr><td>结构化笔记</td><td>把关键事实、决策、状态写到上下文之外</td><td>中途断了，能接着干吗？</td></tr><tr><td>子 Agent 分工</td><td>让子任务在独立上下文里跑，只回传摘要</td><td>长任务的花费会不会失控？</td></tr><tr><td>漂移检测</td><td>检测 Agent 当前假设是否和早前记录矛盾</td><td>跑偏了多久能发现？</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">2026 的现状</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这些能力正在下沉到基础设施层（例如托管式 Agent 运行时把沙箱、权限、检查点打包进去了）。 <strong>产品不需要自己造，但必须在方案里明确要求。</strong></p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">本节资料 · 点开直达</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-c711065d2c\"><span><strong>Anthropic — Effective harnesses for long-running agents</strong>（~15min）</span></label><ul><li>重点看：三招的适用对比，以及为什么子 Agent 会\"省上下文但可能费钱\"</li><li><a class=\"ext\" href=\"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents\" target=\"_blank\" rel=\"noopener\">打开文章</a></li></ul></li></ul></div></details>\n<h3 id=\"h-029d9c92ea\">4. 安全与权限边界</h3>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">产品必须定的四件事（技术会变，这四条不变）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>Agent 能碰什么、不能碰什么</strong>——可读写范围、禁止操作清单</li><li><strong>什么动作必须人点头</strong>——涉及写入、外发、付费、不可逆操作</li><li><strong>用户数据怎么用</strong>——保留多久、能否用于训练、能否删除</li><li><strong>Agent 读到的内容能不能当指令执行</strong>——外部数据（网页 / 文档 / 邮件 / 用户上传的 PDF）里的内容必须当\"数据\"处理，<strong>不能当\"指令\"执行</strong></li></ul>\n<p>这几条不是\"上线前再补\"，是<strong>架构阶段就要定的</strong>——事后补权限等于重做。</p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\

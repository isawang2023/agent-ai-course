块入向量库）/ 混合系统（核心事实常驻 + 原始对话按需检索）；同一组问题共 180 条真实 API 运行轨迹（结果见表 7-3） → 《深入理解 AI Agent》7.5.1 配套实验 · p.205 📄 · 同步挂载：L3 动手练习 第 8 章 · 模型后训练 ⚠️ 技术门槛：🔴🔴 全书最高 —— 只读 8.1，其余整章跳过 ▸ 这一章是给算法工程师写的：SFT 数据合成、RL 算法、奖励设计、在轨蒸馏。 ✅ 8.1 从预训练到 RL：四阶段全景 —— 🟡 本节读完就够 （预训练→Mid-training→SFT→RL 各在做什么、什么时候该补底座、SFT 与 RL 的本质区别） ⏭️ 8.2 / 8.3 经典 RL Agent / 模型预训练基础 —— 原书自带 [可选阅读] 标注，跳过 🔴 8.4–8.13 Mid-training / SFT / 单轮 RL / RL 算法 / RL 环境 / 多轮与信用分配 / 奖励设计 / 蒸馏 —— 整块跳过 ，除非你要和算法团队对话 🟡 8.14 从问题案例到后训练 —— ★升格：三个案例（Coding Agent 过早结束 / 中文引号 / 编辑文件经常失败）写得像事故复盘， 可以只读案例，不读方法 ——这是\"什么时候该找算法团队\"的决策入口 ⏭️ 8.15 后训练实践要点 / 8.16 本章小结 / 8.17 思考题 定位： p.224-263 📄 ❝ 只需记住两句 ▸ 模型能力分四段形成：预训练（通识）→ Mid-training（专业教材）→ SFT（示范答题）→ RL（自己下场做题） 数据和环境，比算法更重要。 很多场景只要底座和示范数据到位，甚至不需要做 RL 定位： p.224-263 📄 📝 产品含义 ▸ 不需要懂 RL。只需要知道： 当你的场景\"再怎么改提示词和工具都不行\"，可能存在一条\"后训练\"的路 —— 这时候该找算法团队，而不是继续逼研发调 prompt。 第 9 章 · Agent 的持续进化 📝 技术门槛：🟡 半技术 —— 9.2 的产品含义比实现重要 ▸ ✅ 9.1 从运行轨迹中获得学习信号 —— 🟢 读 ✅ 9.2 持续进化的四种方法 —— 🟢 ★升格 ：知识 / 指令 / 程序 / 参数， 可回滚程度从高到低 （9.2.2 的两个例子很实用：转接边界规则化、需求澄清 Skill）；9.2.3.1 DeepSeek Harness 案例 🟡 可看 🟡 9.3 构建可长期运行的持续进化闭环 —— 9.3.1 \"完成 ≠ 进步\"（🟢 值得读）、9.3.2 安全边界、9.3.3 睡眠学习（🟡） ⏭️ 9.4 本章小结 / 9.5 思考题 定位： p.264-279 📄 ❝ 核心内容 ▸ 经验的四种沉淀载体，可回滚程度从高到低： 知识（文档）→ 指令（Prompt/Skill）→ 程序（代码）→ 参数（模型权重） 加上「睡眠学习」（整合、遗忘与能力保鲜）和持续进化的安全边界 定位： p.264-279 📄 ⚠️ 一个容易被跳过的洞见 ▸ 保存经历 ≠ 从经历中学习。 把轨迹存进记忆库，不会自动产生跨案例比较。 学习发生在系统主动完成「评价、对照、归纳、验证」之后——这对你设计\"Agent 能不能越用越好\"的产品承诺，是直接的约束。 第 10 章 · 多 Agent 协作 ✅ 技术门槛：🟢 概念型（10.4 为 🟡）—— 除了 10.4 的拓扑细节，全章都好读 ▸ ✅ 10.1 多 Agent 协作的分类框架 —— 🟢 两个维度：上下文是否共享 / 协作拓扑 ✅ 10.2 多 Agent 何时真正优于单 Agent —— 🟢 本章最值钱一节 ✅ 10.3 共享上下文的多 Agent 协作 —— 🟢 短 🟡 10.4 不共享上下文的多 Agent 协作 —— 10.4.1 文件系统视角（🟢）、10.4.2 通信与控制（🟡）、 10.4.3 对等协作模式（含提议者-审核者、辩论、头脑风暴、专家小组，🟢 与第 1 章设计模式呼应） 、10.4.4 管理者模式、10.4.5 去中心化、10.4.6 A2A 协议（A2A 部分半年即过时） ✅ 10.5 多 Agent 协作的失败模式 —— 🟢 必读 ，六种失败模式是评审用的\"防坑清单\" 🟡 10.6 Agent 社会 —— 案例向，当故事读；斯坦福 AI 小镇 / Agentopia / Moltbook / Vending-Bench / 狼人杀，挑感兴趣的看，产品名时效风险高 ⏭️ 10.7 本章小结 / 10.8 思考题 定位： p.280-310 📄 · 失败模式在 p.301 📄 ❝ 核心内容 ▸ 10.1–10.2 分类与判断 ：两个维度（上下文是否共享 / 协作拓扑）； 多 Agent 何时真正优于单 Agent 10.3–10.4 拓扑 ：共享上下文 / 隔离上下文（虚拟文件系统、通信与控制、对等协作、管理者、去中心化、A2A） 10.5 六种失败模式 ：并发冲突 / 级联放大 / 同质趋同 / 互相扯皮 / 循环失控 / 理解债与认知投降 10.6 Agent 社会 ：斯坦福 AI 小镇、长期生活模拟、Agent 社交网络、经济竞争、狼人杀博弈 定位： p.280-310 📄 · 失败模式在 p.301 📄 ✅ 第一判断标准 ▸ 是否真正带来信息增量、是否值得额外的 token 成本。 如果多个 Agent 只是把同一个模型的同一条思维链拆开跑，那不叫多 Agent，叫多花钱。 后记：回到 Agent = LLM + 上下文 + 工具 ❝ 技术门槛：🟢 概念型 —— 10 分钟，必读 ▸ ✅ 两朵乌云 —— 实时性 + 持续学习两个前沿，判断方向用的锚 ✅ 模型与 Agent 的共同演进 —— 模型每内化一层约束，就会抹平一批只靠 Harness 建立的优势 定位： p.311-313 📄 本书比课程深在哪（三条必补） 🧪 这三条建议进课程的正文（暂未改，见 课程框架评审 · 2026-09-30 ） ▸ 1. 可靠性有了可测量口径。 （来源 🟢 7.2） 课程 卡A · 可靠性判断卡 用的是\"每步 95%、10 步约 60%\"的连乘估算。本书给了两个正式指标： Pass@k = 1 − (1−p)^k （k 次里至少成功一次）→ 看能力上限，适合探索类任务 Pass^k = p^k （连续 k 次每次都成功）→ 看业务可靠性，适合支付、退款、权限变更 单次成功率 0.6 时：Pass@5 ≈ 99% ，Pass^5 ≈ 7.8% 。前者是\"技术奇观\"，后者才是能上线的标准。 另外一条硬约束： 会产生副作用的操作不能\"重试到成功\" ，必须在沙盒或可回滚环境里采样。 💡 零基础口径：这两个公式不用背 ，记住\"连续 k 次都成功 ≠ k 次里成功一次\"这个区别即可——区别本身比公式值钱。 → p.196-197 📄 🧪 2. 有了区分\"模型问题\"和\"Harness 问题\"的方法。（来源 🟡 7.6 + 7.10.1） ▸ 课程 L3 只说\"先分类失败再动手\"，但没给工具。本书给两个： 消融实验 ：固定模型，逐一关闭 Harness 的某个组件 → 定位 Harness 内部哪个部件重要 模型替换实验 ：固定 Harness，只换更强/更弱的模型 → 区分 瓶颈在模型还是在 Harness 读法：换强模型分数不涨 → 瓶颈在 Harness；换弱模型分数大跌 → 瓶颈在模型能力本身。 配套数据点： 不换模型、只改 Harness，准确率从 52.8% 提到 66.5%。 → p.211-215 📄 · 消融与 AB 在 p.219-221 📄 🧪 3. 上下文工程从\"三条认知\"变成了\"三条可提的要求\"。（来源 🔴 2.3 / 2.5 / 2.7 —— 只需拿结论） ▸ 课程 L2 说\"上下文是有限资源\"。本书给了三个可以写进 PRD 的约束： 前缀稳定性 ：上下文前缀（系统提示词 + 工具定义）越稳定，缓存命中越高；改动越靠前，作废越多 Skills 的加载方式 ：元数据常驻、正文按需——这是\"渐进式披露\"在上下文里的具体形态 压缩 vs 隔离 ：压缩有信息损失，隔离（子 Agent 独立上下文）没有—— 优先隔离 → p.50-59 📄 · p.64-69 📄 · p.74-79 📄 ⚠️ 这三条来自书中 技术门槛最高 的两节， 按\"读结论、不读推导\"的方式取用 。 课程比本书强在哪（别丢） ✅ 这是你的护城河，本书完全没有 ▸ 课程独有 为什么本书给不了 L4 · 落地层 · 能交付 的 PRD 六要素、UX 五模式、竞品体验清单 本书作者是模型侧/Agent 架构侧的工程视角，不写产品交付物 卡C · 不该做清单 的五类不该做 + 降级路径 本书默认\"要做\"，只在编排模式里提了一句\"从最简单开始\" 卡B · 成本与延迟判断卡 的产品化红线（延迟 P95、成本上限） 本书讲成本分析的方法，不讲\"用户会等多久\" 上线四步（灰度 / 对照 / 预期管理 / 兜底） 本书不涉及发布节奏与预期管理 卡D · 科研场景专项卡 的四条硬红线 本书没有按行业场景做产品约束 一句话：本书是\"怎么造\"，课程是\"要不要造、造给谁、怎么验收\"。 别因为拿到一本 42 万字的书，就把课程改造成工程手册——那等于把唯一不可替代的部分删掉。 一个口径冲突：RAG ⚠️ 表面矛盾，实际不矛盾——但必须标注，否则会误读 ▸ 课程 L2 ：「长上下文降价后，'要不要上 RAG'不再是默认答案。先算：文档全塞进去要多少 token、多少钱、多慢」 本书第 3 章 ：用约 30 页讲 RAG 全流水线（分块 / 嵌入 / 混合检索 / 重排序）， 技术门槛 🔴 不矛盾，但层次不同： 本书讲的是\"如果要做知识库/长期记忆，工程上怎么做\"； 篇幅长不等于推荐做 。 课程讲的是\"先判断要不要做\"——这个判断仍然成立，而且优先级更高。 正确的读法 ：先过一遍 卡C · 不该做清单 ，确认要做，再翻第 3 章当施工图（且只读 3.1 与 3.3）。 反向读（先看施工图再做决策）正是课程反复警告的\"被 demo 绑架\"。 时效风险 ⚠️ 引用纪律：只取结构，不取数字和产品名 ▸ 本书是 2026 年上半年的快照。以下内容 半年内就可能过时 ，引用时要降级处理： 具体产品名：OpenClaw、Manus、Pine、豆包手机助手、GPT-6 Astra、小米 MiMo、Taalas HC1 具体数字：52.8% → 66.5%、1000 token/s、17000 token/s 具体基准：τ²-bench、Terminal-Bench、SWE-bench、GAIA、OSWorld 上下文长度与定价相关的一切 可以安全引用的 是结构性结论：Harness 有杠杆、模型会一层层内化 Harness、Pass@k 与 Pass^k 的区别、六种多 Agent 失败模式。 这与总纲「每条资料都标核对时间」是同一纪律。 补充：产品名与实现细节最密集的正是 🔴 章节（2.3 缓存实现、3.2 RAG 流水线、5.1 工具实现、6.2 OpenClaw、8 后训练）， 这也算技术门槛标注的一个附带好处——🔴 的地方本来就最容易过期。 本次拆散清单 📝 这次对课程体系做了什么（全部为新增，未删除任何原有内容） ▸ ✅ 新增本导读 + 课程框架评审 · 2026-09-30 ✅ 书籍文件入库： AI-Agents-in-Depth-zh-CN.pdf （313 页）+ .epub ✅ 00 · 学习总纲 ：文件索引加 2 行；「2026 关键变化备忘」加第 7 条（Harness 是竞争力所在） ✅ L1 · 语言层 · 能听懂 ：第 1 章挂进模型生态小节 ✅ L2 · 结构层 · 能选型 ：6 个小节各挂对应章节（复杂度三档 / 七积木 / ACI / 上下文工程 / MCP / RAG） ✅ L3 · 判断层 · 能评估 ：第 7 章挂进评测体系，并新增「瓶颈定位」条目 ✅ L4 · 落地层 · 能交付 ：第 6 章挂进 UX 五模式 ✅ 术语速查表 ：新增「工程与评估（本书补充）」一组 ✅ 卡A / 卡B / 卡C / 卡D：延伸阅读各加一条对应章节 未改动 ：课程的四层骨架、原有每一条资料、原来的三张表结构。 框架层面的修改建议单独放在 课程框架评审 · 2026-09-30 ，等你确认后再动手。 📝 2026-10-03 修订（评审回炉） ▸ ✅ 投入估计修正 ：8-10h → 约 10-14h （第 1 章 + 第 7 章精读按 6-7h 计） ✅ 7.2 口径修正 ：Pass@k / Pass^k 标\"公式可不背\"，对齐零基础学习口径 ✅ 消除内部不一致 ：第 4 章\"建议整章读\"→\"建议 4.1–4.4 读\"；第 5 章挂载状态更新（L2 已落地「代码作为元能力」横切补充） ✅ 三处升格（★） ：3.1 用户记忆（科研助手相关）、9.2 进化四方法（\"越用越好\"承诺）、8.14 三案例（后训练决策入口）；第 9 章从\"可以跳过\"改为\"建议\" ✅ 「产品人读法」表新增 2.4 提示工程、3.1 两行 [!note] 2026-10-02 修订 ✅ 核对原书 epub 目录， 逐章补全带编号的小节清单 （新增「逐章说明」整节，10 章 + 引言 + 后记） ✅ 新增 技术门槛三级标注 （🟢 / 🟡 / 🔴）与图例：每章、每建议小节都标了 ✅ 「产品人读法」表新增技术门槛列；把原\"建议\"里的 2.3、2.7 明确降级为 🔴 并给出\"只拿结论\"的读法 ✅ 「逐章地图」表新增技术门槛列 + 全书门槛分布速览 ⏳ 未做、待你确认 ：L1–L4 各层挂载点、卡A–卡D 延伸阅读里，是否也要补上同样的门槛标记（保持一致） 📝 导航 ▸ 总纲： 00 · 学习总纲 框架评审： 课程框架评审 · 2026-09-30 四层主干： L1 · 语言层 · 能听懂 · L2 · 结构层 · 能选型 · L3 · 判断层 · 能评估 · L4 · 落地层 · 能交付 在线版（可全文搜索）：https://bojieli.github.io/ai-agent-book/ "}, {"slug": "p-380ab2d43a", "title": "课程框架评审 · 2026-09-30", "group": "参考与工具", "icon": "📚", "updated": "2026-09-30", "invest": "", "html": "<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">结论先给</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>骨架不用改，缺口有四处，另建议加一张横切卡 + 改两处表述。</strong></p>\n<p>四层能力分层（语言 / 结构 / 判断 / 落地）能完整接住这本书的 10 章——这本身就是框架覆盖度成立的证据。 问题不在分层逻辑，而在<strong>层内的几个口径不够硬</strong>。</p>\n<p>下面每条都给了可直接粘贴的补丁文案。<strong>落地状态见第七节</strong>：已落地的条目一律挂了「待复核」标记，未落地的标 <strong>待定</strong>。</p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">评审依据</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>对照对象：《深入理解 AI Agent》（李博杰，313 页 / 10 章，2026-09-30 入库） 详见 <a class=\"wl\" href=\"#/p-6643528717\">书 · 深入理解 AI Agent · 导读</a></p></div></details>\n<hr>\n<h2 id=\"h-99900d0b0c\">一 · 为什么说骨架是对的（三条证据）</h2>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">证据一：映射是完整的，没有一章\"挂不上去\"</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>本书 10 章全部能找到课程落点（第 5、8、9 章挂在\"缺口/不必学\"，其余全部有对应层）。 <strong>一套只有四层的产品视角框架，接得住一本 313 页的工程教材——说明分层维度选对了。</strong> 如果框架有问题，最先出现的症状是\"某几章无处可放\"。</p></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">证据二：横切设计撞车了</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程用「四层主干 + 四张横切卡」，书用「五条主线 + 5 个设计模式 + 3 层护栏」。 两个独立来源都选择\"主干按顺序、工具不按顺序\"，说明这不是巧合，是这类知识的结构属性。</p></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">证据三：课程的取舍是对的</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>书里<strong>没有一章</strong>讲\"该不该做\"、PRD、UX 模式、上线节奏、成本红线。 而课程把 <a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a> 和 <a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a> 放在核心位置—— 这正是书（工程视角）的结构性盲区，也是课程唯一不可替代的部分。</p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">但有一条要警惕</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>「必须补工程深度」和「把课程改造成工程手册」是两件完全不同的事。 <strong>新增内容必须仍然服务于判断，而不是服务于实现。</strong> 判断标准：这条内容能不能变成一个评审会上的提问？ 不能的话，它属于书，不属于课程。</p></div></details>\n<hr>\n<h2 id=\"h-6cd37b7456\">二 · 建议的四处内容补充（不改层级）</h2>\n<h3 id=\"h-916925646b\">补充一 · L3 新增「瓶颈定位」小节 ★优先级最高</h3>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">问题</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程 L3 说\"评测显示 65%，下一步先分类失败再动手\"——<strong>方向对，但没给工具。</strong> 研发说\"这是模型能力问题\"，你没法反驳；说\"prompt 再调调\"，你也判断不了该不该同意。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">建议加入 L3 第二部分的位置：紧接「一 · 三件必须分开的事」之后，作为新的一节</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><pre><code>### 一点五 · 瓶颈在模型还是在 Harness？（两个实验就能分清）\n\n| 手段 | 固定什么 | 变什么 | 回答什么问题 |\n| --- | --- | --- | --- |\n| 消融实验 | 模型 | 逐一关闭 Harness 的组件 | Harness 内部哪个部件重要 |\n| 模型替换实验 | Harness | 换成更强/更弱的模型 | 瓶颈在模型，还是在 Harness |\n\n读法：换强模型分数不涨 → 瓶颈在 Harness，该优化提示词/工具/反馈循环；\n换弱模型分数大跌 → 瓶颈在模型能力本身，别让研发继续调 prompt。\n\n参考数据点：不换模型、只改 Harness，任务准确率从 52.8% 提到 66.5%。\n**评审含义：Agent 评估的对象不是模型，是&quot;模型 + Harness&quot;的组合体。**</code></pre></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">为什么这条优先级最高</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>它把 L3 从\"会说结论\"升级为\"能定位问题\"，是判断层真正的分水岭。 出处：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=211\" target=\"_blank\" title=\"打开本地文件\">p.211-215 <span class=\"pdf-badge\">📄</span></a> · 消融与 AB 在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=219\" target=\"_blank\" title=\"打开本地文件\">p.219-221 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<h3 id=\"h-a806336877\">补充二 · 可靠性口径升级：步数连乘 → Pass@k / Pass^k</h3>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">问题</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> 现在用的是\"每步 95%、10 步约 60%\"的连乘估算。 这个算法<strong>方向正确但口径不规范</strong>：研发可能回答\"我们测的是端到端，没测过单步\"，于是讨论中断。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">建议改法：卡片开头保留\"步数越多越不可靠\"的结论，把「三个数字」一节升级为下面的口径</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><pre><code>&gt; [!quote] 两个必须分清的指标（比&quot;连乘&quot;更硬）\n&gt; - **Pass@k = 1 − (1−p)^k**：k 次里**至少成功一次** → 衡量能力上限（技术奇观）\n&gt; - **Pass^k = p^k**：连续 k 次**每次都成功** → 衡量业务可靠性（能上线的标准）\n&gt;\n&gt; 单次成功率 p = 0.6 时：Pass@5 ≈ 99%，但 Pass^5 ≈ 7.8%。\n&gt; 前一个数字适合发新闻，后一个数字才适合写验收标准。\n&gt;\n&gt; **两条硬约束：**\n&gt; 1. 评估报告必须写清 k 的口径：是同一任务采样 k 次，还是流水线上连续 k 个任务\n&gt; 2. 会产生副作用的操作（支付、退款、权限变更、生产部署）**不能&quot;重试到成功&quot;**，\n&gt;    必须在沙盒或可回滚环境里采样，且每次失败都要记入可靠性指标</code></pre></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">为什么值得改</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这一条同时修好了卡片 A 和 L3：课程现在说\"端到端成功率\"，研发可以说\"我们 99% 能成功一次\"—— 升级后你能直接问一句 <strong>\"你说的是 Pass@k 还是 Pass^k？\"</strong> 这就是判断层该有的问题。 出处：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=196\" target=\"_blank\" title=\"打开本地文件\">p.196-197 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<h3 id=\"h-95193730d9\">补充三 · L3「安全与权限边界」从三条扩到四条</h3>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">问题</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>现在这三条（能碰什么 / 什么要人点头 / 数据怎么用）全是<strong>权限</strong>问题。 缺了当下最普遍的一类威胁：<strong>提示注入</strong>——外部数据（网页、文档、邮件）里埋指令，偷偷操纵 Agent 行为。 它和\"越狱\"是两回事：越狱是用户自己绕限制，注入是攻击者借数据下手。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">建议在第 4 条后追加</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><pre><code>4. **Agent 读到的内容能不能当指令执行**——外部数据（网页/文档/邮件）里的内容必须当&quot;数据&quot;处理，\n   不能当&quot;指令&quot;执行。这类攻击叫提示注入，是当前 Agent 最普遍的失守方式。\n\n**关键约束：处在同一个上下文里的 Agent，很难判断自己是否已被注入。**\n所以光在&quot;上下文层&quot;做过滤不够——必须在&quot;执行层&quot;再拦一次：\n高风险操作由上下文之外的机制复核（独立进程、最小权限凭证、沙盒、人在回路）。</code></pre>\n<p>出处：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=63\" target=\"_blank\" title=\"打开本地文件\">p.63 <span class=\"pdf-badge\">📄</span></a> · 三层护栏 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=33\" target=\"_blank\" title=\"打开本地文件\">p.33 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<h3 id=\"h-ebeaca7dc6\">补充四 · L2 的结构层缺\"代码作为元能力\"这一档</h3>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">问题</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程 L2 的复杂度三档是：直连模型 / 单 Agent + 工具 / 多 Agent。 本书给了一个课程没有的答案：<strong>通用 Agent = Coding Agent + 文件系统</strong>，代码不是工具，是元能力（能在运行时造出新的工具）。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">建议：不动三档表，在「一 · 复杂度三档」下面加一段\"横切补充\"</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><pre><code>&gt; [!note] 一条贯穿三档的元能力：让 Agent 写代码\n&gt; 三档说的是&quot;路径由谁来定&quot;，但还有一条与档位正交的选择：**这个能力要不要用代码实现。**\n&gt; 代码的价值在于它同时是①思考工具（可验证的形式化）②业务规则的确定性防线 ③系统适配器 ④生成式 UI。\n&gt;\n&gt; **评审时多问一句：&quot;这个需求能不能让 Agent 自己写代码解决？&quot;**\n&gt; 六种应用方向与代价见《深入理解 AI Agent》5.2 节。</code></pre>\n<p>出处：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=144\" target=\"_blank\" title=\"打开本地文件\">p.144-159 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<hr>\n<h2 id=\"h-fa18657a1e\">三 · 建议新增一张横切卡：卡E · 交互扩展判断卡</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">理由</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>本书第 6 章（异步事件 / 语音 / Computer Use / 机器人）是课程<strong>完全空缺</strong>的一整块， 且 6.5 节（VLA 局限、世界模型、sim2real）与你跟踪具身智能方向直接相关。</p>\n<p>但它是<strong>工具型知识而非必修课</strong>——正好符合课程\"横切卡不占顺序、是工具不是课程\"的定位。 <strong>不建议为它新增一层</strong>（那会让四层变五层，破坏\"能力层级\"这个划分维度）。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">卡E 内容草案（四条，每条一个可问的问题）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>条目</th><th>一句话</th><th>该问研发的问题</th></tr></thead><tbody><tr><td>异步与接管</td><td>世界不会停下来等它想完</td><td>任务跑 10 分钟，用户中途改主意怎么办？断电了能不能续？</td></tr><tr><td>Computer Use 的状态确认</td><td>动作执行完 ≠ 目标达成</td><td>它点完按钮，怎么确认真的生效了？</td></tr><tr><td>语音三范式</td><td>级联 / 端到端 / 全双工，代价依次上升</td><td>我们只需要听懂，还是需要能被打断？</td></tr><tr><td>机器人与具身边界</td><td>VLA 能做短程控制，长程仍要规划 + 世界模型</td><td>这个任务失败了，是抓取失败还是规划失败？</td></tr></tbody></table></div>\n<p>出处：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=162\" target=\"_blank\" title=\"打开本地文件\">p.162-191 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<hr>\n<h2 id=\"h-11d1380411\">四 · 建议的两处表述修订</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">修订一：总纲「资料在哪」那句话现在不准了</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>原文说「<strong>资料不再单独放一个文件</strong>，而是拆散贴在 L1-L4 每个小节的正下方」。 现在入库了一本 313 页的书，这句话需要区分两类资料，否则以后会出现\"那本书算不算内联资料\"的混乱。</p>\n<p>建议改为：</p>\n<pre><code>&gt; [!tip] 资料在哪（两类，别混）\n&gt; **① 点到点的文章/网页** —— 全部拆散内联在 L1-L4 各小节正下方，读到哪点哪。\n&gt; **② 整本外部资料**（如《深入理解 AI Agent》）—— 不内联，单独维护导读，\n&gt;    并在各层对应小节挂**具体章节**的深链。索引见「文件索引」表。</code></pre></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">修订二：L3 的「三件必须分开的事」现在是四件</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程说 demo / 测试集 / 在线指标三件分开。本书补了第四件：<strong>内部评估基础设施</strong>（消融、AB 测试、双层特性开关、提示词敏感性）。 前三件是\"判断系统行不行\"，第四件是\"判断<strong>我们的改动</strong>有没有用\"——在模型快速迭代期，这件比前三件更常用。</p>\n<p>建议把小节标题改为「四件必须分开的事」，第四列补一行：</p>\n<pre><code>| 内部评估 | 这次改动有没有用 | 每次迭代决策 | 需要基础设施投入 |</code></pre></div></details>\n<hr>\n<h2 id=\"h-31dfad2d94\">五 · 不建议做的两件事</h2>\n<details class=\"callout co-danger\"><summary><span class=\"co-icon\">🚨</span><span class=\"co-title\">一、不要按书的 10 章重构课程</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>那会把课程从\"产品判断\"降级成\"工程实现\"，丢掉的正是第一节里证明的唯一不可替代的部分。 书是<strong>深水区参考资料</strong>，课程是<strong>决策框架</strong>——两者是工具与用途的关系，不是新旧关系。</p></div></details>\n<details class=\"callout co-danger\"><summary><span class=\"co-icon\">🚨</span><span class=\"co-title\">二、不要新增\"L5 工程实现层\"</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>新增一层看起来是\"补全\"，实际是把课程变成书的摘要，还破坏了\"四层 = 四种能力\"这个干净维度。 缺的东西用<strong>横切卡</strong>（卡E）和<strong>层内小节</strong>补，不要动层数。</p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">也不建议：把第 8 章（后训练）和第 9 章（持续进化）纳入必修</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>对产品经理，这两章的细节是伪必修。建议在导读里明确标注\"知道这两条路存在、 <strong>什么时候该找算法团队</strong>即可\"——避免被 42 万字淹没（导读已按此处理）。</p></div></details>\n<hr>\n<h2 id=\"h-f060567eef\">六 · 维护建议</h2>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">两条</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-cd97343b59\"><span>把本书登记为「按版本号引用的外部资料」：链接里带上版本（v1.1），与总纲\"每条资料半年一刷\"的纪律绑定</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-195ae7a45a\"><span>书的社区多语言翻译普遍滞后于中文原版；若引用英文版或网页版内容，先确认版本一致</span></label></li></ul></div></details>\n<hr>\n<h2 id=\"h-242a2fffed\">七 · 执行清单（状态已同步 · 2026-09-30）</h2>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">状态说明</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>原书尚未读完，因此<strong>已落地的条目一律挂了「待复核」标记</strong>（在各层正文里，读到时可见）， 尚未落地或未定去留的标 <strong>待定</strong>。读完对应页码后再逐条定去留。</p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">逐条状态</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>#</th><th>条目</th><th>状态</th></tr></thead><tbody><tr><td>1</td><td>L3 新增「瓶颈定位」小节（消融 vs 模型替换）</td><td>已落地 · 待复核（L3「一·五」）</td></tr><tr><td>2</td><td><a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> 升级为 Pass@k / Pass^k 口径</td><td><strong>半落地 · 待定</strong>——正文「三个数字」仍是步数连乘，升级文案只写在延伸阅读</td></tr><tr><td>3</td><td>L3「安全与权限边界」追加提示注入（三条 → 四条）</td><td>已落地 · 待复核（L3 第 4 条）</td></tr><tr><td>4</td><td>L2 加「代码作为元能力」横切补充</td><td>已落地 · 待复核（L2「与档位正交的选择」）</td></tr><tr><td>5</td><td>新增 卡E · 交互扩展判断卡 + 挂总纲索引</td><td><strong>未做 · 待定</strong></td></tr><tr><td>6</td><td>修订总纲「资料在哪」的表述（区分两类资料）</td><td>已落地 · 待复核（总纲）</td></tr><tr><td>7</td><td>修订 L3「三件必须分开的事」→ 四件</td><td>已落地 · 待复核（L3）</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-question\"><summary><span class=\"co-icon\">❓</span><span class=\"co-title\">三条待定项的判断入口（每条只配一个是非题）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>卡A 口径</strong> → p.196-197：有没有\"做错一次就要付代价\"的动作（结论写进用户文档、对外发送、扣费）？</li><li><strong>L2 元能力</strong> → 第 5 章 p.130 起：产品是不是开放任务型（用户说啥都能干）？</li><li><strong>卡E</strong> → 第 6 章 p.162-191：有语音入口 / 浏览器操作 / 硬件吗？三个都没有就可以不做。</li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>总纲：<a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a></li><li>书籍导读：<a class=\"wl\" href=\"#/p-6643528717\">书 · 深入理解 AI Agent · 导读</a></li><li>涉及层：<a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a> · <a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a> · <a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a></li></ul></div></details>", "search": " 💡 结论先给 ▸ 骨架不用改，缺口有四处，另建议加一张横切卡 + 改两处表述。 四层能力分层（语言 / 结构 / 判断 / 落地）能完整接住这本书的 10 章——这本身就是框架覆盖度成立的证据。 问题不在分层逻辑，而在 层内的几个口径不够硬 。 下面每条都给了可直接粘贴的补丁文案。 落地状态见第七节 ：已落地的条目一律挂了「待复核」标记，未落地的标 待定 。 📝 评审依据 ▸ 对照对象：《深入理解 AI Agent》（李博杰，313 页 / 10 章，2026-09-30 入库） 详见 书 · 深入理解 AI Agent · 导读 一 · 为什么说骨架是对的（三条证据） ✅ 证据一：映射是完整的，没有一章\"挂不上去\" ▸ 本书 10 章全部能找到课程落点（第 5、8、9 章挂在\"缺口/不必学\"，其余全部有对应层）。 一套只有四层的产品视角框架，接得住一本 313 页的工程教材——说明分层维度选对了。 如果框架有问题，最先出现的症状是\"某几章无处可放\"。 ✅ 证据二：横切设计撞车了 ▸ 课程用「四层主干 + 四张横切卡」，书用「五条主线 + 5 个设计模式 + 3 层护栏」。 两个独立来源都选择\"主干按顺序、工具不按顺序\"，说明这不是巧合，是这类知识的结构属性。 ✅ 证据三：课程的取舍是对的 ▸ 书里 没有一章 讲\"该不该做\"、PRD、UX 模式、上线节奏、成本红线。 而课程把 卡C · 不该做清单 和 L4 · 落地层 · 能交付 放在核心位置—— 这正是书（工程视角）的结构性盲区，也是课程唯一不可替代的部分。 ⚠️ 但有一条要警惕 ▸ 「必须补工程深度」和「把课程改造成工程手册」是两件完全不同的事。 新增内容必须仍然服务于判断，而不是服务于实现。 判断标准：这条内容能不能变成一个评审会上的提问？ 不能的话，它属于书，不属于课程。 二 · 建议的四处内容补充（不改层级） 补充一 · L3 新增「瓶颈定位」小节 ★优先级最高 🧪 问题 ▸ 课程 L3 说\"评测显示 65%，下一步先分类失败再动手\"—— 方向对，但没给工具。 研发说\"这是模型能力问题\"，你没法反驳；说\"prompt 再调调\"，你也判断不了该不该同意。 ❝ 建议加入 L3 第二部分的位置：紧接「一 · 三件必须分开的事」之后，作为新的一节 ▸ ### 一点五 · 瓶颈在模型还是在 Harness？（两个实验就能分清） | 手段 | 固定什么 | 变什么 | 回答什么问题 | | --- | --- | --- | --- | | 消融实验 | 模型 | 逐一关闭 Harness 的组件 | Harness 内部哪个部件重要 | | 模型替换实验 | Harness | 换成更强/更弱的模型 | 瓶颈在模型，还是在 Harness | 读法：换强模型分数不涨 → 瓶颈在 Harness，该优化提示词/工具/反馈循环； 换弱模型分数大跌 → 瓶颈在模型能力本身，别让研发继续调 prompt。 参考数据点：不换模型、只改 Harness，任务准确率从 52.8% 提到 66.5%。 **评审含义：Agent 评估的对象不是模型，是\"模型 + Harness\"的组合体。** 📝 为什么这条优先级最高 ▸ 它把 L3 从\"会说结论\"升级为\"能定位问题\"，是判断层真正的分水岭。 出处： p.211-215 📄 · 消融与 AB 在 p.219-221 📄 补充二 · 可靠性口径升级：步数连乘 → Pass@k / Pass^k 🧪 问题 ▸ 卡A · 可靠性判断卡 现在用的是\"每步 95%、10 步约 60%\"的连乘估算。 这个算法 方向正确但口径不规范 ：研发可能回答\"我们测的是端到端，没测过单步\"，于是讨论中断。 ❝ 建议改法：卡片开头保留\"步数越多越不可靠\"的结论，把「三个数字」一节升级为下面的口径 ▸ > [!quote] 两个必须分清的指标（比\"连乘\"更硬） > - **Pass@k = 1 − (1−p)^k**：k 次里**至少成功一次** → 衡量能力上限（技术奇观） > - **Pass^k = p^k**：连续 k 次**每次都成功** → 衡量业务可靠性（能上线的标准） > > 单次成功率 p = 0.6 时：Pass@5 ≈ 99%，但 Pass^5 ≈ 7.8%。 > 前一个数字适合发新闻，后一个数字才适合写验收标准。 > > **两条硬约束：** > 1. 评估报告必须写清 k 的口径：是同一任务采样 k 次，还是流水线上连续 k 个任务 > 2. 会产生副作用的操作（支付、退款、权限变更、生产部署）**不能\"重试到成功\"**， > 必须在沙盒或可回滚环境里采样，且每次失败都要记入可靠性指标 📝 为什么值得改 ▸ 这一条同时修好了卡片 A 和 L3：课程现在说\"端到端成功率\"，研发可以说\"我们 99% 能成功一次\"—— 升级后你能直接问一句 \"你说的是 Pass@k 还是 Pass^k？\" 这就是判断层该有的问题。 出处： p.196-197 📄 补充三 · L3「安全与权限边界」从三条扩到四条 🧪 问题 ▸ 现在这三条（能碰什么 / 什么要人点头 / 数据怎么用）全是 权限 问题。 缺了当下最普遍的一类威胁： 提示注入 ——外部数据（网页、文档、邮件）里埋指令，偷偷操纵 Agent 行为。 它和\"越狱\"是两回事：越狱是用户自己绕限制，注入是攻击者借数据下手。 ❝ 建议在第 4 条后追加 ▸ 4. **Agent 读到的内容能不能当指令执行**——外部数据（网页/文档/邮件）里的内容必须当\"数据\"处理， 不能当\"指令\"执行。这类攻击叫提示注入，是当前 Agent 最普遍的失守方式。 **关键约束：处在同一个上下文里的 Agent，很难判断自己是否已被注入。** 所以光在\"上下文层\"做过滤不够——必须在\"执行层\"再拦一次： 高风险操作由上下文之外的机制复核（独立进程、最小权限凭证、沙盒、人在回路）。 出处： p.63 📄 · 三层护栏 p.33 📄 补充四 · L2 的结构层缺\"代码作为元能力\"这一档 🧪 问题 ▸ 课程 L2 的复杂度三档是：直连模型 / 单 Agent + 工具 / 多 Agent。 本书给了一个课程没有的答案： 通用 Agent = Coding Agent + 文件系统 ，代码不是工具，是元能力（能在运行时造出新的工具）。 ❝ 建议：不动三档表，在「一 · 复杂度三档」下面加一段\"横切补充\" ▸ > [!note] 一条贯穿三档的元能力：让 Agent 写代码 > 三档说的是\"路径由谁来定\"，但还有一条与档位正交的选择：**这个能力要不要用代码实现。** > 代码的价值在于它同时是①思考工具（可验证的形式化）②业务规则的确定性防线 ③系统适配器 ④生成式 UI。 > > **评审时多问一句：\"这个需求能不能让 Agent 自己写代码解决？\"** > 六种应用方向与代价见《深入理解 AI Agent》5.2 节。 出处： p.144-159 📄 三 · 建议新增一张横切卡：卡E · 交互扩展判断卡 💡 理由 ▸ 本书第 6 章（异步事件 / 语音 / Computer Use / 机器人）是课程 完全空缺 的一整块， 且 6.5 节（VLA 局限、世界模型、sim2real）与你跟踪具身智能方向直接相关。 但它是 工具型知识而非必修课 ——正好符合课程\"横切卡不占顺序、是工具不是课程\"的定位。 不建议为它新增一层 （那会让四层变五层，破坏\"能力层级\"这个划分维度）。 ❝ 卡E 内容草案（四条，每条一个可问的问题） ▸ 条目 一句话 该问研发的问题 异步与接管 世界不会停下来等它想完 任务跑 10 分钟，用户中途改主意怎么办？断电了能不能续？ Computer Use 的状态确认 动作执行完 ≠ 目标达成 它点完按钮，怎么确认真的生效了？ 语音三范式 级联 / 端到端 / 全双工，代价依次上升 我们只需要听懂，还是需要能被打断？ 机器人与具身边界 VLA 能做短程控制，长程仍要规划 + 世界模型 这个任务失败了，是抓取失败还是规划失败？ 出处： p.162-191 📄 四 · 建议的两处表述修订 ⚠️ 修订一：总纲「资料在哪」那句话现在不准了 ▸ 原文说「 资料不再单独放一个文件 ，而是拆散贴在 L1-L4 每个小节的正下方」。 现在入库了一本 313 页的书，这句话需要区分两类资料，否则以后会出现\"那本书算不算内联资料\"的混乱。 建议改为： > [!tip] 资料在哪（两类，别混） > **① 点到点的文章/网页** —— 全部拆散内联在 L1-L4 各小节正下方，读到哪点哪。 > **② 整本外部资料**（如《深入理解 AI Agent》）—— 不内联，单独维护导读， > 并在各层对应小节挂**具体章节**的深链。索引见「文件索引」表。 ⚠️ 修订二：L3 的「三件必须分开的事」现在是四件 ▸ 课程说 demo / 测试集 / 在线指标三件分开。本书补了第四件： 内部评估基础设施 （消融、AB 测试、双层特性开关、提示词敏感性）。 前三件是\"判断系统行不行\"，第四件是\"判断 我们的改动 有没有用\"——在模型快速迭代期，这件比前三件更常用。 建议把小节标题改为「四件必须分开的事」，第四列补一行： | 内部评估 | 这次改动有没有用 | 每次迭代决策 | 需要基础设施投入 | 五 · 不建议做的两件事 🚨 一、不要按书的 10 章重构课程 ▸ 那会把课程从\"产品判断\"降级成\"工程实现\"，丢掉的正是第一节里证明的唯一不可替代的部分。 书是 深水区参考资料 ，课程是 决策框架 ——两者是工具与用途的关系，不是新旧关系。 🚨 二、不要新增\"L5 工程实现层\" ▸ 新增一层看起来是\"补全\"，实际是把课程变成书的摘要，还破坏了\"四层 = 四种能力\"这个干净维度。 缺的东西用 横切卡 （卡E）和 层内小节 补，不要动层数。 📝 也不建议：把第 8 章（后训练）和第 9 章（持续进化）纳入必修 ▸ 对产品经理，这两章的细节是伪必修。建议在导读里明确标注\"知道这两条路存在、 什么时候该找算法团队 即可\"——避免被 42 万字淹没（导读已按此处理）。 六 · 维护建议 📌 两条 ▸ 把本书登记为「按版本号引用的外部资料」：链接里带上版本（v1.1），与总纲\"每条资料半年一刷\"的纪律绑定 书的社区多语言翻译普遍滞后于中文原版；若引用英文版或网页版内容，先确认版本一致 七 · 执行清单（状态已同步 · 2026-09-30） 📝 状态说明 ▸ 原书尚未读完，因此 已落地的条目一律挂了「待复核」标记 （在各层正文里，读到时可见）， 尚未落地或未定去留的标 待定 。读完对应页码后再逐条定去留。 ❝ 逐条状态 ▸ # 条目 状态 1 L3 新增「瓶颈定位」小节（消融 vs 模型替换） 已落地 · 待复核（L3「一·五」） 2 卡A · 可靠性判断卡 升级为 Pass@k / Pass^k 口径 半落地 · 待定 ——正文「三个数字」仍是步数连乘，升级文案只写在延伸阅读 3 L3「安全与权限边界」追加提示注入（三条 → 四条） 已落地 · 待复核（L3 第 4 条） 4 L2 加「代码作为元能力」横切补充 已落地 · 待复核（L2「与档位正交的选择」） 5 新增 卡E · 交互扩展判断卡 + 挂总纲索引 未做 · 待定 6 修订总纲「资料在哪」的表述（区分两类资料） 已落地 · 待复核（总纲） 7 修订 L3「三件必须分开的事」→ 四件 已落地 · 待复核（L3） ❓ 三条待定项的判断入口（每条只配一个是非题） ▸ 卡A 口径 → p.196-197：有没有\"做错一次就要付代价\"的动作（结论写进用户文档、对外发送、扣费）？ L2 元能力 → 第 5 章 p.130 起：产品是不是开放任务型（用户说啥都能干）？ 卡E → 第 6 章 p.162-191：有语音入口 / 浏览器操作 / 硬件吗？三个都没有就可以不做。 📝 导航 ▸ 总纲： 00 · 学习总纲 书籍导读： 书 · 深入理解 AI Agent · 导读 涉及层： L2 · 结构层 · 能选型 · L3 · 判断层 · 能评估 · 卡A · 可靠性判断卡 "}, {"slug": "p-d3656c9d69", "title": "网站维护指南", "group": "参考与工具", "icon": "🛠", "updated": "2026-10-04", "invest": "", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">学习网站在哪、怎么更新</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>本文件夹里有一个可视化学习网站：<code>index.html</code>。 Obsidian 默认隐藏非 md 文件，所以在左侧文件列表里看不到它——用 <strong>Finder</strong> 打开本文件夹就能看到。</p></div></details>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">更新流程（md 改完之后）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>在 Obsidian 里照常编辑 L1–L4、判断卡等任意 md（增删文件都行）</li><li>打开 Finder → 进入本文件夹 → <strong>双击 <code>重建学习网站.command</code></strong>，会自动重建并打开网站</li><li>勾选的学习进度保存在浏览器里，重建不会丢失</li></ul>\n<p>也可以直接在 WorkBuddy 里说一句\"重建学习网站\"，让我来跑。</p></div></details>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">想在 Obsidian 文件列表里看到这些文件</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>设置 → 文件与链接 → 打开 <strong>「检测所有文件扩展名」</strong>， <code>build.py</code> / <code>重建学习网站.command</code> / <code>index.html</code> 就会出现在列表里。 （注意：在 Obsidian 里点 <code>.command</code> 只会当文本打开，执行还是要去 Finder 双击。）</p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">两个注意点</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><code>index.html</code> 要和 <code>AI-Agents-in-Depth-zh-CN.pdf</code> 放在同一目录，书页深链才能点开</li><li><code>归档/</code> 里的旧文件不会被收录进网站</li></ul></div></details>\n<details class=\"callout co-todo\"><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">同步到 GitHub（追加一步）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>改完 md、重建完网站之后，在终端里跑：</p>\n<pre><code>cd &quot;~/Documents/Obsidian Vault/学习项目/Agent AI 学习&quot;\ngit add -A\ngit commit -m &quot;更新 L3 判断层&quot;\ngit push</code></pre>\n<p>推上去之后，线上网站会自动更新（GitHub Pages）。 懒得敲命令行的话，直接跟小元说\"提交并推送\"，我来做。</p>\n<p>线上地址：<code>https://isawang2023.github.io/agent-ai-course/</code></p></div></details>", "search": " 📝 学习网站在哪、怎么更新 ▸ 本文件夹里有一个可视化学习网站： index.html 。 Obsidian 默认隐藏非 md 文件，所以在左侧文件列表里看不到它——用 Finder 打开本文件夹就能看到。 💡 更新流程（md 改完之后） ▸ 在 Obsidian 里照常编辑 L1–L4、判断卡等任意 md（增删文件都行） 打开 Finder → 进入本文件夹 → 双击 重建学习网站.command ，会自动重建并打开网站 勾选的学习进度保存在浏览器里，重建不会丢失 也可以直接在 WorkBuddy 里说一句\"重建学习网站\"，让我来跑。 ℹ️ 想在 Obsidian 文件列表里看到这些文件 ▸ 设置 → 文件与链接 → 打开 「检测所有文件扩展名」 ， build.py / 重建学习网站.command / index.html 就会出现在列表里。 （注意：在 Obsidian 里点 .command 只会当文本打开，执行还是要去 Finder 双击。） ⚠️ 两个注意点 ▸ index.html 要和 AI-Agents-in-Depth-zh-CN.pdf 放在同一目录，书页深链才能点开 归档/ 里的旧文件不会被收录进网站 📌 同步到 GitHub（追加一步） ▸ 改完 md、重建完网站之后，在终端里跑： cd \"~/Documents/Obsidian Vault/学习项目/Agent AI 学习\" git add -A git commit -m \"更新 L3 判断层\" git push 推上去之后，线上网站会自动更新（GitHub Pages）。 懒得敲命令行的话，直接跟小元说\"提交并推送\"，我来做。 线上地址： https://isawang2023.github.io/agent-ai-course/ "}, {"slug": "p-04c6e90faa", "title": "README", "group": "其他", "icon": "", "updated": "", "invest": "", "html": "<h1 id=\"h-54eb356c81\">Agent AI 学习体系</h1>\n<p>一套自建的分层课程：从「能听懂」到「能交付」，四层主干 + 四张横切判断卡。</p>\n<h2 id=\"h-c222403a4c\">目录结构</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>文件</th><th>说明</th></tr></thead><tbody><tr><td><code>00 · 学习总纲.md</code></td><td>课程总入口，定位、路径、起点自测</td></tr><tr><td><code>L1 · 语言层 · 能听懂.md</code></td><td>词汇与术语，听懂别人在说什么</td></tr><tr><td><code>L2 · 结构层 · 能选型.md</code></td><td>架构与方案取舍，知道该用哪个</td></tr><tr><td><code>L3 · 判断层 · 能评估.md</code></td><td>评测与判断，知道好不好</td></tr><tr><td><code>L4 · 落地层 · 能交付.md</code></td><td>工程化与交付，真正做出来</td></tr><tr><td><code>卡A · 可靠性判断卡.md</code></td><td>评审前查：这套东西靠不靠得住</td></tr><tr><td><code>卡B · 成本与延迟判断卡.md</code></td><td>立项前查：要花多少钱、多快</td></tr><tr><td><code>卡C · 不该做清单.md</code></td><td>接需求时查：什么场景别硬上</td></tr><tr><td><code>卡D · 科研场景专项卡.md</code></td><td>科研场景的专项检查</td></tr><tr><td><code>术语速查表.md</code></td><td>术语中英对照与一句话解释</td></tr><tr><td><code>书 · 深入理解 AI Agent · 导读.md</code></td><td>配套书目的章节导读与页码索引</td></tr><tr><td><code>课程框架评审 · 2026-09-30.md</code></td><td>框架的一次自我评审记录</td></tr><tr><td><code>网站维护指南.md</code></td><td>本站站点的更新流程</td></tr><tr><td><code>归档/</code></td><td>早期版本的学习路线与计划</td></tr></tbody></table></div>\n<blockquote><p>配套电子书 <code>AI-Agents-in-Depth-zh-CN.pdf</code> 未纳入版本管理（版权物 + 二进制）。 本地保留即可，网站的「书页深链」依赖它与 HTML 位于同一目录。</p></blockquote>\n<h2 id=\"h-928e5b6dbd\">生成学习网站</h2>\n<p>源文件是上面的 Markdown，网站由 <code>build.py</code> 生成：</p>\n<pre><code>python3 build.py          # 生成 Agent-AI-学习网站.html</code></pre>\n<p>或在 Finder 里双击 <code>重建学习网站 /* ---------------- 状态 ---------------- */
const LS_CB = "agentai-cb-";
const LS_THEME = "agentai-theme";
let currentSlug = null;
let PROGRESS = {};   // slug -> {total, done, ids:[]}

/* ---------------- 初始化 ---------------- */
function initProgress(){
  for(const p of DATA.pages){
    const parser = new DOMParser();
    const doc = parser.parseFromString(p.html, "text/html");
    const ids = [...doc.querySelectorAll("input[data-cb]")].map(i=>i.dataset.cb);
    const done = ids.filter(id=>localStorage.getItem(LS_CB+id)==="1").length;
    PROGRESS[p.slug] = {total: ids.length, done, ids};
  }
}
function refreshProgressUI(){
  let total=0, done=0;
  for(const s in PROGRESS){ total+=PROGRESS[s].total; done+=PROGRESS[s].done; }
  const gt = document.getElementById("gp-text");
  if(gt) gt.textContent = done+" / "+total;
  const gf = document.getElementById("gp-fill");
  if(gf) gf.style.width = total? (done/total*100)+"%" : "0%";
  for(const p of DATA.pages){
    const el = document.querySelector(`.side-link[data-slug="${p.slug}"] .pg`);
    const pr = PROGRESS[p.slug];
    if(el && pr.total){
      el.textContent = pr.done+"/"+pr.total;
      el.parentElement.classList.toggle("all-done", pr.done===pr.total);
    }
  }
  const hgp = document.getElementById("home-gp");
  if(hgp){
    hgp.querySelector(".hp-num").innerHTML = done+"<small> / "+total+"</small>";
    hgp.querySelector(".hp-fill").style.width = (total? done/total*100 : 0)+"%";
  }
  document.querySelectorAll("[data-pr]").forEach(el=>{
    const pr = PROGRESS[el.dataset.pr];
    if(!pr || !pr.total) return;
    const pct = Math.round(pr.done/pr.total*100);
    el.querySelectorAll(".js-fill").forEach(f=>f.style.width = pct+"%");
    el.querySelectorAll(".js-num").forEach(n=>n.textContent = pr.done+"/"+pr.total);
  });
}
function saveProgress(){ refreshProgressUI(); }
function onCbChange(e){
  const id = e.target.dataset.cb;
  localStorage.setItem(LS_CB+id, e.target.checked?"1":"0");
  const pr = PROGRESS[currentSlug];
  if(pr && pr.ids.includes(id)){
    pr.done += e.target.checked?1:-1;
  }
  saveProgress();
}

function buildSidebar(){
  const nav = document.getElementById("side-nav");

    if(p.slug==="how-to-update") continue;
    if(p.group!==lastGroup){
      html += `<div class="side-group"><div class="side-group-title">${p.group}</div>`;
      lastGroup = p.group;
    }
    const pr = PROGRESS[p.slug];
    const pg = pr.total? `<span class="pg">${pr.done}/${pr.total}</span>` : "";
    html += `<div class="side-link" data-slug="${p.slug}"><span>${p.icon||"📄"}</span><span>${p.title}</span>${pg}</div>`;
  }
    html += `<div class="side-group"><div class="side-group-title">🛠 帮助</div>

    el.addEventListener("click", ()=>{ location.hash = "#/"+el.dataset.slug; });

}

  content.innerHTML = `

    <div class="hero-cta">
      <button class="btn-primary" onclick="location.hash='#/${c.start_slug}'">${c.start_label}</button>

  <div class="start-note"><span class="sn-dot">◆</span><div>${c.start_note}</div></div>

function renderPage(slug){
  const p = DATA.pages.find(x=>x.slug===slug);
  const content = document.getElementById("content");
  content.classList.remove("wide");
  document.querySelectorAll(".side-link").forEach(el=>el.classList.remove("active"));
  const sideEl = document.querySelector(`.side-link[data-slug="${slug}"]`);
  if(sideEl){ sideEl.classList.add("active"); sideEl.scrollIntoView({block:"nearest"}); }
  if(!p){ content.innerHTML = "<h1>页面不存在</h1>"; return; }
  currentSlug = slug;
  let html = `<div class="crumb"><a onclick="location.hash='#/home'">首页</a><span class="sep">/</span><span>${p.group}</span></div>`;
  html += `<div class="page-meta">`;
  if(p.invest) html += `<span class="badge">⏱ ${p.invest}</span>`;
  if(p.updated) html += `<span class="badge">🗓 更新于 ${p.updated}</span>`;
  const pr = PROGRESS[slug];
  if(pr && pr.total) html += `<span class="badge">✅ 进度 ${pr.done}/${pr.total}</span>`;
  html += `</div><h1>${p.icon||""} ${p.title}</h1>${p.html}`;
  // 底部上一页 / 下一页
  const idx = DATA.pages.indexOf(p);
  const prev = DATA.pages[idx-1], next = DATA.pages[idx+1];
  html += `<div id="pager">`;
  html += prev? `<button class="pager-btn" onclick="location.hash='#/${prev.slug}'"><span class="dir">← 上一篇</span>${prev.title}</button>` : "<span></span>";
  html += next? `<button class="pager-btn" style="text-align:right" onclick="location.hash='#/${next.slug}'"><span class="dir">下一篇 →</span>${next.title}</button>` : "<span></span>";
  html += `</div>`;
  content.innerHTML = html;
  content.querySelectorAll("input[data-cb]").forEach(cb=>{
    cb.addEventListener("change", onCbChange);
  });
  content.querySelectorAll(".ext").forEach(a=>{a.target="_blank";a.rel="noopener";});
  window.scrollTo(0,0);
  refreshProgressUI();
}
function route(){
  const h = location.hash || "";
  // 页内锚点（标题跳转）
  if(h.startsWith("#h-")){
    const el = document.getElementById(h.slice(1));
    if(el){ el.scrollIntoView(); return; }
  }
  let slug = h.startsWith("#/") ? h.slice(2) : "home";
  // 无 hash / 未知页面 / 显式首页 → 落地页
  if(slug==="home" || !DATA.pages.find(p=>p.slug===slug)){
    if(currentSlug!=="home") renderHome();
    return;
  }
  if(slug!==currentSlug) renderPage(slug);
  else { const el = document.getElementById(h.slice(2)); if(el) el.scrollIntoView(); }
}

/* ---------------- 搜索 ---------------- */
function openSearch(){
  document.getElementById("search-overlay").classList.add("show");
  const inp = document.getElementById("search-input-lg");
  inp.value=""; inp.focus(); doSearch("");
}
function closeSearch(){ document.getElementById("search-overlay").classList.remove("show"); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function doSearch(q){
  const box = document.getElementById("search-results");
  q = q.trim();
  if(!q){ box.innerHTML = `<div class="sr-empty">输入关键词，搜索全部 ${DATA.pages.length} 个页面</div>`; return; }
  const re = new RegExp(escRe(q), "gi");
  const results = [];
  for(const p of DATA.pages){
    const titleHit = re.test(p.title); re.lastIndex=0;
    let snip = "";
    const m = re.exec(p.search);
    if(m){
      const s = Math.max(0, m.index-45);
      snip = (s>0?"…":"") + p.search.slice(s, m.index+70).trim() + "…";
    }
    if(titleHit || m){
      let snipHtml = snip? snip.replace(re, t=>`<mark>${t}</mark>`) : "";
      results.push({p, titleHit, snipHtml});
    }
  }
  results.sort((a,b)=>(b.titleHit?1:0)-(a.titleHit?1:0));
  if(!results.length){ box.innerHTML = `<div class="sr-empty">没有找到「${q}」</div>`; return; }
  box.innerHTML = results.slice(0,30).map(r=>
    `<div class="sr-item" data-slug="${r.p.slug}">
       <div class="sr-title"><span>${r.p.icon||"📄"}</span><span>${r.p.title.replace(re,t=>`<mark>${t}</mark>`)}</span></div>
       ${r.snipHtml?`<div class="sr-snip">${r.snipHtml}</div>`:""}
     </div>`).join("");
  box.querySelectorAll(".sr-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      closeSearch();
      location.hash = "#/"+el.dataset.slug;
      setTimeout(()=>highlightInPage(q), 80);
    });
  });
}
function highlightInPage(q){
  document.querySelectorAll("mark.search-hl").forEach(m=>{
    const parent = m.parentNode; parent.replaceChild(document.createTextNode(m.textContent), m); parent.normalize();
  });
  if(!q.trim()) return;
  const root = document.getElementById("content");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  const lower = q.toLowerCase();
  for(const node of nodes){
    const idx = node.textContent.toLowerCase().indexOf(lower);
    if(idx>=0){
      const range = document.createRange();
      range.setStart(node, idx); range.setEnd(node, idx+q.length);
      const mark = document.createElement("mark"); mark.className="search-hl";
      try{ range.surroundContents(mark); mark.scrollIntoView({block:"center"}); }catch(e){}
      break;
    }
  }
}

/* ---------------- 主题 ---------------- */
function applyTheme(){
  const t = localStorage.getItem(LS_THEME)||"dark";
  document.body.classList.toggle("light", t==="light");
  document.getElementById("btn-theme").textContent = t==="light"?"🌙":"☀️";
}

/* ---------------- 启动 ---------------- */
initProgress();
buildSidebar();
applyTheme();
saveProgress();
window.addEventListener("hashchange", route);
document.getElementById("btn-menu").addEventListener("click", ()=>document.getElementById("sidebar").classList.toggle("hidden"));
document.getElementById("btn-theme").addEventListener("click", ()=>{
  const t = localStorage.getItem(LS_THEME)==="light"?"dark":"light";
  localStorage.setItem(LS_THEME,t); applyTheme();
});
document.getElementById("search-overlay").addEventListener("click", e=>{ if(e.target.id==="search-overlay") closeSearch(); });
document.getElementById("search-input-lg").addEventListener("input", e=>doSearch(e.target.value));
document.addEventListener("keydown", e=>{
  if(e.key==="/" && !e.target.matches("input,textarea")){ e.preventDefault(); openSearch(); }
  if(e.key==="Escape") closeSearch();
});
route();
</script>

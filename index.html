条路线</td></tr><tr><td>VLA</td><td>视觉—语言—动作模型，机器人端到端控制；长程任务仍需规划层配合</td></tr><tr><td>世界模型</td><td>预测动作后果的内部模型，Computer Use 与机器人共用</td></tr><tr><td>sim2real</td><td>从仿真迁移到真实机器人，核心是保真度权衡与领域随机化</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">评估</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>术语</th><th>解释</th></tr></thead><tbody><tr><td>Pass@k</td><td>k 次里<strong>至少成功一次</strong>（1−(1−p)^k），看能力上限，适合探索类任务</td></tr><tr><td>Pass^k</td><td>连续 k 次<strong>每次都成功</strong>（p^k），看业务可靠性；<strong>写验收标准用这个</strong></td></tr><tr><td>Best@k</td><td>输出为连续得分时，取 k 次里最好的一次</td></tr><tr><td>轨迹前缀边界评估</td><td>从某一步截断，检查作用域判断、指令覆盖、澄清、危险动作前确认</td></tr><tr><td>失败归因</td><td>从整条轨迹定位<strong>首个</strong>错误，而不是只判最终对错</td></tr><tr><td>模型替换实验</td><td>固定 Harness 换模型 → 区分<strong>瓶颈在模型还是在 Harness</strong></td></tr><tr><td>消融实验</td><td>固定模型、逐一关组件 → 定位 <strong>Harness 内部哪个部件重要</strong></td></tr><tr><td>理解债 / 认知投降</td><td>人把理解与责任一并外包给 Agent 的两种失败</td></tr><tr><td>A2A</td><td>Agent-to-Agent，跨组织 Agent 互操作协议</td></tr><tr><td>可观测性</td><td>Observability，运行过程的可记录、可回看能力</td></tr></tbody></table></div></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>总纲：<a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a></li><li>资料：已内联到各层 —— <a class=\"wl\" href=\"#/p-ab1ca3904e\">L1 · 语言层 · 能听懂</a> · <a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a> · <a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a> · <a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a></li></ul></div></details>", "search": " 📝 怎么用 ▸ 遇到不懂的词来这里查。按三组分类： 模型与基础 / 架构与工程 / 评测与产品 。 目录 模型与基础 架构与工程 评测与产品 工程与评估（本书补充） 模型与基础 ❝ 词汇表 ▸ 术语 解释 LLM 大语言模型，如 GPT、Claude、Gemini 推理模型 先\"想一会\"再回答的模型，慢但更准，适合复杂推理与规划 多模态 能处理文字 + 图片 + 音频 + 视频的模型 Embedding 嵌入向量，把文字转成数字表示，用于搜索与相似度计算 Token 模型处理的最小单位，约 1 个中文字 = 1-2 token Context Window 上下文窗口，模型一次能看到的最大范围 Temperature 温度参数，控制随机程度，0=确定，1=发散 Inference 推理，模型生成回答的过程（成本与延迟都发生在这里） Hallucination 幻觉，模型编造不存在的内容 架构与工程 ❝ 词汇表 ▸ 术语 解释 增强 LLM 模型 + 检索 + 工具 + 记忆，很多需求到这里就够了 Agent 智能体，自己决定下一步做什么 Workflow 工作流，路径由代码写死，模型只执行 Agent Loop 思考 → 行动 → 观察 → 再思考的循环 ReAct Reasoning + Acting，边推理边行动 Prompt chaining 固定子任务串联，中间可加检查点 Routing 先分类，再交给专用流程 Parallelization 独立子任务并行，或同一任务跑多次投票 Orchestrator-workers 主模型动态拆任务、委派、汇总 Evaluator-optimizer 一个生成、一个评估，循环到达标 Handoff 一个 Agent 把任务交给另一个 Tool / Function Calling 模型决定调某个函数，应用执行后把结果还给模型 ACI Agent-Computer Interface，工具对模型而言就是界面；描述文案直接决定调用准确率 MCP Model Context Protocol，Agent 与工具/数据的插头标准 AAIF Agentic AI Foundation，Linux Foundation 旗下，2025-12 起托管 MCP RAG 先检索相关内容再回答，减少编造 Memory 记忆，分短期（当前对话）与长期（跨对话持久化） Context Engineering 上下文工程，设计\"模型在每步看到什么、什么时候看到\" Compaction 压缩，把过长历史压成摘要后重开上下文 Structured notes 结构化笔记，把关键事实与状态写到上下文之外 Checkpoint 检查点，长任务中断后可从此处恢复 Drift detection 漂移检测，发现 Agent 当前假设与早前记录矛盾 Sub-agent 子 Agent，在独立上下文里跑子任务，只回传摘要 评测与产品 ❝ 词汇表 ▸ 术语 解释 Eval 评测，产品定义\"好\"的标准 Trace 追踪日志，记录 Agent 每步决策与工具调用 单步评测 这一步工具调对了吗、参数对不对 轨迹评测 走的这条路径合理吗（工具、参数、依据、步数、终止五项） 结果评测 用户的真实意图被满足了吗 会话级评测 整段会话一起评，用于发现\"单轮及格、整段失忆\" Session 会话，多轮产品的评测单位 Task Success 任务成功率，完成用户真实意图的比例 Groundedness 有据性，回答是否有依据而非编造 Grounding 事实基础，回答基于真实数据 Citation 引用，标注信息来源（科研场景要精确到段落/页码） LLM-as-a-Judge 用另一个模型来评分 回归集 每次改动都要重跑的用例集，用于防止旧场景变坏 在线指标 上线后持续监控：放弃率、追问率、人工接管率、单次成本 P95 95% 的请求在此时间内完成；谈延迟用 P95，不用平均值 Human-in-the-loop 人在回路中，关键决策需要人确认 Takeover 接管，用户中途接手操作再交还给 Agent Progressive Disclosure 渐进式展示，不一次性展示全部信息 Transparency 透明度，让用户看到 Agent 在做什么（展示步骤，不是展示原始推理） 工程与评估（本书补充） 📝 为什么单独一组 ▸ 这一组来自《深入理解 AI Agent》，是课程原本没有、但评审时会听到的词。 详见 书 · 深入理解 AI Agent · 导读 。 不需要背，听到不懂的回来查。 ❝ 工程与判断 ▸ 术语 解释 Harness 模型之外的一切：围绕上下文与工具构建的约束、验证与纠正机制；当下真正的竞争力所在 Loop engineering 循环工程，设计 Agent 的循环与停止条件；由 prompt engineering 演进而来 提议者—审核者 Proposer-Reviewer，产出与评判由 不共享上下文 的两个角色分别承担（前提：自审不可靠） Sidecar 只读审查进程，提议者—审核者的只读变体 渐进式披露 Progressive Disclosure，先给目录、细节按需加载；Agent Skills 是其典型形态 只增不改 Append-only，状态只追加不回改，换来可缓存、可重放、可审计 边界集 + 保留集 改动要同时在\"应该变\"和\"不该变\"两批样本上验证，只测一边会得出错误结论 最小 diff + 可回滚 每次修改尽量小、带来源、可单独回滚，让归因成为可能 KV Cache 键值缓存；前缀越稳定命中越高， 改动越靠前、作废的缓存越多 Prompt Cache 提示缓存，与 KV Cache 属两个层级的缓存 Agent Skills 领域能力的可组合单元：元数据常驻上下文，正文按需加载 Skill Hub 用包管理器分发 SKILL.md 的渠道；与 MCP 并列为能力分发的两条渠道 Agent 状态栏 把执行环境、时间等元信息放进上下文，解决\"不知道自己现在几点、在哪儿\" 防呆（Poka-yoke） 从设计上让错误无法发生（如 SIM 卡缺角），优于\"反复提醒模型别犯错\" 提示注入 Prompt Injection，外部数据里埋指令来操纵模型；区别于越狱（那是用户自己绕限制） 代码作为元能力 Agent 靠写代码在运行时创造新工具； 通用 Agent = Coding Agent + 文件系统 Computer Use GUI 自动化 Agent；关键是动作空间设计、视觉定位、 动作后的状态确认 Grounding 视觉定位，把界面元素与屏幕坐标对应起来 全双工 边说边听、可被打断的语音交互形态；另有级联流水线与端到端 Omni 两条路线 VLA 视觉—语言—动作模型，机器人端到端控制；长程任务仍需规划层配合 世界模型 预测动作后果的内部模型，Computer Use 与机器人共用 sim2real 从仿真迁移到真实机器人，核心是保真度权衡与领域随机化 ❝ 评估 ▸ 术语 解释 Pass@k k 次里 至少成功一次 （1−(1−p)^k），看能力上限，适合探索类任务 Pass^k 连续 k 次 每次都成功 （p^k），看业务可靠性； 写验收标准用这个 Best@k 输出为连续得分时，取 k 次里最好的一次 轨迹前缀边界评估 从某一步截断，检查作用域判断、指令覆盖、澄清、危险动作前确认 失败归因 从整条轨迹定位 首个 错误，而不是只判最终对错 模型替换实验 固定 Harness 换模型 → 区分 瓶颈在模型还是在 Harness 消融实验 固定模型、逐一关组件 → 定位 Harness 内部哪个部件重要 理解债 / 认知投降 人把理解与责任一并外包给 Agent 的两种失败 A2A Agent-to-Agent，跨组织 Agent 互操作协议 可观测性 Observability，运行过程的可记录、可回看能力 📝 导航 ▸ 总纲： 00 · 学习总纲 资料：已内联到各层 —— L1 · 语言层 · 能听懂 · L2 · 结构层 · 能选型 · L3 · 判断层 · 能评估 · L4 · 落地层 · 能交付 "}, {"slug": "p-6643528717", "title": "书 · 深入理解 AI Agent · 导读", "group": "参考与工具", "icon": "📚", "updated": "2026-10-03", "invest": "", "html": "<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这份文件是什么</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>《深入理解 AI Agent》是<strong>工程实现视角</strong>的教材；本套课程是<strong>产品判断视角</strong>的框架。 这份导读做四件事：<strong>① 给全书地图；② 标出每章挂到课程的哪一层；③ 逐章说明每一节读不读；④ 标出每章的技术门槛。</strong> 它不替代原书，也不重复原书——目标是<strong>用最少的时间，把这本书变成课程的可调用资料</strong>。</p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">先看这条：这本书不值得通读</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>42 万字符、90+ 个实验，主体是工程实现细节。对产品经理，逐章精读是巨大的时间浪费。 <strong>推荐投入：第 1 章 + 第 7 章精读（约 6-7h），其余按需查阅</strong>——总计约 10-14h 能吃透真正有用的部分。 全书有 <strong>4 章技术门槛为 🔴</strong>（第 2、3、5、8 章），读它们时默认\"只取结论，不抠实现\"。</p></div></details>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">技术门槛图例（本次新增，配合逐章说明使用）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>标在每章、每小节前面，回答一个问题：<strong>这一节要花多少技术耐心？</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>标记</th><th>含义</th><th>怎么读</th></tr></thead><tbody><tr><td>🟢 <strong>概念型</strong></td><td>不需要技术背景，结论就是产品语言</td><td>正常读，读完可直接用于评审</td></tr><tr><td>🟡 <strong>半技术</strong></td><td>有工程概念，但落点是设计取舍</td><td>读，但跳过代码块、公式与参数名，只看\"所以呢\"</td></tr><tr><td>🔴 <strong>偏技术</strong></td><td>讲机制、代码、参数或数学</td><td><strong>只取结论与判断标准</strong>；看不懂的段落直接跳过，不要停下来啃</td></tr></tbody></table></div>\n<p>一句话：<strong>🟢 可以精读，🟡 读结论，🔴 拿结论走人。</strong> 标 🔴 不代表不值得读，代表\"投入产出比低，别陷进去\"。</p></div></details>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">一句话定位</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>课程</strong>回答：这个方案好不好？该不该做？怎么验收？</li><li><strong>本书</strong>回答：这个方案具体怎么实现？卡在哪？有哪些坑？</li></ul>\n<p>前者决定<strong>方向</strong>，后者决定你<strong>该向研发提什么要求</strong>。两者不重复，但深度差一个量级。</p></div></details>\n<h2 id=\"h-767fa455bb\">目录</h2>\n<ul><li><a class=\"wl\" href=\"#h-35b868eacf\">产品人读法</a></li><li><a class=\"wl\" href=\"#h-e22985e749\">逐章地图</a></li><li><a class=\"wl\" href=\"#h-6fe466783f\">逐章说明</a></li><li><a class=\"wl\" href=\"#h-09bb1ed76f\">本书比课程深在哪（三条必补）</a></li><li><a class=\"wl\" href=\"#h-10570d7df8\">课程比本书强在哪（别丢）</a></li><li><a class=\"wl\" href=\"#h-84fcef97a3\">一个口径冲突：RAG</a></li><li><a class=\"wl\" href=\"#h-b96baa9c10\">时效风险</a></li><li><a class=\"wl\" href=\"#h-912bc5dff3\">本次拆散清单</a></li></ul>\n<hr>\n<h2 id=\"h-35b868eacf\">产品人读法</h2>\n<details class=\"callout co-tip\"><summary><span class=\"co-icon\">💡</span><span class=\"co-title\">按这个顺序读，别按章号读</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>优先级</th><th>读什么</th><th>门槛</th><th>页码</th><th>为什么</th></tr></thead><tbody><tr><td><strong>必读</strong></td><td>第 1 章（全章）</td><td>🟢</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=15\" target=\"_blank\" title=\"打开本地文件\">p.15-37 <span class=\"pdf-badge\">📄</span></a></td><td>全书概念地图：核心公式、Harness 工程、5 个设计模式、3 层护栏</td></tr><tr><td><strong>必读</strong></td><td>7.2 评估指标</td><td>🟢</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=196\" target=\"_blank\" title=\"打开本地文件\">p.196-197 <span class=\"pdf-badge\">📄</span></a></td><td>Pass@k 与 Pass^k 的区别——直接修正课程 <a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> 的口径。<strong>公式可不背，记住两者区别即可</strong></td></tr><tr><td><strong>必读</strong></td><td>7.5 自动化评估方法</td><td>🟡</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=201\" target=\"_blank\" title=\"打开本地文件\">p.201-211 <span class=\"pdf-badge\">📄</span></a></td><td>失败归因（定位首个错误）、轨迹前缀回归、配对比较。7.5.2 里的代码级案例可跳</td></tr><tr><td><strong>必读</strong></td><td>7.6 评估驱动的模型选型</td><td>🟢</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=211\" target=\"_blank\" title=\"打开本地文件\">p.211-215 <span class=\"pdf-badge\">📄</span></a></td><td>模型替换实验 vs 消融实验、成本分析——课程最缺的判断工具</td></tr><tr><td>建议</td><td>2.4 提示工程（2.4.1–2.4.4）</td><td>🟡</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=60\" target=\"_blank\" title=\"打开本地文件\">p.60-63 <span class=\"pdf-badge\">📄</span></a></td><td>★ 评审系统提示词 / 工具描述质量的基础；价值高于 2.5/2.6，别跳过</td></tr><tr><td>建议</td><td>2.3 KV Cache</td><td>🔴🔴</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=50\" target=\"_blank\" title=\"打开本地文件\">p.50-59 <span class=\"pdf-badge\">📄</span></a></td><td><strong>全章最技术</strong>。只拿一句：前缀越稳定、缓存命中越高，改动越靠前作废越多。2.3.1/2.3.2 原理可跳</td></tr><tr><td>建议</td><td>2.5 Agent Skills</td><td>🟡</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=64\" target=\"_blank\" title=\"打开本地文件\">p.64-69 <span class=\"pdf-badge\">📄</span></a></td><td>元数据常驻、正文按需——课程的\"渐进式披露\"在这里有实现形态</td></tr><tr><td>建议</td><td>2.7 上下文压缩</td><td>🔴</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=74\" target=\"_blank\" title=\"打开本地文件\">p.74-79 <span class=\"pdf-badge\">📄</span></a></td><td>只拿结论：<strong>隔离优于压缩</strong>。2.7.2 上下文学习机制属研究向，可跳</td></tr><tr><td>建议</td><td>4.2–4.4 工具设计</td><td>🟡</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=112\" target=\"_blank\" title=\"打开本地文件\">p.112-122 <span class=\"pdf-badge\">📄</span></a></td><td>能力形态决策、工具描述、工具太多的四种应对。4.2.1 的形态权衡是决策类，值得读</td></tr><tr><td>建议</td><td>10.2 多 Agent 何时真值</td><td>🟢</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=281\" target=\"_blank\" title=\"打开本地文件\">p.281-283 <span class=\"pdf-badge\">📄</span></a></td><td>一句判断标准：<strong>是否带来信息增量、是否值这份 token 成本</strong></td></tr><tr><td>建议</td><td>10.5 六种失败模式</td><td>🟢</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=301\" target=\"_blank\" title=\"打开本地文件\">p.301-303 <span class=\"pdf-badge\">📄</span></a></td><td>评审时的\"防坑清单\"，写得像事故复盘，无技术负担</td></tr><tr><td>建议</td><td>5.1.5 故障与错误恢复</td><td>🟡</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=136\" target=\"_blank\" title=\"打开本地文件\">p.136-138 <span class=\"pdf-badge\">📄</span></a></td><td>可靠性问题的工程解；同章其余小节（5.1.6–5.1.8）是实现技巧，🔴 可跳</td></tr><tr><td>建议</td><td>3.1 用户记忆系统（★升格）</td><td>🟡</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=81\" target=\"_blank\" title=\"打开本地文件\">p.81-89 <span class=\"pdf-badge\">📄</span></a></td><td>科研助手直接相关：三层次评估框架 + 3.1.8 隐私脱敏</td></tr><tr><td>建议</td><td>后记 · 两朵乌云</td><td>🟢</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=311\" target=\"_blank\" title=\"打开本地文件\">p.311-313 <span class=\"pdf-badge\">📄</span></a></td><td>判断方向用的锚：实时性 + 持续学习两个前沿</td></tr><tr><td>知道即可</td><td>第 3、6 章</td><td>🔴 / 🟡</td><td>—</td><td>记忆与知识库（🔴）、交互扩展（🟡，但 6.5 机器人为 🔴）——按需查</td></tr><tr><td>可以跳过</td><td>第 8 章 RL 细节</td><td>🔴🔴</td><td>—</td><td>除非你要和算法团队对话；只读 8.1 四阶段全景 + 8.14 三个案例即可</td></tr><tr><td>建议</td><td>第 9 章持续进化（★升格）</td><td>🟢</td><td><a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=264\" target=\"_blank\" title=\"打开本地文件\">p.264-279 <span class=\"pdf-badge\">📄</span></a></td><td>9.2 四种进化载体决定\"越用越好\"承诺怎么兑现；9.1–9.3 全读</td></tr></tbody></table></div></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">关于\"建议读\"里那几条偏技术的</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>上面标注里，<strong>2.3（KV Cache）和 2.7（上下文压缩）是 🔴</strong>，原始清单把它们列为\"建议\"是按<strong>内容重要性</strong>排的，不是按<strong>好读程度</strong>排的。 这两节的正确打开方式：<strong>先读该节的小标题和每节末尾的结论段，拿到可写进 PRD 的那一句约束，然后合上。</strong> 中间的原理推导、缓存结构图、实现对比表，属于研发的活，读了也用不上。</p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">如何跟课程配合</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>每章的具体挂载点见下面「逐章地图」和「逐章说明」，也<strong>已经写进 L1-L4 各层的资料清单</strong>—— 你按课程顺序学的时候，遇到对应小节就会看到这本书的章节入口，不用回来查这张表。</p></div></details>\n<hr>\n<h2 id=\"h-e22985e749\">逐章地图</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">十章的骨架与挂载点</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>章</th><th>主题一句话</th><th>门槛</th><th>挂载层</th><th>产品人怎么用</th></tr></thead><tbody><tr><td>引言</td><td>成书背景：实践在前，命名在后</td><td>🟢</td><td>—</td><td>5min 扫过，理解作者是\"做 Agent 产品的人\"不是\"讲概念的人\"</td></tr><tr><td><a class=\"wl\" href=\"#h-a196d77dc3\">1</a></td><td>Agent = LLM + 上下文 + 工具；Harness 工程</td><td>🟢</td><td><strong>L1 全层</strong> + L2「一·复杂度三档」</td><td>必读，当全书地图</td></tr><tr><td><a class=\"wl\" href=\"#h-fc3146b689\">2</a></td><td>API 消息结构 / KV Cache / Skills / 状态栏 / 压缩</td><td>🔴</td><td>L2「四·上下文工程」</td><td>选读 2.3、2.5、2.7；其中 2.5 为 🟡，2.3 / 2.7 按\"拿结论\"读</td></tr><tr><td><a class=\"wl\" href=\"#h-da8fc4e9b8\">3</a></td><td>用户记忆 + 共享知识库 + RAG 全流水线</td><td>🔴</td><td>L2「六·RAG 与 Memory」</td><td>读 3.1（含 3.1.8 隐私，★）+ 3.3（3.3.4 必读）；嵌入原理整块跳过</td></tr><tr><td><a class=\"wl\" href=\"#h-037a0fa951\">4</a></td><td>五类工具 / 能力形态 / MCP + Skill Hub / 工具太多</td><td>🟡</td><td>L2「三·ACI」+「五·MCP」</td><td>读 4.2–4.4，是全书最\"产品向\"的一章</td></tr><tr><td><a class=\"wl\" href=\"#h-98dff99626\">5</a></td><td>通用 Agent = Coding Agent + 文件系统；代码是元能力</td><td>🔴</td><td><strong>课程已挂 L2「代码作为元能力」横切补充</strong>（5.1 工程主体仍无对应）</td><td>读 5.1.5 + 5.2 全节（5.2 为 🟢）；5.1.6–5.1.8 是实现技巧，可跳</td></tr><tr><td>6</td><td>异步事件 / 语音 / Computer Use / 机器人 VLA</td><td>🟡</td><td>L4「三·UX 五模式」的技术底座</td><td>读 6.2 + 6.4.4 + 6.5；6.5 机器人为 🔴，与具身智能直接相关</td></tr><tr><td><a class=\"wl\" href=\"#h-dbc94c3efe\">7</a></td><td>Pass@k vs Pass^k / 失败归因 / 消融与 AB / 统计显著性</td><td>🟡</td><td><strong>L3 全层</strong></td><td>必读，课程评测体系的工程版；7.2 / 7.6 / 7.9 为 🟢，7.7 统计部分可略读</td></tr><tr><td><a class=\"wl\" href=\"#h-b5dea4b654\">8</a></td><td>预训练→Mid-training→SFT→RL</td><td>🔴🔴</td><td><strong>课程无（不必学）</strong></td><td>只读 8.1 四阶段全景 + 8.14 三个案例；其余整章跳过</td></tr><tr><td><a class=\"wl\" href=\"#h-0fc47ddf56\">9</a></td><td>四种进化载体：知识 / 指令 / 程序 / 参数</td><td>🟢</td><td><strong>课程无（不必学）</strong></td><td>读 9.1–9.3；9.2 是\"越用越好\"承诺的兑现方式</td></tr><tr><td><a class=\"wl\" href=\"#h-b749f6c716\">10</a></td><td>分类框架 / 何时真值 / 六种失败模式 / Agent 社会</td><td>🟢</td><td>L2「二·七个积木」延伸</td><td>读 10.2 + 10.5，两条都是 🟢，性价比最高；10.4 拓扑为 🟡</td></tr><tr><td>后记</td><td>两朵乌云 + 模型与 Agent 共同演进</td><td>🟢</td><td>总纲「2026 关键变化备忘」</td><td>必读，判断方向的锚</td></tr></tbody></table></div>\n<p>门槛列只标<strong>整章主门槛</strong>（emoji）；\"某节为例外\"的说明统一放在最后一列，避免窄列被文字撑爆而截断。</p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">全书技术门槛分布（一眼看懂哪些能顺手读）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>🟢 <strong>可以直接读</strong>：引言 · 第 1 章 · 第 10 章（除 10.4）· 后记、7.2 / 7.6 / 7.9、5.2</li><li>🟡 <strong>读结论即可</strong>：第 4 章 · 第 6 章 · 第 9 章 · 第 7 章大部、2.4 / 2.5</li><li>🔴 <strong>拿结论走人</strong>：第 2 章（除 2.4–2.5）· 第 3 章（除 3.1）· 第 5 章（除 5.2）· 第 8 章全章</li></ul>\n<p>你真正要吃的只有 🟢 + 少量 🟡，约 10-14h 覆盖全书 90% 的产品价值。</p></div></details>\n<hr>\n<h2 id=\"h-6fe466783f\">逐章说明</h2>\n<details class=\"callout co-info\"><summary><span class=\"co-icon\">ℹ️</span><span class=\"co-title\">怎么用这一节</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>每章先给<strong>技术门槛</strong>，再给<strong>完整小节清单</strong>（✅ = 建议读，⏭️ = 可跳过，— = 看情况），最后是原有那份\"核心内容 + 产品含义\"。 小节编号与中文版原书一致，可直接对着 PDF 目录找。</p></div></details>\n<h3 id=\"h-e456884728\">引言</h3>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">技术门槛：🟢 概念型 —— 5 分钟，不设门槛</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>全书结构 / 如何阅读本书 / 前置知识 / 致谢。 只扫「全书结构」一张图，理解作者的写法：<strong>先给结论，再给工程实现</strong>。 页码：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=11\" target=\"_blank\" title=\"打开本地文件\">p.11-14 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<h3 id=\"h-a196d77dc3\">第 1 章 · AI Agent 入门</h3>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">技术门槛：🟢 概念型（1.1.1 稍抽象，只记结论）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>全章没有代码，是全书唯一适合\"从头读到尾\"的一章。</p>\n<ul><li>✅ <strong>1.1</strong> 现代 Agent = LLM + 上下文 + 工具（1.1.1 观察空间/动作空间可只看结论；1.1.2–1.1.5 全读）</li><li>✅ <strong>1.2</strong> Harness 工程（1.2.1 Loop 工程 / 1.2.2 核心原则 / 1.2.3 模型选择 / 1.2.4 编排模式 / 1.2.5 护栏 / 1.2.6 五要素）</li><li>⏭️ <strong>1.2.4.4</strong> 主流 Agent 框架简要对比 —— 半年内会过时，且和你的选型无关</li><li>✅ <strong>1.3</strong> 贯穿全书的设计模式（全书骨架，后面每章都会复用）</li><li>⏭️ 1.4 本章小结 / 1.5 思考题</li></ul></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>公式的三层理解</strong>：实现层（LLM + 上下文 + 工具）、直觉层（大脑 + 眼睛 + 手脚）、学术层（观察空间 + 动作空间）</li><li><strong>Harness 工程</strong>：模型能力正在商品化，差异全在模型之外——围绕上下文和工具构建的约束、验证、纠正机制</li><li><strong>5 个设计模式</strong>（全书反复复用的骨架）：提议者—审核者 / 渐进式披露 / 只增不改 / 边界集 + 保留集 / 最小 diff + 可回滚</li><li><strong>3 层护栏</strong>（按被绕过的难度排，不按处理顺序）：上下文层 → 执行层 → 数据层</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=15\" target=\"_blank\" title=\"打开本地文件\">p.15-37 <span class=\"pdf-badge\">📄</span></a> · 5 个设计模式在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=36\" target=\"_blank\" title=\"打开本地文件\">p.36 <span class=\"pdf-badge\">📄</span></a> · 3 层护栏在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=33\" target=\"_blank\" title=\"打开本地文件\">p.33 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">这章对你最大的价值</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>「提议者—审核者」和「渐进式披露」这两个模式，能直接解释你评审时看到的一堆设计选择—— 为什么审核要独立进程、为什么 Skills 是元数据常驻正文按需加载。<strong>它们不是技术细节，是产品原则。</strong></p></div></details>\n<h3 id=\"h-fc3146b689\">第 2 章 · 上下文工程</h3>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">技术门槛：🔴 偏技术 —— 只有 2.4 / 2.5 能顺读，其余按\"拿结论\"处理</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这是全书技术密度最高的一章之一（讲 API 消息结构、缓存机制、压缩算法）。</p>\n<ul><li>✅ <strong>2.1</strong> 上下文：决定 Agent 能力上限的关键 —— 🟢 唯一无门槛的引子，读</li><li>⏭️ <strong>2.2</strong> Agent 如何调用大模型：API 上下文结构 —— 🔴 消息四种角色、核心循环代码实现，研发的活</li><li>🔴 <strong>2.3</strong> KV Cache 友好的上下文设计 —— <strong>只拿一句结论</strong>：\"前缀越稳定，缓存命中越高；改动越靠前，作废的缓存越多\"（→ 可写进 PRD 的约束见下）。2.3.1 Chat Template、2.3.2 缓存原理、2.3.5 可编辑笔记，<strong>全部跳过</strong></li><li>✅ <strong>2.4</strong> 提示工程：优化系统提示词 —— 🟡 <strong>★ 价值高于 2.5/2.6</strong>：2.4.1–2.4.4（人格/格式/组织方式/内容）是产品向，读（评审提示词质量的基础）；<strong>2.4.7 提示注入 = 🟢 必读</strong>（上下文安全的核心威胁）</li><li>✅ <strong>2.5</strong> 动态提示词与 Agent Skills —— 🟡 元数据常驻、正文按需；2.5.4 Skills 与工具的关系最值得读</li><li>🟡 <strong>2.6</strong> Agent 状态栏 —— 结论是\"让 Agent 知道现在几点、在哪个目录\"；2.6.4 缓存代价 🔴 可跳</li><li>🔴 <strong>2.7</strong> 上下文压缩策略 —— <strong>只拿 2.7.1 的动机 + 2.7.6 的结论</strong>：<strong>隔离优于压缩</strong>。2.7.2 上下文学习机制（研究向）、2.7.4 分层压缩实现，跳过</li><li>⏭️ 2.8 本章小结 / 2.9 思考题</li></ul></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>2.3 KV Cache 友好的上下文设计</strong>：缓存命中率是架构约束，不是调优技巧——改动越靠前，作废的缓存越多</li><li><strong>2.4 提示工程 + 2.4.7 提示注入</strong>：注入是上下文安全的核心威胁（越狱是用户自己绕，注入是外部数据偷偷操纵）</li><li><strong>2.5 动态提示词与 Agent Skills</strong>：元数据常驻、正文按需加载；Skills 与工具的分工</li><li><strong>2.6 Agent 状态栏</strong>：让 Agent 感知执行环境与时间状态，解决\"不知道现在是几点/在哪个目录\"</li><li><strong>2.7 上下文压缩策略</strong>：分层压缩 + 「隔离优于压缩」（子 Agent 上下文隔离）</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=38\" target=\"_blank\" title=\"打开本地文件\">p.38-80 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">产品含义</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这一章把课程 L2「四·上下文工程」里那些只有名字的东西补全了。 评审时可以多问一句：<strong>\"我们的上下文前缀稳定吗？有没有为了改一句话把缓存全作废？\"</strong></p></div></details>\n<h3 id=\"h-da8fc4e9b8\">第 3 章 · 用户记忆和知识库</h3>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">技术门槛：🔴 偏技术 —— 3.1 前半是产品向，RAG 部分整块是工程图纸</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>篇幅最容易被误读的一章：<strong>它讲的是\"如果要做，怎么做\"，不是\"应该做\"。</strong></p>\n<ul><li>✅ <strong>3.1 用户记忆系统</strong>（★升格：科研助手直接相关） —— 3.1.1 记忆三层次评估框架（🟢 读）、3.1.2 层次结构（🟢）、3.1.3 四种存储格式（🟡）、3.1.8 隐私脱敏（🟡）；<strong>3.1.5 认知科学基础 🔴 可跳</strong>、3.1.6 框架案例半年即过时</li><li>🔴 <strong>3.2 RAG 基础</strong> —— 分块 / 稠密嵌入 / 稀疏嵌入 / 混合检索，<strong>整节是施工图</strong>。真要读只读 3.2.1 分块和 3.2.4 混合检索的结论句；3.2.2.1 Word2Vec、3.2.3.1 TF-IDF→BM25 直接跳过</li><li>✅ <strong>3.3 超越扁平文本：知识的组织与检索</strong> —— 🟡 但<strong>3.3.4 智能体化 RAG（把检索工具化）是本章最值钱的一节，🟢 必读</strong>；3.3.2 文件系统范式（🟢）、3.3.3 知识如何更新（🟡）也读</li><li>⏭️ 3.4 本章小结 / 3.5 思考题</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=81\" target=\"_blank\" title=\"打开本地文件\">p.81-110 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>3.1 用户记忆</strong>：三层次评估框架、记忆的层次结构、四种存储格式、隐私脱敏</li><li><strong>3.2 RAG 基础</strong>：分块 → 稠密嵌入 → 稀疏嵌入 → 混合检索</li><li><strong>3.3 知识的组织</strong>：结构化索引、文件系统范式、知识如何更新、<strong>智能体化 RAG（把检索工具化）</strong>、上下文感知检索</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=81\" target=\"_blank\" title=\"打开本地文件\">p.81-110 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">读这章前先看下面那条「口径冲突：RAG」</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>本章篇幅会被误读成\"应该上 RAG\"。<strong>它是\"如果要做，怎么做\"，不是\"应该做\"。</strong></p></div></details>\n<h3 id=\"h-037a0fa951\">第 4 章 · 工具</h3>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">技术门槛：🟡 半技术 —— 全书最\"产品向\"的一章，建议 4.1–4.4 整章读（4.5–4.7 看 4.5.1 即可）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>讲的是工具怎么设计、工具怎么被模型理解，几乎没有实现细节。</p>\n<ul><li>✅ <strong>4.1</strong> 工具的分类 —— 🟢</li><li>✅ <strong>4.2</strong> 工具设计的通用原则 —— 🟡 4.2.1 能力表达形式（专用工具/通用执行器/Skill 三种形态怎么选，<strong>决策类，最值得读</strong>）、4.2.2 工具描述的艺术（🟢）、4.2.3 参数传递的保真性（🟡，是安全边界）</li><li>✅ <strong>4.3</strong> 工具生态：MCP 与 Skill Hub —— 🟢</li><li>✅ <strong>4.4</strong> 工具太多怎么办 —— 🟢 层次化组织 / 按需加载 / 模型原生主动发现 / Skills 把发现变成\"按需查阅\"</li><li>🟡 <strong>4.5–4.7</strong> 感知 / 执行 / 协作工具 —— 看 4.5.1 多模态的三种处理方式即可，其余按需</li><li>⏭️ 4.8 本章小结 / 4.9 思考题</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=111\" target=\"_blank\" title=\"打开本地文件\">p.111-129 <span class=\"pdf-badge\">📄</span></a> · 工具描述在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=114\" target=\"_blank\" title=\"打开本地文件\">p.114 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>4.2 通用设计原则</strong>：能力用专用工具 / 通用执行器 / Skill 哪种形态表达（默认往通用一端靠）；工具描述的艺术；<strong>参数传递的保真性</strong>（模型看到的参数必须等于真正执行的参数）</li><li><strong>4.3 工具生态两条渠道</strong>：MCP 统一专用工具接入；Skill Hub 用包管理器分发 SKILL.md</li><li><strong>4.4 工具太多的四种应对</strong>：层次化组织 → 按需加载 → 模型原生主动发现 → Skills 把发现变成\"按需查阅\"</li><li><strong>4.5–4.7 三类工具</strong>：感知 / 执行 / 协作（协作工具 = 子 Agent 的生命周期原语）</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=111\" target=\"_blank\" title=\"打开本地文件\">p.111-129 <span class=\"pdf-badge\">📄</span></a> · 工具描述在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=114\" target=\"_blank\" title=\"打开本地文件\">p.114 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">这一章直接可用的两个概念</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>防呆（Poka-yoke）</strong>：从设计上让错误无法发生（SIM 卡缺角、微波炉门没关不加热）——比\"教模型别犯错\"可靠得多</li><li><strong>参数保真</strong>：模型以为它传了什么、系统实际执行了什么，必须是同一个东西——这是安全边界</li></ul></div></details>\n<h3 id=\"h-98dff99626\">第 5 章 · Coding Agent 与通用 Agent</h3>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">技术门槛：🔴 偏技术（5.1.5 为 🟡、5.2 为 🟢）—— 5.1 大半是工程实现</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>章内门槛落差很大：<strong>前半（Coding Agent 怎么造）🔴，后半（代码作为元能力）🟢。</strong></p>\n<ul><li>🟡 <strong>5.1.1–5.1.2</strong> Coding 是基础能力 / Manus→OpenClaw 案例 —— 读，理解\"Coding 内核\"</li><li>🔴 <strong>5.1.3–5.1.4</strong> 整体流程 / Harness 实践 —— 实现细节，只看流程图结论</li><li>✅ <strong>5.1.5</strong> 故障与错误恢复 —— 🟡 可靠性问题的工程解，对应 <a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a>，<strong>本章唯一必读小节</strong></li><li>⏭️ <strong>5.1.6–5.1.8</strong> 实现技巧 / 搜索工具 / 文件编辑工具 —— 🔴 纯工程</li><li>🟡 <strong>5.1.9</strong> Coding Agent 的安全 —— 结论可读</li><li>✅ <strong>5.2</strong> 代码：通用 Agent 的元能力 —— 🟢 <strong>整节必读</strong>，六个方向全是产品视角（思考工具 / 业务规则约束 / 多媒体生成 / 系统适配器 / 生成式 UI / Agent 自举）</li><li>⏭️ 5.3 本章小结 / 5.4 思考题</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=130\" target=\"_blank\" title=\"打开本地文件\">p.130-161 <span class=\"pdf-badge\">📄</span></a> · 错误恢复在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=136\" target=\"_blank\" title=\"打开本地文件\">p.136 <span class=\"pdf-badge\">📄</span></a> · 代码六方向在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=144\" target=\"_blank\" title=\"打开本地文件\">p.144 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>5.1 Coding Agent</strong>：通用 Agent = Coding Agent + 文件系统；Coding Agent 的整体流程、Harness 实践、<strong>故障与错误恢复</strong>、搜索与文件编辑工具的设计、安全</li><li><strong>5.2 代码作为元能力</strong>（六个方向）：思考工具 / 业务规则约束 / 多媒体生成 / 系统适配器 / 生成式 UI / Agent 自举</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=130\" target=\"_blank\" title=\"打开本地文件\">p.130-161 <span class=\"pdf-badge\">📄</span></a> · 错误恢复在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=136\" target=\"_blank\" title=\"打开本地文件\">p.136 <span class=\"pdf-badge\">📄</span></a> · 代码六方向在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=144\" target=\"_blank\" title=\"打开本地文件\">p.144 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">这是课程最薄的一整块（已挂横切，主体仍无对应）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程 L2 已用「代码作为元能力」横切补充接住 5.2，但 5.1 的工程主体仍无对应。本书认为<strong>通用性的来源就是代码 + 文件系统</strong>。 产品含义：当研发说\"这个需求要做个新工具\"，你可以反问一句 <strong>\"能不能让 Agent 自己写代码解决？\"</strong></p></div></details>\n<h3 id=\"h-11b8e10169\">第 6 章 · 交互：观察与动作空间的扩展</h3>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">技术门槛：🟡 半技术（6.2 / 6.4 可读，6.5 为 🔴）—— 6.5 是你的具身智能专区</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>✅ <strong>6.1</strong> 模态与触发时机的扩展 —— 🟢 引子，读</li><li>✅ <strong>6.2</strong> 异步与事件驱动 —— 🟡 6.2.1 为什么需要异步（🟢）、6.2.3 事件触发工具（🟢）、6.2.4 用户沟通工具（🟢）、6.2.5 虚拟身份与隔离执行环境（🟡）、6.2.9 从\"能接收\"到\"可靠处理\"（🟢）；<strong>6.2.2 OpenClaw 实现、6.2.7 兼容方案、6.2.8 GPT-6 Astra 属 🔴 且时效风险高，跳过</strong></li><li>🟡 <strong>6.3 语音三范式</strong> —— 级联流水线 / 端到端 Omni / 全双工，只读 6.3.1 总览与 6.3.5 快慢分离的结论句；具体范式实现 🔴</li><li>🟡 <strong>6.4 Computer Use</strong> —— 6.4.1 动作空间设计、6.4.2 视觉定位 Grounding、<strong>6.4.4 世界模型（🟡 与具身智能相关）</strong>、6.4.5 移动端生态壁垒（🟢 产品向）</li><li>🔴 <strong>6.5 机器人操作（以 XLeRobot 整理桌面为例）</strong> —— <strong>门槛最高但和你关注方向最相关</strong>：6.5.3 长程规划与任务分解（🟡 可读）、<strong>6.5.4 VLA 控制与 6.5.5 VLA 的局限（只读\"局限\"部分）、6.5.6 世界模型、6.5.7 从仿真到真机</strong>。硬件细节与控制器结构（6.5.1–6.5.2）跳过</li><li>⏭️ 6.6 本章小结 / 6.7 思考题</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=162\" target=\"_blank\" title=\"打开本地文件\">p.162-191 <span class=\"pdf-badge\">📄</span></a> · 异步在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=162\" target=\"_blank\" title=\"打开本地文件\">p.162 <span class=\"pdf-badge\">📄</span></a> · 语音在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=173\" target=\"_blank\" title=\"打开本地文件\">p.173 <span class=\"pdf-badge\">📄</span></a> · Computer Use 在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=179\" target=\"_blank\" title=\"打开本地文件\">p.179 <span class=\"pdf-badge\">📄</span></a> · 机器人在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=184\" target=\"_blank\" title=\"打开本地文件\">p.184 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>6.2 异步与事件驱动</strong>：从\"Agent 主动去取\"到\"世界主动推来\"；事件触发工具、用户沟通工具、虚拟身份与隔离执行环境</li><li><strong>6.3 语音三范式</strong>：级联流水线 → 端到端 Omni → 全双工；快慢分离（前台实时 + 后台深思）</li><li><strong>6.4 Computer Use</strong>：动作空间设计、视觉定位（Grounding）、世界模型、移动端的生态壁垒</li><li><strong>6.5 机器人操作</strong>：长程规划与任务分解、<strong>VLA 控制及其局限</strong>、世界模型、从仿真到真实机器人</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=162\" target=\"_blank\" title=\"打开本地文件\">p.162-191 <span class=\"pdf-badge\">📄</span></a> · 异步在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=162\" target=\"_blank\" title=\"打开本地文件\">p.162 <span class=\"pdf-badge\">📄</span></a> · 语音在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=173\" target=\"_blank\" title=\"打开本地文件\">p.173 <span class=\"pdf-badge\">📄</span></a> · Computer Use 在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=179\" target=\"_blank\" title=\"打开本地文件\">p.179 <span class=\"pdf-badge\">📄</span></a> · 机器人在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=184\" target=\"_blank\" title=\"打开本地文件\">p.184 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">对你的两个用处</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>产品侧：课程 L4「三·UX 五模式」里\"允许接管\"的技术底座在这里——<strong>异步 + 事件驱动 + 状态确认</strong>是同一件事的三种说法</li><li>个人关注：6.5 节（VLA 的局限、世界模型、sim2real）是你跟踪具身智能方向时，少数能同时看到\"能力边界\"和\"工程约束\"的中文一手材料</li></ul></div></details>\n<h3 id=\"h-dbc94c3efe\">第 7 章 · Agent 的评估</h3>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">技术门槛：🟡 半技术但结论最值钱（7.2 / 7.6 / 7.9 为 🟢）—— 全书对你最重要的一章</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>🟡 <strong>7.1</strong> 一条评估任务的解剖（τ²-bench telecom 领域）—— 看任务定义四要素即可，真实轨迹可略读</li><li>✅ <strong>7.2</strong> 评估指标：成功的定义 —— 🟢 <strong>必读</strong>，Pass@k（技术奇观）vs Pass^k（业务可靠性）；<strong>公式可不背，记住两者区别即可</strong></li><li>🟡 <strong>7.3</strong> 评估环境 —— 五个组成要素、两类环境</li><li>🟡 <strong>7.4</strong> 评估数据集的设计 —— 验证器、难度划分、数据泄漏防范、<strong>7.4.6 评估集的三个来源（🟢 读）</strong></li><li>✅ <strong>7.5</strong> 自动化评估方法 —— 🟡 7.5.1 LLM-as-Judge、<strong>7.5.2 失败归因（定位首个错误，🟢 核心）</strong>、7.5.3 端到端 vs 轨迹前缀回归（🟢）、7.5.4 配对比较（🟢）。7.5.2 下的三个代码级案例（old_string mismatch 等）🔴 可跳</li><li>✅ <strong>7.6</strong> 评估驱动的模型选型 —— 🟢 <strong>必读</strong>，选型维度、模型行为策略、<strong>成本分析</strong>；7.6.4 持续迭代</li><li>🟡 <strong>7.7</strong> 评估结果的统计显著性 —— 统计向，只记\"小样本差异不算数\"这一句</li><li>🟡 <strong>7.8</strong> Agent 的可观测性</li><li>✅ <strong>7.9</strong> 从 Benchmark 报告到系统改进 —— 🟢 读懂报告 / 构建改进路线图 / 数据驱动权衡</li><li>🟡 <strong>7.10</strong> 生产级评估基础设施 —— 7.10.1 消融基础设施（🟡 关键）、7.10.2 AB 测试（🟡）、7.10.3 双层特性开关（🟡）</li><li>🟡 <strong>7.11</strong> 仿真环境 —— 与后训练衔接，🟡</li><li>⏭️ 7.12 本章小结 / 7.13 思考题</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=192\" target=\"_blank\" title=\"打开本地文件\">p.192-223 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>7.1–7.2 成功的定义</strong>：τ²-bench 任务解剖；<strong>Pass@k（至少一次成功）vs Pass^k（连续 k 次都成功）</strong></li><li><strong>7.3–7.4 评估环境与数据集</strong>：五个组成要素、验证器、难度划分、数据泄漏防范、<strong>评估集的三个来源</strong></li><li><strong>7.5 自动化方法</strong>：LLM-as-Judge、<strong>失败归因（从整条轨迹定位首个错误）</strong>、端到端回归与轨迹前缀回归、配对比较</li><li><strong>7.6 评估驱动的模型选型</strong>：关键维度、模型的行为策略、<strong>Agent 系统的成本分析</strong></li><li><strong>7.7–7.11</strong>：统计显著性、可观测性、从 Benchmark 到改进路线图、生产级评估基础设施（<strong>消融 + AB + 双层特性开关</strong>）、仿真环境</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=192\" target=\"_blank\" title=\"打开本地文件\">p.192-223 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">这一章是全书对你最值钱的一章</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程 L3 讲了\"要评轨迹、要评会话、要盯在线指标\"——<strong>结论都对，但没给可测量口径</strong>。 这一章补的正是口径，而且给了一个课程完全没有的判断工具：<strong>消融实验 vs 模型替换实验</strong>（见下）。</p></div></details>\n<details class=\"callout co-todo\" data-fold><summary><span class=\"co-icon\">📌</span><span class=\"co-title\">配套实验 · 待做（7.5.1 下的动手作业 · p.205）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-8d307a510d\"><span><strong>实验 7-3 ★★：构建基于 Rubric 的用户记忆评估系统</strong> —— 改造 <code>chapter3/user-memory-evaluation</code> 框架，把单一 LLM-as-a-Judge（通过/失败+理由）升级为结构化多维度 Rubric：事实正确性（Precision）、事实完整性（Recall）、思考正确性、思考主动性、幻觉检测；四档制评分（优秀/良好/及格/不及格）每档配具体判定标准；幻觉维度一票否决；每个维度提供提示示例和边界案例</span></label></li><li><label class=\"task\"><input type=\"checkbox\" data-cb=\"cb-068f0437c2\"><span><strong>实验 7-4 ★★：Advanced JSON Cards 与 RAG 的对比评估</strong> —— 复用两个第三章项目，在 <code>chapter3/user-memory-evaluation</code> 的 60 个测试用例上公平对比三种配置：纯 Advanced JSON Cards（卡片常驻上下文、无需检索）/ 纯 RAG（对话分块入向量库）/ 混合系统（核心事实常驻 + 原始对话按需检索）；同一组问题共 180 条真实 API 运行轨迹（结果见表 7-3）</span></label></li></ul>\n<p>→ <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=205\" target=\"_blank\" title=\"打开本地文件\">《深入理解 AI Agent》7.5.1 配套实验 · p.205 <span class=\"pdf-badge\">📄</span></a> · 同步挂载：L3 动手练习</p></div></details>\n<h3 id=\"h-b5dea4b654\">第 8 章 · 模型后训练</h3>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">技术门槛：🔴🔴 全书最高 —— 只读 8.1，其余整章跳过</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>这一章是给算法工程师写的：SFT 数据合成、RL 算法、奖励设计、在轨蒸馏。</p>\n<ul><li>✅ <strong>8.1</strong> 从预训练到 RL：四阶段全景 —— 🟡 <strong>本节读完就够</strong>（预训练→Mid-training→SFT→RL 各在做什么、什么时候该补底座、SFT 与 RL 的本质区别）</li><li>⏭️ <strong>8.2 / 8.3</strong> 经典 RL Agent / 模型预训练基础 —— 原书自带 [可选阅读] 标注，跳过</li><li>🔴 <strong>8.4–8.13</strong> Mid-training / SFT / 单轮 RL / RL 算法 / RL 环境 / 多轮与信用分配 / 奖励设计 / 蒸馏 —— <strong>整块跳过</strong>，除非你要和算法团队对话</li><li>🟡 <strong>8.14</strong> 从问题案例到后训练 —— ★升格：三个案例（Coding Agent 过早结束 / 中文引号 / 编辑文件经常失败）写得像事故复盘，<strong>可以只读案例，不读方法</strong>——这是\"什么时候该找算法团队\"的决策入口</li><li>⏭️ 8.15 后训练实践要点 / 8.16 本章小结 / 8.17 思考题</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=224\" target=\"_blank\" title=\"打开本地文件\">p.224-263 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">只需记住两句</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>模型能力分四段形成：预训练（通识）→ Mid-training（专业教材）→ SFT（示范答题）→ RL（自己下场做题）</li><li><strong>数据和环境，比算法更重要。</strong> 很多场景只要底座和示范数据到位，甚至不需要做 RL</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=224\" target=\"_blank\" title=\"打开本地文件\">p.224-263 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">产品含义</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>不需要懂 RL。只需要知道：<strong>当你的场景\"再怎么改提示词和工具都不行\"，可能存在一条\"后训练\"的路</strong>—— 这时候该找算法团队，而不是继续逼研发调 prompt。</p></div></details>\n<h3 id=\"h-0fc47ddf56\">第 9 章 · Agent 的持续进化</h3>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">技术门槛：🟡 半技术 —— 9.2 的产品含义比实现重要</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>✅ <strong>9.1</strong> 从运行轨迹中获得学习信号 —— 🟢 读</li><li>✅ <strong>9.2</strong> 持续进化的四种方法 —— 🟢 <strong>★升格</strong>：知识 / 指令 / 程序 / 参数，<strong>可回滚程度从高到低</strong>（9.2.2 的两个例子很实用：转接边界规则化、需求澄清 Skill）；9.2.3.1 DeepSeek Harness 案例 🟡 可看</li><li>🟡 <strong>9.3</strong> 构建可长期运行的持续进化闭环 —— 9.3.1 \"完成 ≠ 进步\"（🟢 值得读）、9.3.2 安全边界、9.3.3 睡眠学习（🟡）</li><li>⏭️ 9.4 本章小结 / 9.5 思考题</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=264\" target=\"_blank\" title=\"打开本地文件\">p.264-279 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>经验的四种沉淀载体，可回滚程度从高到低：<strong>知识（文档）→ 指令（Prompt/Skill）→ 程序（代码）→ 参数（模型权重）</strong> 加上「睡眠学习」（整合、遗忘与能力保鲜）和持续进化的安全边界</p>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=264\" target=\"_blank\" title=\"打开本地文件\">p.264-279 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">一个容易被跳过的洞见</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>保存经历 ≠ 从经历中学习。</strong> 把轨迹存进记忆库，不会自动产生跨案例比较。 学习发生在系统主动完成「评价、对照、归纳、验证」之后——这对你设计\"Agent 能不能越用越好\"的产品承诺，是直接的约束。</p></div></details>\n<h3 id=\"h-b749f6c716\">第 10 章 · 多 Agent 协作</h3>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">技术门槛：🟢 概念型（10.4 为 🟡）—— 除了 10.4 的拓扑细节，全章都好读</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>✅ <strong>10.1</strong> 多 Agent 协作的分类框架 —— 🟢 两个维度：上下文是否共享 / 协作拓扑</li><li>✅ <strong>10.2</strong> 多 Agent 何时真正优于单 Agent —— 🟢 <strong>本章最值钱一节</strong></li><li>✅ <strong>10.3</strong> 共享上下文的多 Agent 协作 —— 🟢 短</li><li>🟡 <strong>10.4</strong> 不共享上下文的多 Agent 协作 —— 10.4.1 文件系统视角（🟢）、10.4.2 通信与控制（🟡）、<strong>10.4.3 对等协作模式（含提议者-审核者、辩论、头脑风暴、专家小组，🟢 与第 1 章设计模式呼应）</strong>、10.4.4 管理者模式、10.4.5 去中心化、10.4.6 A2A 协议（A2A 部分半年即过时）</li><li>✅ <strong>10.5</strong> 多 Agent 协作的失败模式 —— 🟢 <strong>必读</strong>，六种失败模式是评审用的\"防坑清单\"</li><li>🟡 <strong>10.6</strong> Agent 社会 —— 案例向，当故事读；斯坦福 AI 小镇 / Agentopia / Moltbook / Vending-Bench / 狼人杀，挑感兴趣的看，产品名时效风险高</li><li>⏭️ 10.7 本章小结 / 10.8 思考题</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=280\" target=\"_blank\" title=\"打开本地文件\">p.280-310 <span class=\"pdf-badge\">📄</span></a> · 失败模式在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=301\" target=\"_blank\" title=\"打开本地文件\">p.301 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">核心内容</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>10.1–10.2 分类与判断</strong>：两个维度（上下文是否共享 / 协作拓扑）；<strong>多 Agent 何时真正优于单 Agent</strong></li><li><strong>10.3–10.4 拓扑</strong>：共享上下文 / 隔离上下文（虚拟文件系统、通信与控制、对等协作、管理者、去中心化、A2A）</li><li><strong>10.5 六种失败模式</strong>：并发冲突 / 级联放大 / 同质趋同 / 互相扯皮 / 循环失控 / <strong>理解债与认知投降</strong></li><li><strong>10.6 Agent 社会</strong>：斯坦福 AI 小镇、长期生活模拟、Agent 社交网络、经济竞争、狼人杀博弈</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=280\" target=\"_blank\" title=\"打开本地文件\">p.280-310 <span class=\"pdf-badge\">📄</span></a> · 失败模式在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=301\" target=\"_blank\" title=\"打开本地文件\">p.301 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">第一判断标准</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>是否真正带来信息增量、是否值得额外的 token 成本。</strong> 如果多个 Agent 只是把同一个模型的同一条思维链拆开跑，那不叫多 Agent，叫多花钱。</p></div></details>\n<h3 id=\"h-03478d9737\">后记：回到 Agent = LLM + 上下文 + 工具</h3>\n<details class=\"callout co-quote\"><summary><span class=\"co-icon\">❝</span><span class=\"co-title\">技术门槛：🟢 概念型 —— 10 分钟，必读</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>✅ <strong>两朵乌云</strong> —— 实时性 + 持续学习两个前沿，判断方向用的锚</li><li>✅ <strong>模型与 Agent 的共同演进</strong> —— 模型每内化一层约束，就会抹平一批只靠 Harness 建立的优势</li></ul>\n<p>定位：<a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=311\" target=\"_blank\" title=\"打开本地文件\">p.311-313 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<hr>\n<h2 id=\"h-09bb1ed76f\">本书比课程深在哪（三条必补）</h2>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">这三条建议进课程的正文（暂未改，见 <a class=\"wl\" href=\"#/p-380ab2d43a\">课程框架评审 · 2026-09-30</a>）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p><strong>1. 可靠性有了可测量口径。</strong>（来源 🟢 7.2） 课程 <a class=\"wl\" href=\"#/p-b8fd5efc92\">卡A · 可靠性判断卡</a> 用的是\"每步 95%、10 步约 60%\"的连乘估算。本书给了两个正式指标：</p>\n<ul><li><strong>Pass@k = 1 − (1−p)^k</strong>（k 次里至少成功一次）→ 看能力上限，适合探索类任务</li><li><strong>Pass^k = p^k</strong>（连续 k 次每次都成功）→ 看业务可靠性，适合支付、退款、权限变更</li></ul>\n<p>单次成功率 0.6 时：Pass@5 ≈ <strong>99%</strong>，Pass^5 ≈ <strong>7.8%</strong>。前者是\"技术奇观\"，后者才是能上线的标准。 另外一条硬约束：<strong>会产生副作用的操作不能\"重试到成功\"</strong>，必须在沙盒或可回滚环境里采样。 💡 <strong>零基础口径：这两个公式不用背</strong>，记住\"连续 k 次都成功 ≠ k 次里成功一次\"这个区别即可——区别本身比公式值钱。 → <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=196\" target=\"_blank\" title=\"打开本地文件\">p.196-197 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">2. 有了区分\"模型问题\"和\"Harness 问题\"的方法。（来源 🟡 7.6 + 7.10.1）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程 L3 只说\"先分类失败再动手\"，但没给工具。本书给两个：</p>\n<ul><li><strong>消融实验</strong>：固定模型，逐一关闭 Harness 的某个组件 → 定位<strong>Harness 内部哪个部件重要</strong></li><li><strong>模型替换实验</strong>：固定 Harness，只换更强/更弱的模型 → 区分<strong>瓶颈在模型还是在 Harness</strong></li></ul>\n<p>读法：换强模型分数不涨 → 瓶颈在 Harness；换弱模型分数大跌 → 瓶颈在模型能力本身。 配套数据点：<strong>不换模型、只改 Harness，准确率从 52.8% 提到 66.5%。</strong> → <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=211\" target=\"_blank\" title=\"打开本地文件\">p.211-215 <span class=\"pdf-badge\">📄</span></a> · 消融与 AB 在 <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=219\" target=\"_blank\" title=\"打开本地文件\">p.219-221 <span class=\"pdf-badge\">📄</span></a></p></div></details>\n<details class=\"callout co-example\"><summary><span class=\"co-icon\">🧪</span><span class=\"co-title\">3. 上下文工程从\"三条认知\"变成了\"三条可提的要求\"。（来源 🔴 2.3 / 2.5 / 2.7 —— 只需拿结论）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>课程 L2 说\"上下文是有限资源\"。本书给了三个可以写进 PRD 的约束：</p>\n<ul><li><strong>前缀稳定性</strong>：上下文前缀（系统提示词 + 工具定义）越稳定，缓存命中越高；改动越靠前，作废越多</li><li><strong>Skills 的加载方式</strong>：元数据常驻、正文按需——这是\"渐进式披露\"在上下文里的具体形态</li><li><strong>压缩 vs 隔离</strong>：压缩有信息损失，隔离（子 Agent 独立上下文）没有——<strong>优先隔离</strong></li></ul>\n<p>→ <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=50\" target=\"_blank\" title=\"打开本地文件\">p.50-59 <span class=\"pdf-badge\">📄</span></a> · <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=64\" target=\"_blank\" title=\"打开本地文件\">p.64-69 <span class=\"pdf-badge\">📄</span></a> · <a class=\"wl pdf-link\" href=\"AI-Agents-in-Depth-zh-CN.pdf#page=74\" target=\"_blank\" title=\"打开本地文件\">p.74-79 <span class=\"pdf-badge\">📄</span></a> ⚠️ 这三条来自书中<strong>技术门槛最高</strong>的两节，<strong>按\"读结论、不读推导\"的方式取用</strong>。</p></div></details>\n<hr>\n<h2 id=\"h-10570d7df8\">课程比本书强在哪（别丢）</h2>\n<details class=\"callout co-success\"><summary><span class=\"co-icon\">✅</span><span class=\"co-title\">这是你的护城河，本书完全没有</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><div class=\"table-wrap\"><table><thead><tr><th>课程独有</th><th>为什么本书给不了</th></tr></thead><tbody><tr><td><a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a> 的 PRD 六要素、UX 五模式、竞品体验清单</td><td>本书作者是模型侧/Agent 架构侧的工程视角，不写产品交付物</td></tr><tr><td><a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a> 的五类不该做 + 降级路径</td><td>本书默认\"要做\"，只在编排模式里提了一句\"从最简单开始\"</td></tr><tr><td><a class=\"wl\" href=\"#/p-25d04356d0\">卡B · 成本与延迟判断卡</a> 的产品化红线（延迟 P95、成本上限）</td><td>本书讲成本分析的方法，不讲\"用户会等多久\"</td></tr><tr><td>上线四步（灰度 / 对照 / 预期管理 / 兜底）</td><td>本书不涉及发布节奏与预期管理</td></tr><tr><td><a class=\"wl\" href=\"#/p-2d90c79ec9\">卡D · 科研场景专项卡</a> 的四条硬红线</td><td>本书没有按行业场景做产品约束</td></tr></tbody></table></div>\n<p><strong>一句话：本书是\"怎么造\"，课程是\"要不要造、造给谁、怎么验收\"。</strong> 别因为拿到一本 42 万字的书，就把课程改造成工程手册——那等于把唯一不可替代的部分删掉。</p></div></details>\n<hr>\n<h2 id=\"h-84fcef97a3\">一个口径冲突：RAG</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">表面矛盾，实际不矛盾——但必须标注，否则会误读</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li><strong>课程 L2</strong>：「长上下文降价后，'要不要上 RAG'不再是默认答案。先算：文档全塞进去要多少 token、多少钱、多慢」</li><li><strong>本书第 3 章</strong>：用约 30 页讲 RAG 全流水线（分块 / 嵌入 / 混合检索 / 重排序），<strong>技术门槛 🔴</strong></li></ul>\n<p><strong>不矛盾，但层次不同：</strong> 本书讲的是\"如果要做知识库/长期记忆，工程上怎么做\"；<strong>篇幅长不等于推荐做</strong>。 课程讲的是\"先判断要不要做\"——这个判断仍然成立，而且优先级更高。</p>\n<p><strong>正确的读法</strong>：先过一遍 <a class=\"wl\" href=\"#/p-a7068eac22\">卡C · 不该做清单</a>，确认要做，再翻第 3 章当施工图（且只读 3.1 与 3.3）。 反向读（先看施工图再做决策）正是课程反复警告的\"被 demo 绑架\"。</p></div></details>\n<hr>\n<h2 id=\"h-b96baa9c10\">时效风险</h2>\n<details class=\"callout co-warning\"><summary><span class=\"co-icon\">⚠️</span><span class=\"co-title\">引用纪律：只取结构，不取数字和产品名</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><p>本书是 2026 年上半年的快照。以下内容<strong>半年内就可能过时</strong>，引用时要降级处理：</p>\n<ul><li>具体产品名：OpenClaw、Manus、Pine、豆包手机助手、GPT-6 Astra、小米 MiMo、Taalas HC1</li><li>具体数字：52.8% → 66.5%、1000 token/s、17000 token/s</li><li>具体基准：τ²-bench、Terminal-Bench、SWE-bench、GAIA、OSWorld</li><li>上下文长度与定价相关的一切</li></ul>\n<p><strong>可以安全引用的</strong>是结构性结论：Harness 有杠杆、模型会一层层内化 Harness、Pass@k 与 Pass^k 的区别、六种多 Agent 失败模式。 这与总纲「每条资料都标核对时间」是同一纪律。</p>\n<p>补充：产品名与实现细节最密集的正是 🔴 章节（2.3 缓存实现、3.2 RAG 流水线、5.1 工具实现、6.2 OpenClaw、8 后训练）， <strong>这也算技术门槛标注的一个附带好处——🔴 的地方本来就最容易过期。</strong></p></div></details>\n<hr>\n<h2 id=\"h-912bc5dff3\">本次拆散清单</h2>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">这次对课程体系做了什么（全部为新增，未删除任何原有内容）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>✅ 新增本导读 + <a class=\"wl\" href=\"#/p-380ab2d43a\">课程框架评审 · 2026-09-30</a></li><li>✅ 书籍文件入库：<code>AI-Agents-in-Depth-zh-CN.pdf</code>（313 页）+ <code>.epub</code></li><li>✅ <a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a>：文件索引加 2 行；「2026 关键变化备忘」加第 7 条（Harness 是竞争力所在）</li><li>✅ <a class=\"wl\" href=\"#/p-ab1ca3904e\">L1 · 语言层 · 能听懂</a>：第 1 章挂进模型生态小节</li><li>✅ <a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a>：6 个小节各挂对应章节（复杂度三档 / 七积木 / ACI / 上下文工程 / MCP / RAG）</li><li>✅ <a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a>：第 7 章挂进评测体系，并新增「瓶颈定位」条目</li><li>✅ <a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a>：第 6 章挂进 UX 五模式</li><li>✅ <a class=\"wl\" href=\"#/p-0d73a9e275\">术语速查表</a>：新增「工程与评估（本书补充）」一组</li><li>✅ 卡A / 卡B / 卡C / 卡D：延伸阅读各加一条对应章节</li></ul>\n<p><strong>未改动</strong>：课程的四层骨架、原有每一条资料、原来的三张表结构。 框架层面的修改建议单独放在 <a class=\"wl\" href=\"#/p-380ab2d43a\">课程框架评审 · 2026-09-30</a>，等你确认后再动手。</p></div></details>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">2026-10-03 修订（评审回炉）</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>✅ <strong>投入估计修正</strong>：8-10h → <strong>约 10-14h</strong>（第 1 章 + 第 7 章精读按 6-7h 计）</li><li>✅ <strong>7.2 口径修正</strong>：Pass@k / Pass^k 标\"公式可不背\"，对齐零基础学习口径</li><li>✅ <strong>消除内部不一致</strong>：第 4 章\"建议整章读\"→\"建议 4.1–4.4 读\"；第 5 章挂载状态更新（L2 已落地「代码作为元能力」横切补充）</li><li>✅ <strong>三处升格（★）</strong>：3.1 用户记忆（科研助手相关）、9.2 进化四方法（\"越用越好\"承诺）、8.14 三案例（后训练决策入口）；第 9 章从\"可以跳过\"改为\"建议\"</li><li>✅ 「产品人读法」表新增 2.4 提示工程、3.1 两行</li></ul>\n<p>[!note] 2026-10-02 修订</p>\n<ul><li>✅ 核对原书 epub 目录，<strong>逐章补全带编号的小节清单</strong>（新增「逐章说明」整节，10 章 + 引言 + 后记）</li><li>✅ 新增<strong>技术门槛三级标注</strong>（🟢 / 🟡 / 🔴）与图例：每章、每建议小节都标了</li><li>✅ 「产品人读法」表新增技术门槛列；把原\"建议\"里的 2.3、2.7 明确降级为 🔴 并给出\"只拿结论\"的读法</li><li>✅ 「逐章地图」表新增技术门槛列 + 全书门槛分布速览</li><li>⏳ <strong>未做、待你确认</strong>：L1–L4 各层挂载点、卡A–卡D 延伸阅读里，是否也要补上同样的门槛标记（保持一致）</li></ul></div></details>\n<hr>\n<details class=\"callout co-note\"><summary><span class=\"co-icon\">📝</span><span class=\"co-title\">导航</span><span class=\"co-arrow\">▸</span></summary><div class=\"co-body\"><ul><li>总纲：<a class=\"wl\" href=\"#/p-e1179c393a\">00 · 学习总纲</a></li><li>框架评审：<a class=\"wl\" href=\"#/p-380ab2d43a\">课程框架评审 · 2026-09-30</a></li><li>四层主干：<a class=\"wl\" href=\"#/p-ab1ca3904e\">L1 · 语言层 · 能听懂</a> · <a class=\"wl\" href=\"#/p-d0a41b3ec4\">L2 · 结构层 · 能选型</a> · <a class=\"wl\" href=\"#/p-efd386edd2\">L3 · 判断层 · 能评估</a> · <a class=\"wl\" href=\"#/p-7d408737b8\">L4 · 落地层 · 能交付</a></li><li>在线版（可全文搜索）：https://bojieli.github.io/ai-agent-book/</li></ul></div></details>", "search": " 📝 这份文件是什么 ▸ 《深入理解 AI Agent》是 工程实现视角 的教材；本套课程是 产品判断视角 的框架。 这份导读做四件事： ① 给全书地图；② 标出每章挂到课程的哪一层；③ 逐章说明每一节读不读；④ 标出每章的技术门槛。 它不替代原书，也不重复原书——目标是 用最少的时间，把这本书变成课程的可调用资料 。 ⚠️ 先看这条：这本书不值得通读 ▸ 42 万字符、90+ 个实验，主体是工程实现细节。对产品经理，逐章精读是巨大的时间浪费。 推荐投入：第 1 章 + 第 7 章精读（约 6-7h），其余按需查阅 ——总计约 10-14h 能吃透真正有用的部分。 全书有 4 章技术门槛为 🔴 （第 2、3、5、8 章），读它们时默认\"只取结论，不抠实现\"。 💡 技术门槛图例（本次新增，配合逐章说明使用） ▸ 标在每章、每小节前面，回答一个问题： 这一节要花多少技术耐心？ 标记 含义 怎么读 🟢 概念型 不需要技术背景，结论就是产品语言 正常读，读完可直接用于评审 🟡 半技术 有工程概念，但落点是设计取舍 读，但跳过代码块、公式与参数名，只看\"所以呢\" 🔴 偏技术 讲机制、代码、参数或数学 只取结论与判断标准 ；看不懂的段落直接跳过，不要停下来啃 一句话： 🟢 可以精读，🟡 读结论，🔴 拿结论走人。 标 🔴 不代表不值得读，代表\"投入产出比低，别陷进去\"。 💡 一句话定位 ▸ 课程 回答：这个方案好不好？该不该做？怎么验收？ 本书 回答：这个方案具体怎么实现？卡在哪？有哪些坑？ 前者决定 方向 ，后者决定你 该向研发提什么要求 。两者不重复，但深度差一个量级。 目录 产品人读法 逐章地图 逐章说明 本书比课程深在哪（三条必补） 课程比本书强在哪（别丢） 一个口径冲突：RAG 时效风险 本次拆散清单 产品人读法 💡 按这个顺序读，别按章号读 ▸ 优先级 读什么 门槛 页码 为什么 必读 第 1 章（全章） 🟢 p.15-37 📄 全书概念地图：核心公式、Harness 工程、5 个设计模式、3 层护栏 必读 7.2 评估指标 🟢 p.196-197 📄 Pass@k 与 Pass^k 的区别——直接修正课程 卡A · 可靠性判断卡 的口径。 公式可不背，记住两者区别即可 必读 7.5 自动化评估方法 🟡 p.201-211 📄 失败归因（定位首个错误）、轨迹前缀回归、配对比较。7.5.2 里的代码级案例可跳 必读 7.6 评估驱动的模型选型 🟢 p.211-215 📄 模型替换实验 vs 消融实验、成本分析——课程最缺的判断工具 建议 2.4 提示工程（2.4.1–2.4.4） 🟡 p.60-63 📄 ★ 评审系统提示词 / 工具描述质量的基础；价值高于 2.5/2.6，别跳过 建议 2.3 KV Cache 🔴🔴 p.50-59 📄 全章最技术 。只拿一句：前缀越稳定、缓存命中越高，改动越靠前作废越多。2.3.1/2.3.2 原理可跳 建议 2.5 Agent Skills 🟡 p.64-69 📄 元数据常驻、正文按需——课程的\"渐进式披露\"在这里有实现形态 建议 2.7 上下文压缩 🔴 p.74-79 📄 只拿结论： 隔离优于压缩 。2.7.2 上下文学习机制属研究向，可跳 建议 4.2–4.4 工具设计 🟡 p.112-122 📄 能力形态决策、工具描述、工具太多的四种应对。4.2.1 的形态权衡是决策类，值得读 建议 10.2 多 Agent 何时真值 🟢 p.281-283 📄 一句判断标准： 是否带来信息增量、是否值这份 token 成本 建议 10.5 六种失败模式 🟢 p.301-303 📄 评审时的\"防坑清单\"，写得像事故复盘，无技术负担 建议 5.1.5 故障与错误恢复 🟡 p.136-138 📄 可靠性问题的工程解；同章其余小节（5.1.6–5.1.8）是实现技巧，🔴 可跳 建议 3.1 用户记忆系统（★升格） 🟡 p.81-89 📄 科研助手直接相关：三层次评估框架 + 3.1.8 隐私脱敏 建议 后记 · 两朵乌云 🟢 p.311-313 📄 判断方向用的锚：实时性 + 持续学习两个前沿 知道即可 第 3、6 章 🔴 / 🟡 — 记忆与知识库（🔴）、交互扩展（🟡，但 6.5 机器人为 🔴）——按需查 可以跳过 第 8 章 RL 细节 🔴🔴 — 除非你要和算法团队对话；只读 8.1 四阶段全景 + 8.14 三个案例即可 建议 第 9 章持续进化（★升格） 🟢 p.264-279 📄 9.2 四种进化载体决定\"越用越好\"承诺怎么兑现；9.1–9.3 全读 ⚠️ 关于\"建议读\"里那几条偏技术的 ▸ 上面标注里， 2.3（KV Cache）和 2.7（上下文压缩）是 🔴 ，原始清单把它们列为\"建议\"是按 内容重要性 排的，不是按 好读程度 排的。 这两节的正确打开方式： 先读该节的小标题和每节末尾的结论段，拿到可写进 PRD 的那一句约束，然后合上。 中间的原理推导、缓存结构图、实现对比表，属于研发的活，读了也用不上。 📝 如何跟课程配合 ▸ 每章的具体挂载点见下面「逐章地图」和「逐章说明」，也 已经写进 L1-L4 各层的资料清单 —— 你按课程顺序学的时候，遇到对应小节就会看到这本书的章节入口，不用回来查这张表。 逐章地图 ℹ️ 十章的骨架与挂载点 ▸ 章 主题一句话 门槛 挂载层 产品人怎么用 引言 成书背景：实践在前，命名在后 🟢 — 5min 扫过，理解作者是\"做 Agent 产品的人\"不是\"讲概念的人\" 1 Agent = LLM + 上下文 + 工具；Harness 工程 🟢 L1 全层 + L2「一·复杂度三档」 必读，当全书地图 2 API 消息结构 / KV Cache / Skills / 状态栏 / 压缩 🔴 L2「四·上下文工程」 选读 2.3、2.5、2.7；其中 2.5 为 🟡，2.3 / 2.7 按\"拿结论\"读 3 用户记忆 + 共享知识库 + RAG 全流水线 🔴 L2「六·RAG 与 Memory」 读 3.1（含 3.1.8 隐私，★）+ 3.3（3.3.4 必读）；嵌入原理整块跳过 4 五类工具 / 能力形态 / MCP + Skill Hub / 工具太多 🟡 L2「三·ACI」+「五·MCP」 读 4.2–4.4，是全书最\"产品向\"的一章 5 通用 Agent = Coding Agent + 文件系统；代码是元能力 🔴 课程已挂 L2「代码作为元能力」横切补充 （5.1 工程主体仍无对应） 读 5.1.5 + 5.2 全节（5.2 为 🟢）；5.1.6–5.1.8 是实现技巧，可跳 6 异步事件 / 语音 / Computer Use / 机器人 VLA 🟡 L4「三·UX 五模式」的技术底座 读 6.2 + 6.4.4 + 6.5；6.5 机器人为 🔴，与具身智能直接相关 7 l Hub 用包管理器分发 SKILL.md 4.4 工具太多的四种应对 ：层次化组织 → 按需加载 → 模型原生主动发现 → Skills 把发现变成\"按需查阅\" 4.5–4.7 三类工具 ：感知 / 执行 / 协作（协作工具 = 子 Agent 的生命周期原语） 定位： p.111-129 📄 · 工具描述在 p.114 📄 ✅ 这一章直接可用的两个概念 ▸ 防呆（Poka-yoke） ：从设计上让错误无法发生（SIM 卡缺角、微波炉门没关不加热）——比\"教模型别犯错\"可靠得多 参数保真 ：模型以为它传了什么、系统实际执行了什么，必须是同一个东西——这是安全边界 第 5 章 · Coding Agent 与通用 Agent ⚠️ 技术门槛：🔴 偏技术（5.1.5 为 🟡、5.2 为 🟢）—— 5.1 大半是工程实现 ▸ 章内门槛落差很大： 前半（Coding Agent 怎么造）🔴，后半（代码作为元能力）🟢。 🟡 5.1.1–5.1.2 Coding 是基础能力 / Manus→OpenClaw 案例 —— 读，理解\"Coding 内核\" 🔴 5.1.3–5.1.4 整体流程 / Harness 实践 —— 实现细节，只看流程图结论 ✅ 5.1.5 故障与错误恢复 —— 🟡 可靠性问题的工程解，对应 卡A · 可靠性判断卡 ， 本章唯一必读小节 ⏭️ 5.1.6–5.1.8 实现技巧 / 搜索工具 / 文件编辑工具 —— 🔴 纯工程 🟡 5.1.9 Coding Agent 的安全 —— 结论可读 ✅ 5.2 代码：通用 Agent 的元能力 —— 🟢 整节必读 ，六个方向全是产品视角（思考工具 / 业务规则约束 / 多媒体生成 / 系统适配器 / 生成式 UI / Agent 自举） ⏭️ 5.3 本章小结 / 5.4 思考题 定位： p.130-161 📄 · 错误恢复在 p.136 📄 · 代码六方向在 p.144 📄 ❝ 核心内容 ▸ 5.1 Coding Agent ：通用 Agent = Coding Agent + 文件系统；Coding Agent 的整体流程、Harness 实践、 故障与错误恢复 、搜索与文件编辑工具的设计、安全 5.2 代码作为元能力 （六个方向）：思考工具 / 业务规则约束 / 多媒体生成 / 系统适配器 / 生成式 UI / Agent 自举 定位： p.130-161 📄 · 错误恢复在 p.136 📄 · 代码六方向在 p.144 📄 ⚠️ 这是课程最薄的一整块（已挂横切，主体仍无对应） ▸ 课程 L2 已用「代码作为元能力」横切补充接住 5.2，但 5.1 的工程主体仍无对应。本书认为 通用性的来源就是代码 + 文件系统 。 产品含义：当研发说\"这个需求要做个新工具\"，你可以反问一句 \"能不能让 Agent 自己写代码解决？\" 第 6 章 · 交互：观察与动作空间的扩展 📝 技术门槛：🟡 半技术（6.2 / 6.4 可读，6.5 为 🔴）—— 6.5 是你的具身智能专区 ▸ ✅ 6.1 模态与触发时机的扩展 —— 🟢 引子，读 ✅ 6.2 异步与事件驱动 —— 🟡 6.2.1 为什么需要异步（🟢）、6.2.3 事件触发工具（🟢）、6.2.4 用户沟通工具（🟢）、6.2.5 虚拟身份与隔离执行环境（🟡）、6.2.9 从\"能接收\"到\"可靠处理\"（🟢）； 6.2.2 OpenClaw 实现、6.2.7 兼容方案、6.2.8 GPT-6 Astra 属 🔴 且时效风险高，跳过 🟡 6.3 语音三范式 —— 级联流水线 / 端到端 Omni / 全双工，只读 6.3.1 总览与 6.3.5 快慢分离的结论句；具体范式实现 🔴 🟡 6.4 Computer Use —— 6.4.1 动作空间设计、6.4.2 视觉定位 Grounding、 6.4.4 世界模型（🟡 与具身智能相关） 、6.4.5 移动端生态壁垒（🟢 产品向） 🔴 6.5 机器人操作（以 XLeRobot 整理桌面为例） —— 门槛最高但和你关注方向最相关 ：6.5.3 长程规划与任务分解（🟡 可读）、 6.5.4 VLA 控制与 6.5.5 VLA 的局限（只读\"局限\"部分）、6.5.6 世界模型、6.5.7 从仿真到真机 。硬件细节与控制器结构（6.5.1–6.5.2）跳过 ⏭️ 6.6 本章小结 / 6.7 思考题 定位： p.162-191 📄 · 异步在 p.162 📄 · 语音在 p.173 📄 · Computer Use 在 p.179 📄 · 机器人在 p.184 📄 ❝ 核心内容 ▸ 6.2 异步与事件驱动 ：从\"Agent 主动去取\"到\"世界主动推来\"；事件触发
